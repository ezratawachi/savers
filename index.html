<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAVERS</title>
<meta name="description" content="Rutina matutina SAVERS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SAVERS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3F2EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10151F" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  /* "Amanecer", taken from the icon: night blue base, terracotta = done (and nothing else), sky blue = now and links. */
  --bg:#F3F2EE; --surface:#FFFFFF; --surface-2:#ECEAE4; --ink:#1B2538; --muted:#5E6677;
  --line:#E0DDD6; --edge:#E3E1DB; --shadow:0 1px 2px rgba(16,21,31,.06);
  --dawn:#E27D60; --dawn-ink:#1B2538; --dawn-soft:#F9E4DC; --dawn-line:transparent; --sky:#3B5A8C; --ok:#2F7D5B; --warn:#B42318;
  --press:rgba(16,21,31,.05); --ease:cubic-bezier(.22,1,.36,1);
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Helvetica Neue", Arial, system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151F; --surface:#1B2538; --surface-2:#263149; --ink:#E6E9F0; --muted:#9AA3B5;
    --line:#3A4660; --edge:rgba(255,255,255,.08); --shadow:none;
    --dawn:#E27D60; --dawn-ink:#10151F; --dawn-soft:#1B2538; --dawn-line:rgba(226,125,96,.5); --sky:#9DB4DB; --ok:#5DC093; --warn:#FF8A7A; --press:rgba(255,255,255,.06);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151F; --surface:#1B2538; --surface-2:#263149; --ink:#E6E9F0; --muted:#9AA3B5;
  --line:#3A4660; --edge:rgba(255,255,255,.08); --shadow:none;
  --dawn:#E27D60; --dawn-ink:#10151F; --dawn-soft:#1B2538; --dawn-line:rgba(226,125,96,.5); --sky:#9DB4DB; --ok:#5DC093; --warn:#FF8A7A; --press:rgba(255,255,255,.06);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
html,body{overflow-x:clip;max-width:100%}
/* horizontal drags (back from the edge, months) are the app's; vertical ones stay the page's scroll */
html{touch-action:pan-y}
html.dragging,html.dragging *{-webkit-user-select:none;user-select:none}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
img{max-width:100%}
button,input,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;-webkit-appearance:none;appearance:none}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:6px}
.wrap{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}

/* top */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top-l{min-width:0}
.hello{font-family:var(--display);font-weight:700;font-size:.92rem;color:var(--muted);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.date{font-family:var(--display);font-weight:800;font-size:1.4rem;line-height:1.15;margin:0;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:.8rem;color:var(--warn)}
.chip{flex:0 0 auto;display:inline-block;padding:3px 10px;border-radius:999px;background:var(--surface-2);font-size:.8rem;font-weight:700;white-space:nowrap}
button.chip{border:0;cursor:pointer;color:inherit;padding:6px 12px;transition:transform .25s var(--ease)}
button.chip:active{transform:scale(.97);transition-duration:.08s}
button.chip span{font-weight:400;margin-left:2px}

.banner{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:var(--surface-2);display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.92rem}
.linkbtn{background:none;border:0;color:var(--sky);font-weight:700;cursor:pointer;padding:6px 0;white-space:nowrap;transition:opacity .2s ease}
/* text buttons dim on touch-down, like iOS */
.linkbtn:active,.tbtn:active{opacity:.5;transition-duration:0s}

/* hero letters */
.hero{margin:14px 0 4px}
/* the six letters only show progress, so they read as a word, not as buttons; marking happens in the cards */
.letters{display:flex;gap:5px}
.lt{font-family:var(--display);font-weight:800;font-size:1.5rem;line-height:1.1;letter-spacing:-0.01em;color:var(--muted);opacity:.45;transition:color .15s ease-out,opacity .15s ease-out}
.lt.done{color:var(--dawn);opacity:1}
.progress{display:flex;justify-content:space-between;align-items:center;margin-top:4px;font-size:.88rem;color:var(--muted)}
.progress strong{color:var(--ink)}
.progress .linkbtn{padding:10px 0}
.bar{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--dawn);width:0;transition:width .3s ease}

/* cards */
.list{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border-radius:16px;border:1px solid var(--edge);box-shadow:var(--shadow);transition:background-color .3s ease,border-color .3s ease,box-shadow .3s ease}
.card>summary,.card>.cardrow{list-style:none;display:flex;align-items:center;gap:12px;padding:10px 12px}
.card>summary{cursor:pointer;border-radius:15px;transition:background-color .15s ease-out}
/* pressing the row (not its circle) highlights it, like an iOS list row */
.card>summary:active:not(:has(label.chk:active)){background:var(--press);transition-duration:0s}
details.card>summary::-webkit-details-marker{display:none}
.chk{flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:transparent;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:1.05rem;color:var(--muted);padding:0;
  transition:transform .25s var(--ease),background-color .15s ease-out,border-color .15s ease-out,color .15s ease-out}
/* feedback on touch-down; it fills on release with no bounce, together with the pop and the haptic */
label.chk:active{transform:scale(.94);transition:transform .08s ease-out}
.chk.done{background:var(--dawn);border-color:var(--dawn);color:var(--dawn-ink)}
.ttl{flex:1;min-width:0;transition:opacity .3s ease}
.ttl b{display:block;font-size:1rem}
.ttl span{display:block;font-size:.84rem;color:var(--muted)}
.time{font-size:.84rem;font-weight:700;color:var(--muted);white-space:nowrap}
/* a row with nothing inside keeps the caret's width so every time lines up */
.nocaret{flex:0 0 auto;width:16px}
.caret{flex:0 0 auto;width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 4px 4px 2px;transition:transform .32s var(--ease),margin .32s var(--ease)}
details[open]:not(.closing)>summary .caret,.entry.open .caret{transform:rotate(-135deg);margin-bottom:-2px}
.body{padding:0 14px 14px}
.bhead{margin:10px 4px 0;font-size:.84rem;color:var(--muted)}
.list .bhead:first-child{margin-top:0}
.bhead b{font-family:var(--display);color:var(--ink)}
.card.now{border-color:var(--sky)}
.ttl .now-tag{display:none;margin-left:8px;padding:1px 8px;border-radius:999px;background:var(--sky);color:var(--bg);font-size:.72rem;font-weight:700;line-height:1.5;vertical-align:2px}
.card.now .ttl .now-tag{display:inline-block}
.card.done .ttl{opacity:.5}
/* done: a plain row, the filled circle says it all; reopened (Escritura, a repeat) it gets its box back */
.card.done{background:transparent;box-shadow:none;border-color:transparent}
.card.done[open]:not(.closing){background:var(--surface);border-color:var(--edge)}
.card.done>summary,.card.done>.cardrow{padding-top:6px;padding-bottom:6px}
.card.done .ttl span,.card.done .time,.card.done .caret{display:none}
/* a finished stretch of the day folded into one row */
.card.fold{background:transparent;box-shadow:none;border-color:transparent}
.card.fold>summary{padding-top:6px;padding-bottom:6px}
.card.fold .chk{cursor:inherit}
.fold .ttl small{font-size:.92rem;font-weight:400;color:var(--muted)}
.fold>.list{margin:2px 0 0;padding:0 8px 10px}

/* finished morning */
.finish{margin-top:16px;padding:22px 18px 18px;border-radius:18px;background:var(--dawn-soft);border:1px solid var(--dawn-line);text-align:center}
.finish .big{width:64px;height:64px;margin:0 auto 10px;border-radius:50%;background:var(--dawn);color:var(--dawn-ink);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:800}
.finish h2{font-family:var(--display);font-weight:800;font-size:1.6rem;margin:0}
.finish p{margin:4px 0 0;color:var(--muted);font-size:.92rem}
.finish p strong{color:var(--ink)}
.finish-wrap{overflow:hidden}
.body p{margin:0 0 8px}
.body ol,.body ul{margin:0 0 8px;padding-left:20px}
.body li{margin-bottom:6px}
.note{font-size:.88rem;color:var(--muted)}
.affs p{margin:0 0 16px;line-height:1.6}
.affs p:last-child{margin-bottom:10px}

/* timer */
.timer{margin:4px 0 12px;padding:14px;border-radius:14px;background:var(--surface-2)}
.tm-now{font-family:var(--display);font-weight:700;font-size:1.15rem}
.tm-next{font-size:.85rem;color:var(--muted);min-height:1.2em}
.tm-clock{font-family:var(--display);font-weight:800;font-size:2.8rem;line-height:1;margin:8px 0 6px;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;background:var(--surface);border:1px solid var(--line);transition:transform .25s var(--ease)}
.btn:active{transform:scale(.97);transition-duration:.08s}
.btn.primary{background:var(--dawn);border-color:var(--dawn);color:var(--dawn-ink)}
.timer.is-done .tm-clock,.timer.is-done .bar,.timer.is-done [data-act="skip"]{display:none}
.timer.is-done .btn.primary{background:var(--surface);border-color:var(--line);color:var(--ink)}
.timer[data-run="visualizacion"] [data-r="next"]{font-size:1.02rem;line-height:1.45;color:var(--ink);min-height:2.9em;margin-top:2px}
.timer.is-done [data-r="next"]{min-height:0}
.howto{margin-top:10px;font-size:.92rem}
.howto summary{color:var(--sky);font-weight:700;cursor:pointer;min-height:44px;display:flex;align-items:center}
.howto ol{margin:4px 0 6px}
/* letter toggles: a label around a hidden native switch (the real tap on it is what vibrates) */
label.chk,label.wdone{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.wdone-row{display:flex;justify-content:flex-end;margin-top:10px}
.card.done .wdone-row{display:none}
input.tg{display:none}

/* fields */
label.f{display:block;font-weight:700;font-size:.92rem;margin:12px 0 4px}
label.f:first-child{margin-top:0}
label.f small{font-weight:400;color:var(--muted)}
textarea,input[type=text],input[type=number]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;font-size:16px}
textarea{resize:vertical;min-height:64px}
textarea.grow{resize:none;overflow:hidden;min-height:0;line-height:1.5}
/* writing: a saved field reads as text; tap it to edit */
.wf{margin-bottom:4px}
.wf label.f{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.saved{display:none;font-size:.76rem;font-weight:700;color:var(--ok);white-space:nowrap}
.wf.has:not(:has(textarea:focus)) .saved{display:inline}
.wf.has:not(:has(textarea:focus)) label.f small{display:none}
.save-failed .saved{display:none}
textarea.wt{display:block;transition:background .2s ease,border-color .2s ease,padding .2s ease}
.has>textarea.wt:not(:focus){background:transparent;border-color:transparent;padding-left:0;padding-right:0}

.rest{margin-top:18px;padding:22px 18px;border-radius:18px;background:var(--surface);border:1px solid var(--edge);box-shadow:var(--shadow)}
.rest h2{font-family:var(--display);font-weight:800;font-size:1.6rem;margin:0 0 6px}
.rest p{margin:0 0 12px;color:var(--muted)}

/* history */
h2.sec{font-family:var(--display);font-weight:800;font-size:1.5rem;margin:6px 0 12px}
h3.sub{font-family:var(--display);font-weight:700;font-size:1.15rem;margin:24px 0 8px}
/* months: three panes side by side; the strip follows the finger and settles on one */
.calwrap{position:relative;overflow:hidden;margin:2px -16px 0;padding:0 16px}
.calstrip{display:flex;gap:32px;align-items:flex-start;will-change:transform}
.calpane{flex:0 0 100%;min-width:0}
.monthhead{text-align:center;padding:2px 52px 12px}
.monthhead h3{margin:0;font-family:var(--display);font-weight:700;font-size:1.15rem;line-height:1.3}
.mcount{margin:2px 0 0;font-size:.85rem;color:var(--muted)}
.navbtn{position:absolute;top:0;z-index:1;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.1rem;color:var(--ink);transition:transform .25s var(--ease),opacity .2s ease}
.navbtn.prev{left:16px}
.navbtn.next{right:16px}
.navbtn:disabled{opacity:.3;cursor:default}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:start}
.cell{transition:transform .25s var(--ease)}
.cell:not(:disabled):active,.navbtn:not(:disabled):active{transform:scale(.94);transition-duration:.08s}
.dow{font-size:.75rem;color:var(--muted);text-align:center}
.cell{position:relative;display:block;width:100%;min-width:0;height:0;padding:0 0 100%;margin:0;align-self:start;border-radius:50%;border:0;cursor:pointer;
  background:conic-gradient(var(--dawn) calc(var(--p,0) * 1turn), var(--surface-2) 0)}
.cell span{position:absolute;top:3px;left:3px;right:3px;bottom:3px;display:flex;border-radius:50%;background:var(--surface);align-items:center;justify-content:center;font-size:.85rem;font-weight:700}
.cell.full span{background:var(--dawn);color:var(--dawn-ink)}
.cell.off{background:transparent;cursor:default}
.cell.off span{background:transparent;color:var(--muted);font-weight:400}
.cell.future{opacity:.4;cursor:default}
.cell.today span{box-shadow:inset 0 0 0 2px var(--sky)}
.cell.planned span::after{content:"";position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--sky)}
.cell.blank{visibility:hidden}
.legend{font-size:.8rem;color:var(--muted);margin-top:8px}
.entries{display:flex;flex-direction:column;gap:8px}
/* a day's record, read in full; tapping it opens the day */
.entry{background:var(--surface);border:1px solid var(--edge);box-shadow:var(--shadow);border-radius:14px;padding:11px 12px 12px;cursor:pointer}
.entry-h{display:flex;align-items:center;gap:8px;min-height:22px}
.entry-h b{flex:1;font-size:.95rem}
.entry-h em{font-style:normal;color:var(--muted);font-size:.88rem}
.etxt{margin:8px 0 0;line-height:1.5;white-space:pre-line;overflow-wrap:anywhere}
.etxt .glabel{margin-bottom:1px}
/* rows dim on touch-down, like an iOS list */
button.srow:active,.entry:active{background-image:linear-gradient(var(--press),var(--press))}
.empty{padding:16px;border-radius:14px;background:var(--surface);border:1px dashed var(--line);color:var(--muted);font-size:.92rem}

/* settings */
.gtop{position:sticky;top:0;z-index:4;background:var(--bg);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:0 -16px 6px;padding:4px 16px 8px;border-bottom:1px solid transparent;transition:border-color .2s ease}
/* the bar gets its line only while content passes under it */
.gtop.edge{border-bottom-color:var(--line)}
.gtop h2{grid-column:1;margin:0;font-family:var(--display);font-weight:800;font-size:1.5rem;white-space:nowrap}
.gtop.nav h2{grid-column:2;font-size:1.05rem;font-weight:700}
.slist{background:var(--surface);border:1px solid var(--edge);box-shadow:var(--shadow);border-radius:16px;overflow:hidden;margin-top:14px}
.srow{display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:10px 14px;margin:0;border:0;background:none;text-align:left;cursor:pointer;color:var(--ink)}
.srow + .srow{border-top:1px solid var(--line)}
.srow b{flex:1 0 auto;font-weight:700}
.srow small{min-width:0;font-size:.88rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow small.warn{color:var(--warn);font-weight:700}
.srow input[type=text],.srow input[type=password]{flex:0 1 60%;min-width:0;border:0;background:transparent;padding:4px 0;text-align:right;color:var(--muted)}
.srow input[type=text]:focus,.srow input[type=password]:focus{color:var(--ink);outline:0}
/* Voz: pick a voice by its name, hear it with Probar */
.vrow{cursor:default}
.vpick{flex:1 1 auto;min-width:0;min-height:44px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:0;padding:0;border:0;background:none;color:inherit;font:inherit;text-align:left;cursor:pointer}
.vpick b{flex:none}
.vcheck{flex:0 0 1.2em;color:var(--sky);font-weight:800;text-align:center}
.vtry{flex:0 0 auto;padding:6px 12px;font-size:.9rem;color:var(--ink)}
.vtry:disabled{opacity:.6}
.srow input[type=checkbox]{flex:0 0 auto;margin:0;accent-color:var(--ok)}
.srow select{flex:0 1 auto;min-width:0;border:0;background:transparent;color:var(--muted);font:inherit;font-size:.95rem;text-align:right;text-align-last:right;padding:4px 0;-webkit-appearance:none;appearance:none;cursor:pointer}
.srow select:focus{color:var(--ink);outline:0}
.chev.blank{visibility:hidden}
/* a block's letters, under its hour */
.srow.sub{min-height:44px;padding:8px 14px 8px 30px}
.srow.sub b{font-weight:400;font-size:.95rem}
.swarn{margin:0;padding:0 14px 10px 30px;font-size:.82rem;line-height:1.35;color:var(--warn)}
.swarn + .srow{border-top:1px solid var(--line)}
.chev.down{transform:rotate(135deg);margin:-4px 4px 0 2px}
.slabel{font-size:.8rem;font-weight:700;color:var(--muted);margin:22px 4px -8px}
.slabel.sm{margin-top:16px}
/* the Normal | Gym selector sits as far under its title as a list does */
.slabel + .seg{margin-top:14px}
.chev{flex:0 0 auto;width:8px;height:8px;border-right:2px solid var(--muted);border-top:2px solid var(--muted);transform:rotate(45deg);margin:0 4px 0 2px}
.sfoot{font-size:.82rem;color:var(--muted);margin:6px 4px 0}
.warn{color:var(--warn)}
.tbtn{background:none;border:0;color:var(--sky);font-weight:700;font-size:1rem;min-height:44px;padding:0 4px;cursor:pointer;transition:opacity .2s ease}
.tbtn.left{justify-self:start;font-weight:400}
.tbtn.back{display:flex;align-items:center;gap:6px}
.tbtn.back::before{content:"";width:9px;height:9px;border-left:2.5px solid var(--sky);border-bottom:2.5px solid var(--sky);transform:rotate(45deg);margin-left:3px}
.tbtn.right{justify-self:end;grid-column:3}
.gblock{background:var(--surface);border:1px solid var(--edge);box-shadow:var(--shadow);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.gblock h3{font-family:var(--display);font-weight:700;font-size:1.12rem;margin:0 0 8px}
.gblock p{margin:0 0 8px}
.gblock .lead{margin-bottom:12px}
.gitem{padding:12px 0;border-top:1px solid var(--line)}
.gitem:first-of-type{border-top:0;padding-top:4px}
.glabel{display:block;font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.01em;margin-bottom:2px}
.gitem p{margin:0;font-size:1.02rem;line-height:1.6}
.tablewrap{overflow-x:auto}
.seg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:2px;background:var(--surface-2);border-radius:12px;padding:3px;margin:2px 0 16px}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 6px;min-height:48px;cursor:pointer;color:var(--muted);line-height:1.2;transition:background .2s ease,color .2s ease}
.seg button b{display:block;font-size:.95rem}
.seg button small{display:block;font-size:.74rem;font-weight:400}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg.three{grid-template-columns:repeat(3,minmax(0,1fr))}
/* inside a white sheet the pressed segment needs to stand apart from it */
.sheet .seg button[aria-pressed="true"],.gblock .seg button[aria-pressed="true"]{background:var(--bg)}
.tgroup{font-size:.78rem;font-weight:700;color:var(--muted);margin:0 0 6px}
.tlist{list-style:none;margin:0;padding:0}
.tlist + .tgroup,.tlist + .tlist{margin-top:16px}
.tstep{display:grid;grid-template-columns:90px 14px minmax(0,1fr);column-gap:10px;align-items:start}
.tstep .tt,.mrow .tt{font-family:var(--display);font-weight:700;font-size:1rem;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.5}
.tstep .rail{position:relative;align-self:stretch}
.tstep .rail::before{content:"";position:absolute;left:6px;top:15px;bottom:-4px;width:2px;background:var(--line)}
.tstep:last-child .rail::before{display:none}
.tstep .rail::after{content:"";position:absolute;left:1px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--muted);box-sizing:border-box}
.tstep.key .rail::after{background:var(--sky);border-color:var(--sky)}
.tstep .tx{padding-bottom:14px;line-height:1.5}
.tstep:last-child .tx{padding-bottom:0}
.tstep .tx span{display:block;color:var(--muted);font-size:.86rem;line-height:1.35;margin-top:1px}
.tlist.muted .tt,.tlist.muted .tx{color:var(--muted)}
.tlist.muted .tx{font-weight:400}
/* an hour you can change: the app's own text in a pill, with the iPhone's time wheel invisible on top */
.tpick{position:relative;display:inline-block;border-radius:8px;transition:opacity .2s ease}
.tpick input,.tpick select{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;opacity:0;cursor:pointer;-webkit-appearance:none;appearance:none;font-size:16px}
.tpick:active{opacity:.5;transition-duration:0s}
.tpick:has(input:focus-visible),.tpick:has(select:focus-visible){outline:3px solid var(--sky);outline-offset:2px}
.tt .tpick{padding:0 7px;margin-right:-7px;background:var(--surface-2)}
.tstep.edited .tt,.mrow.edited .tt{color:var(--sky)}
/* a date's minutes line up with the hours' names above them, without the rail */
.mgroup{margin-top:18px}
.mrow{display:grid;grid-template-columns:90px minmax(0,1fr);column-gap:34px;align-items:center;line-height:1.5;padding:3px 0}
.dnote{margin:16px 0 0}
.dayed{margin-top:14px}
.dayed .seg{margin-top:0}
.bigtime{display:block;margin:0 0 10px;padding:10px;border-radius:14px;background:var(--surface-2);font-family:var(--display);font-weight:800;font-size:2.2rem;line-height:1.2;text-align:center;font-variant-numeric:tabular-nums}
.sheet:not(.tall) .shead{padding:0 0 10px}
.sheet:not(.tall) .note{margin:0 0 4px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:700;color:var(--muted)}
.eitem{padding:12px 0;border-top:1px solid var(--line)}
.eitem:first-of-type{border-top:0;padding-top:2px}
.eitem input{font-weight:700;margin-bottom:6px}
.ectl{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.ibtn{min-width:44px;height:40px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:1rem;font-weight:700;cursor:pointer;color:var(--ink);transition:transform .25s var(--ease)}
.ibtn.del{color:var(--warn)}
.ibtn:disabled{opacity:.35;cursor:default}
.addbtn{width:100%;margin-top:6px;padding:12px;border:1px dashed var(--line);border-radius:12px;background:transparent;color:var(--sky);font-weight:700;cursor:pointer;transition:transform .25s var(--ease)}
.ibtn:not(:disabled):active,.addbtn:active{transform:scale(.97);transition-duration:.08s}
.remind{font-size:.85rem;color:var(--muted);text-align:center;margin:18px 0 4px}
.remind .linkbtn{padding:6px 2px}
.finish .remind{margin:10px 0 0}

/* sheet: rises from the bottom, and is dragged down to close */
.backdrop{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));overscroll-behavior:contain}
.scrim{position:absolute;inset:0;background:rgba(10,14,22,.45)}
.sheet{position:relative;width:100%;max-width:420px;background:var(--surface);border-radius:18px;padding:18px 16px 12px;box-shadow:0 10px 40px rgba(0,0,0,.25);touch-action:none;will-change:transform}
.grab{width:36px;height:5px;border-radius:3px;background:var(--line);margin:-10px auto 12px}
.sheet.tall .grab{margin:8px auto 0;flex:0 0 auto}
.sheet h3{font-family:var(--display);font-weight:700;font-size:1.15rem;margin:0 0 4px}
.sheet:not(.tall) p{margin:0 0 14px;color:var(--muted);font-size:.92rem}
.sheet .row{margin-top:0}
.sheet .row .btn{flex:1}
.sheet .linkbtn{display:block;width:100%;text-align:center;margin-top:6px;min-height:44px}
/* horario: a taller sheet whose body scrolls */
.sheet.tall{max-width:560px;max-height:100%;display:flex;flex-direction:column;padding:0}
.shead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px 4px 16px}
.shead h3{margin:0}
.sbody{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:6px 16px 18px;touch-action:pan-y}

/* screens moving inside a tab: both live in fixed layers laid out like the page */
.navlayer{position:fixed;left:0;right:0;top:0;z-index:4;background:var(--bg);pointer-events:none;will-change:transform}
.navlayer.navtop{box-shadow:-12px 0 32px rgba(0,0,0,.14)}
.navdim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
/* a day in Historial: a record, not a morning in progress */
.dhead{margin:4px 0 2px}
.dsub{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:.92rem;color:var(--muted)}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--edge);padding:6px calc(8px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));z-index:5}
.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tab{border:0;background:transparent;padding:11px 4px;border-radius:12px;font-weight:400;color:var(--muted);cursor:pointer}
.tab[aria-current="page"]{color:var(--ink);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:6}
.toast.show{opacity:1}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

<body>
<main class="wrap">
  <section id="view-today"></section>
  <section id="view-history" hidden></section>
  <section id="view-settings" hidden></section>
</main>
<nav class="tabs" aria-label="Secciones"><div>
  <button class="tab" data-tab="today" aria-current="page">Hoy</button>
  <button class="tab" data-tab="history">Historial</button>
  <button class="tab" data-tab="settings">Ajustes</button>
</div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="import-file" class="sr-only" tabindex="-1" aria-hidden="true">

<script>
(function(){
"use strict";

/* ---------- constants ---------- */
const LETTERS = [
  {key:"silencio", L:"S", name:"Silencio"},
  {key:"afirmaciones", L:"A", name:"Afirmaciones"},
  {key:"visualizacion", L:"V", name:"Visualización"},
  {key:"ejercicio", L:"E", name:"Ejercicio"},
  {key:"lectura", L:"R", name:"Lectura"},
  {key:"escritura", L:"S", name:"Escritura"}
];
// Personal data (name, affirmations, schedule) is never in this file: it comes from the imported backup.
const DEFAULT_VIS = {
  items: [
    {label: "Mi día", text: "¿Cómo me veo haciendo bien lo más importante de hoy?"},
    {label: "Mi obstáculo", text: "¿Qué es lo que más probablemente me saque del camino hoy?"},
    {label: "Mi plan", text: "Si pasa eso, ¿qué hago?"}
  ],
  note: ""
};
// The old default note, removed from phones and old copies that still carry it untouched.
const OLD_VIS_NOTE = "Un minuto por pregunta, con los ojos cerrados. Si la mente se queda en blanco, respóndelas en voz baja.";
const DEFAULT_SETTINGS = {
  name: "",
  affirmations: [{label: "", text: ""}],
  visualization: DEFAULT_VIS,
  schedule: null
};
const SECS_PER_AFFIRMATION = 25;
// Silencio and Lectura last what you set; the other letters' minutes come from what's in them.
const USUAL_MINUTES = {silencio: 10, lectura: 4};
const MINUTE_CHOICES = (function(){ const a = []; for(let i = 1; i <= 60; i++) a.push(i); return a.concat([75, 90, 105, 120]); })();
const BACKUP_REMIND_DAYS = 14;
const CIRCUIT = [
  ["Bird dog", "En cuatro apoyos, estira un brazo y la pierna contraria. Sostén 2–3 segundos y cambia. La pierna no sube más alto que la cadera."],
  ["Dead bug", "Boca arriba, brazos al techo y rodillas dobladas. Baja despacio un brazo y la pierna contraria con la espalda baja pegada al piso."],
  ["Puente de glúteos", "Boca arriba, rodillas dobladas. Sube la cadera apretando glúteos hasta quedar en línea recta, sin arquear."],
  ["Sentadilla a silla", "Baja hasta tocar la silla y sube, pecho arriba y abdomen firme."]
];
function buildSteps(){
  const s = [{name:"Marchar en el sitio", secs:60}];
  for(let r=1;r<=2;r++){
    CIRCUIT.forEach(function(c, i){
      s.push({name:c[0] + " (ronda " + r + ")", ex:c[0], round:r, secs:40});
      if(!(r===2 && i===CIRCUIT.length-1)) s.push({name:"Cambio", secs:5, rest:true});
    });
  }
  s.push({name:"Respiraciones con piernas en la silla", secs:65});
  return s;
}
const STEPS = buildSteps();

/* ---------- helpers ---------- */
const $ = function(sel, root){ return (root||document).querySelector(sel); };
const $$ = function(sel, root){ return Array.from((root||document).querySelectorAll(sel)); };
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function pad(n){ return String(n).padStart(2,"0"); }
function fmt(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
function parse(ds){ const p = ds.split("-").map(Number); return new Date(p[0], p[1]-1, p[2]); }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function todayStr(){ return fmt(new Date()); }
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
function longDate(ds){ return cap(parse(ds).toLocaleDateString("es", {weekday:"long", day:"numeric", month:"long"})); }
function headDate(ds){ return cap(parse(ds).toLocaleDateString("es", {weekday:"long", day:"numeric", month:"short"})).replace(",", "").replace(/\.$/, ""); }
function shortDate(ds){ return parse(ds).toLocaleDateString("es", {weekday:"short", day:"numeric", month:"short"}); }
const DAY_KEYS = ["dom", "lun", "mar", "mié", "jue", "vie", "sáb"];
const DAY_NAMES = ["domingo", "lunes", "martes", "miércoles", "jueves", "viernes", "sábado"];
function plainDay(x){ return String(x).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").slice(0, 3); }
// "lun, mar, jue" → [1, 2, 4]
function parseDays(str){
  const keys = DAY_KEYS.map(plainDay);
  return String(str || "").split(/[,\s]+/).map(function(x){ return keys.indexOf(plainDay(x)); }).filter(function(i){ return i >= 0; });
}
// What each weekday is: "normal" and "gym" are SAVERS days with their schedule, "off" has no SAVERS.
// Saturday is always Shabbat. Edited in Ajustes › Horario; lives in the schedule as {0: "off", 1: "normal", ...}.
const DAY_TYPES = ["normal", "gym", "off"];
const DEFAULT_WEEK = {0: "off", 1: "normal", 2: "normal", 3: "gym", 4: "normal", 5: "gym"};
const TYPE_NAMES = {normal: "Normal", gym: "Gym", off: "Sin SAVERS"};
const CHIP_NAMES = {normal: "Día normal", gym: "Día de gym", off: "Sin SAVERS"};
function weekType(w){
  if(w === 6) return "shabbat";
  const sc = state.settings.schedule, t = sc && sc.week ? sc.week[w] : null;
  return DAY_TYPES.indexOf(t) >= 0 ? t : DEFAULT_WEEK[w];
}
function weekDayType(ds){ return weekType(parse(ds).getDay()); }
// A date can be something else for that day only (the gym got cancelled, a holiday, a Sunday with SAVERS).
function dayType(ds){
  const t = weekDayType(ds), d = state.days[ds];
  return t !== "shabbat" && d && DAY_TYPES.indexOf(d.type) >= 0 ? d.type : t;
}
function daysOfType(type){ return [0, 1, 2, 3, 4, 5].filter(function(w){ return weekType(w) === type; }); }
// An hour, most specific first: this date, this weekday ({"times": {"mié": "8:50 pm"}}), every day.
function stepTime(st, ds){
  if(!st) return "";
  const d = ds && state.days[ds];
  if(d && d.times && st.id && d.times[st.id]) return String(d.times[st.id]);
  return (ds ? timeOn(st, parse(ds).getDay()) : "") || String(st.time || "");
}
// When a letter that's "Más tarde" happens on this day.
function laterTime(type, key, ds){
  const t = scheduleType(type);
  const item = t && Array.isArray(t.later) ? t.later.filter(function(x){ return x && Array.isArray(x.letters) && x.letters.indexOf(key) >= 0; })[0] : null;
  return stepTime(item, ds);
}
function timeOn(item, w){
  if(!item || !item.times || typeof item.times !== "object") return "";
  const k = dayKeyIn(item.times, w);
  return k ? String(item.times[k]) : "";
}
function dayKeyIn(times, w){ const p = plainDay(DAY_KEYS[w]); return Object.keys(times).filter(function(x){ return plainDay(x) === p; })[0]; }
function isScheduled(ds){ const t = dayType(ds); return t==="normal" || t==="gym"; }
// Silencio's and Lectura's minutes, most specific first like the hours: this date ({"mins": {"lectura": 30}}),
// this weekday of the schedule ({"minutesDays": {"lectura": {"jue": 10}}}), all its days ({"minutes": {"lectura": 4}}).
function okMinutes(v){ const n = Number(v); return n >= 1 && n <= 240 && Math.round(n) === n ? n : 0; }
function usualMinutes(type, key, w){
  const t = scheduleType(type);
  const own = t && t.minutesDays && t.minutesDays[key];
  const k = own && w != null ? dayKeyIn(own, w) : null;
  return (k && okMinutes(own[k])) || okMinutes(t && t.minutes && t.minutes[key]) || USUAL_MINUTES[key];
}
function minutesOn(type, key, ds){
  const d = ds && state.days[ds];
  return okMinutes(d && d.mins && d.mins[key]) || usualMinutes(type, key, ds ? parse(ds).getDay() : null);
}

// "5:20" (morning, as the schedule writes it), "10:10 pm" ⇄ minutes ⇄ "05:20" for <input type="time">.
function parseTime(s){
  const m = /^\s*(\d{1,2}):(\d{2})\s*([ap])?\.?\s*m?\.?\s*$/i.exec(String(s || ""));
  if(!m) return null;
  let h = +m[1] % 24;
  const ap = (m[3] || "").toLowerCase();
  if(ap === "p" && h < 12) h += 12;
  if(ap === "a" && h === 12) h = 0;
  return h * 60 + +m[2];
}
function timeLabel(min){
  const h = Math.floor(min / 60) % 24, mm = pad(min % 60);
  return h < 12 ? (h === 0 ? "12:" + mm + " am" : h + ":" + mm) : (h === 12 ? 12 : h - 12) + ":" + mm + " pm";
}
function toInput(s){ const m = parseTime(s); return m == null ? "" : pad(Math.floor(m / 60)) + ":" + pad(m % 60); }
function fromInput(v){ const m = parseTime(v); return m == null ? "" : timeLabel(m); }
function sameTime(a, b){ const x = parseTime(a), y = parseTime(b); return x != null && x === y; }

// Older schedules said "days": "lun, mar, jue" in each type and had no ids; this brings them to the week map,
// gives every step an id (a date's hours are kept by it) and a time for all days (the weekday ones differ from it).
function migrateSchedule(sc){
  if(!sc || typeof sc !== "object") return null;
  const types = sc.types && typeof sc.types === "object" ? sc.types : null;
  const week = {};
  Object.keys(DEFAULT_WEEK).forEach(function(w){ week[w] = DEFAULT_WEEK[w]; });
  if(sc.week && typeof sc.week === "object"){
    Object.keys(week).forEach(function(w){ if(DAY_TYPES.indexOf(sc.week[w]) >= 0) week[w] = sc.week[w]; });
  } else if(types){
    ["normal", "gym"].forEach(function(k){ if(types[k]) parseDays(types[k].days).forEach(function(w){ if(w !== 6) week[w] = k; }); });
  }
  sc.week = week;
  if(!types) return sc;
  const used = {};
  ["normal", "gym"].forEach(function(k){
    const t = types[k];
    if(!t || typeof t !== "object") return;
    delete t.days;
    ["night", "steps", "later"].forEach(function(g){
      if(!Array.isArray(t[g])) return;
      t[g].forEach(function(st, i){
        if(!st || typeof st !== "object") return;
        if(!st.id || used[st.id]) st.id = k + "-" + g + "-" + i;
        used[st.id] = true;
        if(st.times && typeof st.times === "object"){
          const keys = Object.keys(st.times);
          if(!st.time && keys.length) st.time = String(st.times[keys[0]]);
          keys.forEach(function(x){ if(sameTime(st.times[x], st.time)) delete st.times[x]; });
          if(!Object.keys(st.times).length) delete st.times;
        }
      });
    });
  });
  return sc;
}
function blankDay(ds){ return {date:ds, checks:{}, gratitude:"", bookIdea:"", notes:"", extra:false}; }
// The "gran día" lines (and the checkboxes before them) were dropped with everything written in them.
function dropOldFields(d){
  const had = "priorities" in d || "prioDone" in d;
  delete d.priorities; delete d.prioDone;
  return had;
}
function countDone(d){ return d ? LETTERS.filter(function(l){ return d.checks && d.checks[l.key]; }).length : 0; }
function isComplete(ds){ return countDone(state.days[ds]) === 6; }
function hasContent(d){ return d && (countDone(d) > 0 || d.gratitude || d.bookIdea || d.notes); }
function filled(items){ return items.filter(function(a){ return a.text.trim(); }); }
function monthKey(ds){ return ds.slice(0, 7); }
function hasPersonalData(){ const s = state.settings; return !!(s.name || s.schedule || filled(s.affirmations).length); }

let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove("show"); }, 2600); }

/* ---------- state ---------- */
const state = {
  tab: "today",
  histDay: null,      // the day open in Historial, or null for the month
  today: todayStr(),
  days: {},
  settings: clone(DEFAULT_SETTINGS),
  month: (function(){ const d = new Date(); return {y:d.getFullYear(), m:d.getMonth()}; })(),
  showOff: false,    // today is a day without SAVERS and "Hacer mis SAVERS hoy" was tapped
  lastExport: null,
  since: null,
  affReviewed: null, // "YYYY-MM" of the last monthly affirmation review
  schedTab: null,    // Normal | Gym selector in Ajustes › Horario
  page: null,        // Ajustes screen: null = list, "aff" | "vis" | "sched" | "backup"
  from: null,        // "today" when a screen was opened from Hoy: Listo/Cancelar go back there
  edit: null,        // draft while an Ajustes screen is in edit mode
  editSnapshot: ""
};

function normItems(list){
  if(!Array.isArray(list)) return null;
  return list.map(function(a){
    if(typeof a === "string") return {label: "", text: a};
    if(a && typeof a === "object") return {label: String(a.label || ""), text: String(a.text || "")};
    return null;
  }).filter(Boolean);
}
function normalizeSettings(s){
  const out = clone(DEFAULT_SETTINGS);
  if(!s || typeof s !== "object") return out;
  if(typeof s.name === "string") out.name = s.name;
  const aff = normItems(s.affirmations);
  if(aff && aff.length) out.affirmations = aff;
  if(s.visualization && typeof s.visualization === "object"){
    const items = normItems(s.visualization.items);
    out.visualization = {
      items: items && items.length ? items : clone(DEFAULT_VIS.items),
      note: typeof s.visualization.note === "string" && s.visualization.note !== OLD_VIS_NOTE ? s.visualization.note : DEFAULT_VIS.note
    };
  }
  if(s.schedule && typeof s.schedule === "object") out.schedule = migrateSchedule(clone(s.schedule));
  return out;
}

/* ---------- storage (on this iPhone) ---------- */
const store = {
  get: function(k){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch(e){ return null; } },
  set: function(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } },
  load: function(){
    const d = this.get("savers:days");
    if(d && typeof d === "object"){
      state.days = d;
      const dropped = Object.keys(d).filter(function(ds){ return d[ds] && typeof d[ds] === "object" && dropOldFields(d[ds]); });
      if(dropped.length) this.set("savers:days", d);
    }
    const raw = this.get("savers:settings");
    state.settings = normalizeSettings(raw);
    // Migrate older formats (e.g. drop the book) right away.
    if(raw && JSON.stringify(raw) !== JSON.stringify(state.settings)) this.set("savers:settings", state.settings);
    state.lastExport = this.get("savers:lastExport");
    // The monthly review starts counting from the month after the app first sees this.
    state.affReviewed = this.get("savers:affReviewed");
    if(!state.affReviewed){ state.affReviewed = monthKey(todayStr()); this.set("savers:affReviewed", state.affReviewed); }
    state.since = this.get("savers:since");
    if(!state.since){ state.since = new Date().toISOString(); this.set("savers:since", state.since); }
  },
  save: function(){
    const ok = this.set("savers:days", state.days) && this.set("savers:settings", state.settings);
    setStatus(ok ? "" : "No se pudo guardar");
    if(!ok) toast("No se pudo guardar en el iPhone. Exporta una copia.");
  }
};
// Ask iOS to not evict this app's storage.
try { if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}

const debouncers = {};
function debounce(key, ms, fn){ clearTimeout(debouncers[key]); debouncers[key] = setTimeout(fn, ms); }
function saveDay(ds, delay){
  const d = state.days[ds];
  if(d) d.updatedAt = new Date().toISOString();
  debounce("save", delay == null ? 400 : delay, function(){ store.save(); });
}
// Never lose the last keystrokes when iOS suspends the app.
function flushSave(){ Object.keys(debouncers).forEach(function(k){ clearTimeout(debouncers[k]); }); store.save(); }
window.addEventListener("pagehide", flushSave);

let statusMsg = "";
function setStatus(msg){
  statusMsg = msg || "";
  document.body.classList.toggle("save-failed", !!statusMsg);
  const el = $("#status"); if(el) el.textContent = statusMsg;
}

function getDay(ds, create){
  if(!state.days[ds] && create) state.days[ds] = blankDay(ds);
  return state.days[ds];
}

/* ---------- sheets: rise from the bottom, dragged down to close ---------- */
// opts: labelledby, tall, dismiss (the value for closing without a choice), onClose(value).
function openSheet(html, opts){
  opts = opts || {};
  const opener = document.activeElement;
  const bd = document.createElement("div");
  bd.className = "backdrop";
  bd.innerHTML = '<div class="scrim"></div><div class="sheet' + (opts.tall ? " tall" : "") + '" role="dialog" aria-modal="true"' +
    (opts.labelledby ? ' aria-labelledby="' + opts.labelledby + '"' : '') + '><div class="grab" aria-hidden="true"></div>' + html + '</div>';
  document.body.appendChild(bd);
  const sheet = $(".sheet", bd), scrim = $(".scrim", bd), body = $(".sbody", bd);
  // How far down the sheet has to go to be fully out of sight.
  const off = Math.max(1, window.innerHeight - sheet.getBoundingClientRect().top);
  const sp = new Spring(off, function(y){
    sheet.style.transform = "translateY(" + (y < 0 ? -rubberband(-y, off) : y) + "px)";
    scrim.style.opacity = Math.max(0, Math.min(1, 1 - y / off));
  });
  let closed = false;
  const api = {el: bd, sheet: sheet, close: close};
  function close(value, v){
    if(closed) return;
    closed = true;
    document.removeEventListener("keydown", onKey);
    window.removeEventListener("pointermove", onMove);
    window.removeEventListener("pointerup", onUp);
    window.removeEventListener("pointercancel", onUp);
    if(opts.onClose) opts.onClose(value);
    if(opener && opener.focus && opener.isConnected) opener.focus({preventScroll: true});
    if(reduceMotion()){ bd.style.pointerEvents = "none"; bd.animate([{opacity: 1}, {opacity: 0}], {duration: 150, easing: "ease-out"}).onfinish = function(){ bd.remove(); }; return; }
    bd.style.pointerEvents = "none";
    sp.to(off, v || 0, function(){ bd.remove(); });
  }
  function onKey(e){ if(e.key === "Escape") close(opts.dismiss); }
  document.addEventListener("keydown", onKey);
  scrim.addEventListener("click", function(){ close(opts.dismiss); });
  if(reduceMotion()){ sp.set(0); fadeIn(bd); } else { sp.set(off); sp.to(0, 0); }

  // Dragging: anywhere on a small sheet; on a tall one from its top bar, or from the list when it's
  // scrolled to the top and the finger goes down (touch events, so the list's own scroll can be stopped).
  let g = null;
  function begin(y){ sp.stop(); g.live = true; g.y0 = y - sp.x; document.documentElement.classList.add("dragging"); }
  function move(y){ g.tr.add(0, y); sp.x = y - g.y0; sp.paint(sp.x); }
  function end(){
    const d = g; g = null;
    document.documentElement.classList.remove("dragging");
    if(!d || !d.live || closed) return;
    swallowUntil = performance.now() + 350;
    const v = d.tr.v("y");
    if(sp.x + project(v) > off * 0.5) close(opts.dismiss, v);
    else sp.to(0, v);
  }
  sheet.addEventListener("pointerdown", function(e){
    if(closed || !e.isPrimary || (body && body.contains(e.target))) return;
    g = {live: false, x0: e.clientX, ys: e.clientY, tr: new Tracker(), id: e.pointerId};
    g.tr.add(0, e.clientY);
    if(sp.raf) begin(e.clientY);   // caught while still moving
  });
  function onMove(e){
    if(!g || e.pointerId !== g.id) return;
    if(!g.live){
      const dy = e.clientY - g.ys, dx = e.clientX - g.x0;
      if(Math.abs(dy) < 6 || Math.abs(dy) < Math.abs(dx)) return;
      begin(e.clientY);
    }
    move(e.clientY);
  }
  function onUp(e){ if(g && e.pointerId === g.id) end(); }
  window.addEventListener("pointermove", onMove);
  window.addEventListener("pointerup", onUp);
  window.addEventListener("pointercancel", onUp);
  if(body){
    body.addEventListener("touchstart", function(e){
      if(closed || e.touches.length !== 1) return;
      const t = e.touches[0];
      g = {live: false, x0: t.clientX, ys: t.clientY, tr: new Tracker(), touch: true};
      g.tr.add(0, t.clientY);
    }, {passive: true});
    body.addEventListener("touchmove", function(e){
      if(!g || !g.touch) return;
      const t = e.touches[0];
      if(!g.live){
        const dy = t.clientY - g.ys, dx = t.clientX - g.x0;
        if(body.scrollTop > 0 || dy <= 0 || Math.abs(dy) < Math.abs(dx)){ g = null; return; }
        begin(t.clientY);
      }
      e.preventDefault();
      move(t.clientY);
    }, {passive: false});
    body.addEventListener("touchend", function(){ if(g && g.touch) end(); });
    body.addEventListener("touchcancel", function(){ if(g && g.touch) end(); });
  }
  return api;
}

// A question in a sheet. text can be one paragraph or a list of them; closing without a choice gives dismiss.
function ask(title, text, buttons, dismiss){
  return new Promise(function(resolve){
    const paras = Array.isArray(text) ? text : text ? [text] : [];
    const s = openSheet(
      '<h3 id="sheet-t">' + esc(title) + '</h3>' + paras.map(function(t){ return '<p>' + esc(t) + '</p>'; }).join("") +
      '<div class="row">' + buttons.filter(function(b){ return !b.link; }).map(function(b){
        return '<button class="btn' + (b.primary ? " primary" : "") + '" data-v="' + b.value + '">' + esc(b.label) + '</button>';
      }).join("") + '</div>' +
      buttons.filter(function(b){ return b.link; }).map(function(b){
        return '<button class="linkbtn" data-v="' + b.value + '">' + esc(b.label) + '</button>';
      }).join(""),
      {labelledby: "sheet-t", dismiss: dismiss || "stay", onClose: resolve});
    s.sheet.addEventListener("click", function(e){
      const b = e.target.closest("[data-v]");
      if(b) s.close(b.getAttribute("data-v"));
    });
    const primary = $(".btn.primary", s.sheet); if(primary) primary.focus({preventScroll: true});
  });
}

/* ---------- backup ---------- */
// Making the copy and getting it off the iPhone are separate, so another way out can be added later.
function backupJSON(){
  flushSave();
  return JSON.stringify({app: "savers", version: 2, exportedAt: new Date().toISOString(), paraLaIA: SUMMARY_NOTE, resumen: weekSummary(), settings: state.settings, days: state.days}, null, 2);
}
function markBackedUp(){
  state.lastExport = new Date().toISOString();
  store.set("savers:lastExport", state.lastExport);
  $$(".remind").forEach(function(el){ el.remove(); });
  if(state.tab === "settings") rerenderSettingsKeepScroll();
}
// Days since the last copy (or since the app started, if there never was one).
function backupAge(){
  const ref = state.lastExport || state.since;
  return ref ? Math.floor((Date.now() - new Date(ref).getTime()) / 86400000) : 0;
}
function backupOverdue(){ return backupAge() > BACKUP_REMIND_DAYS; }
function exportBackup(){
  const json = backupJSON();
  const name = "savers-copia-" + todayStr() + ".json";
  const markDone = markBackedUp;
  let file = null;
  try { file = new File([json], name, {type: "application/json"}); } catch(e){}
  if(file && navigator.canShare && navigator.canShare({files: [file]})){
    navigator.share({files: [file], title: "Copia de SAVERS"})
      .then(function(){ markDone(); toast("Copia exportada"); })
      .catch(function(e){ if(e && e.name !== "AbortError") downloadFallback(); });
    return;
  }
  downloadFallback();
  function downloadFallback(){
    const url = URL.createObjectURL(new Blob([json], {type: "application/json"}));
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    markDone(); toast("Copia descargada");
  }
}

function importBackupText(text){
  let data;
  try { data = JSON.parse(text); } catch(e){ toast("Ese archivo no es una copia de SAVERS"); return; }
  if(!data || data.app !== "savers" || typeof data.settings !== "object"){ toast("Ese archivo no es una copia de SAVERS"); return; }
  const incomingDays = data.days && typeof data.days === "object" ? data.days : {};
  const n = Object.keys(incomingDays).length;
  // Replace only the parts the file brings, so a schedule-only file never touches affirmations.
  const PARTS = [["name", "tu nombre"], ["affirmations", "tus afirmaciones"], ["visualization", "tu visualización"], ["schedule", "tu horario"]];
  const parts = PARTS.filter(function(p){ return Object.prototype.hasOwnProperty.call(data.settings, p[0]); });
  if(!parts.length && !n){ toast("Esa copia no trae nada para importar"); return; }
  const changed = summaryChanges(data, parts);
  const names = parts.map(function(p){ return p[1]; });
  const list = names.length > 1 ? names.slice(0, -1).join(", ") + " y " + names[names.length - 1] : names[0];
  const msg = [parts.length ? "Se reemplaza solo " + list + "." : "Tus afirmaciones y tu horario no cambian."];
  if(n) msg.push("Se agrega" + (n === 1 ? " 1 día" : "n " + n + " días") + " de registro; si un día ya existe, se queda el más reciente.");
  if(changed.length){
    const shown = changed.slice(0, 3).join(", ") + (changed.length > 3 ? " y " + (changed.length - 3) + " más" : "");
    msg.push("En el resumen cambió " + shown + ", y eso no se guarda: esas horas y minutos los calcula la app. Para moverlos, cambia la hora del bloque o los minutos de Silencio y Lectura.");
  }
  ask("¿Importar esta copia?", msg, [{label: "Cancelar", value: "cancel"}, {label: "Importar", value: "ok", primary: true}], "cancel")
    .then(function(v){ if(v === "ok") applyImport(data, parts, incomingDays); });
}
function applyImport(data, parts, incomingDays){
  const incoming = normalizeSettings(data.settings);
  parts.forEach(function(p){ state.settings[p[0]] = incoming[p[0]]; });
  Object.keys(incomingDays).forEach(function(ds){
    const inc = incomingDays[ds], cur = state.days[ds];
    if(!/^\d{4}-\d{2}-\d{2}$/.test(ds) || !inc || typeof inc !== "object") return;
    if(!cur || !hasContent(cur) || String(inc.updatedAt || "") >= String(cur.updatedAt || "")){ state.days[ds] = Object.assign(blankDay(ds), inc); dropOldFields(state.days[ds]); }
  });
  state.edit = null;
  flushSave();
  prepareVoice();
  toast(parts.length === 1 && parts[0][0] === "schedule" ? "Horario importado" : "Copia importada");
  switchTab(state.tab);
}

$("#import-file").addEventListener("change", function(e){
  const f = e.target.files && e.target.files[0];
  e.target.value = "";
  if(!f) return;
  const r = new FileReader();
  r.onload = function(){ importBackupText(String(r.result || "")); };
  r.onerror = function(){ toast("No se pudo leer el archivo"); };
  r.readAsText(f);
});

/* ---------- feel: sound, voice, bounce ---------- */
// Haptics: iOS only vibrates when a finger really toggles a native switch, so every letter wraps a hidden
// <input type="checkbox" switch> (see letterToggleHTML). Programmatic clicks don't vibrate.
const audio = {ctx: null};
// "Mantener mi música": ambient mixes with 24six but follows the silent switch; playback ignores it but pauses other apps.
function keepMusic(){ const v = store.get("savers:keepMusic"); return v == null ? true : !!v; }
function setAudioMode(mode){
  try { if(navigator.audioSession && navigator.audioSession.type !== mode) navigator.audioSession.type = mode; } catch(e){}
}
function runAudioMode(){ return keepMusic() ? "ambient" : "playback"; }
function ensureAudio(){
  try {
    if(!audio.ctx) audio.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if(audio.ctx.state !== "running") audio.ctx.resume();
    const b = audio.ctx.createBuffer(1, 1, 22050), src = audio.ctx.createBufferSource();
    src.buffer = b; src.connect(audio.ctx.destination); src.start(0);
  } catch(e){}
}
function tone(freqFrom, freqTo, dur, peak, delay){
  try {
    const ctx = audio.ctx; if(!ctx) return;
    if(ctx.state !== "running") ctx.resume();
    const o = ctx.createOscillator(), g = ctx.createGain();
    const t0 = ctx.currentTime + (delay || 0);
    o.type = "sine";
    o.frequency.setValueAtTime(freqFrom, t0);
    if(freqTo !== freqFrom) o.frequency.exponentialRampToValueAtTime(freqTo, t0 + dur * 0.8);
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch(e){}
}
function feedbackAudio(){
  if(!anyRunning()) setAudioMode("ambient");
  ensureAudio();
}
// "Check doble": two quick notes up.
function popSound(){
  feedbackAudio();
  tone(988, 988, 0.1, 0.12);
  tone(1319, 1319, 0.14, 0.12, 0.07);
}
// "Arpegio en mi": walks through the same notes as the check and lands higher.
function completeSound(){
  feedbackAudio();
  [659, 831, 988, 1319].forEach(function(f, i){ tone(f, f, 0.14, 0.12, i * 0.085); });
  tone(1661, 1661, 0.2, 0.1, 0.34);
  tone(1976, 1976, 0.75, 0.12, 0.42);
  tone(3952, 3952, 0.25, 0.014, 0.42);
}
function bell(){ tone(1175, 1175, 1.1, 0.1); tone(3243, 3243, 0.3, 0.03); }
function softTone(){ tone(660, 660, 0.35, 0.05); }

// Spoken cues use a Gemini voice when its clip is ready on this iPhone, and the iPhone's own Spanish voice otherwise.
// They only play while SAVERS is on screen.
let voiceCache = null;
function spanishVoice(){
  if(voiceCache) return voiceCache;
  try {
    const vs = speechSynthesis.getVoices().filter(function(v){ return /^es([-_]|$)/i.test(v.lang); });
    if(!vs.length) return null;
    const rank = function(v){
      return (/premium|enhanced|mejorada/i.test(v.name + " " + v.voiceURI) ? 0 : 10) +
        (/^es[-_]MX/i.test(v.lang) ? 0 : /^es[-_](US|419)/i.test(v.lang) ? 1 : /^es[-_]ES/i.test(v.lang) ? 3 : 2);
    };
    voiceCache = vs.sort(function(a, b){ return rank(a) - rank(b); })[0];
  } catch(e){ return null; }
  return voiceCache;
}
try { if(window.speechSynthesis) speechSynthesis.addEventListener("voiceschanged", function(){ voiceCache = null; }); } catch(e){}
function sayIphone(text){
  try {
    if(!window.speechSynthesis || !text) return;
    const u = new SpeechSynthesisUtterance(text);
    const v = spanishVoice();
    if(v){ u.voice = v; u.lang = v.lang; } else u.lang = "es-MX";
    u.rate = 0.92;
    if(speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
    speechSynthesis.speak(u);
  } catch(e){}
}
// tone: "ejercicio" | "visualizacion" | "aviso". A clip that isn't ready yet never makes the cue wait.
let saySeq = 0;
function say(text, tone){
  if(!text) return;
  const seq = ++saySeq;
  stopVoice();
  const clip = ttsKey() ? clips.get(clipKey(text, tone, ttsVoice())) : null;
  if(!clip){ sayIphone(text); return; }
  clipBuffer(clip)
    .then(function(buf){ if(seq === saySeq) playClip(buf); })
    .catch(function(){ if(seq === saySeq) sayIphone(text); });
}
function stopVoice(){
  try { if(voiceSrc) voiceSrc.stop(); } catch(e){}
  voiceSrc = null;
  try { if(window.speechSynthesis) speechSynthesis.cancel(); } catch(e){}
}

/* ---------- gemini voice: each phrase is made once and kept on this iPhone ---------- */
// The key and the chosen voice live only in localStorage: never in the backup, the export or the repo.
// No key, no internet or no free quota left: the iPhone voice speaks instead, without a word about it.
const TTS_MODEL = "gemini-3.8-flash-tts";
const TTS_URL = "https://generativelanguage.googleapis.com/v1beta/interactions";
const TTS_CACHE = "savers-voz";   // sw.js keeps this cache when it updates
const VOICES = [
  {id: "Sulafat", desc: "Mujer · cálida"},
  {id: "Vindemiatrix", desc: "Mujer · suave"},
  {id: "Achird", desc: "Hombre · amable"},
  {id: "Algieba", desc: "Hombre · sereno"}
];
const TONES = {
  visualizacion: "Mexican Spanish accent. Calm, soft and slow, like a guided meditation, with gentle pauses.",
  ejercicio: "Mexican Spanish accent. Energetic, clear and encouraging, like a coach. Brisk pace.",
  aviso: "Mexican Spanish accent. Neutral, warm and clear."
};
// The free tier allows about 3 voice requests a minute and a handful a day, so phrases are asked for slowly
// and a new voice only takes over once all its phrases are here: one routine never mixes two Gemini voices.
const ASK_GAP = 21000;
const clips = new Map();   // clipKey -> {raw: wav bytes, buf: decoded AudioBuffer or null, url, voice}; only the voice that speaks
const voiceStatus = {total: 0, ready: 0, nextReady: 0, error: "", daily: false};
let voiceSrc = null, preparing = null, prepareAgain = false, minuteHold = 0, minuteMisses = 0, lastAsk = 0, resetT = null;

function ttsKey(){ return store.get("savers:geminiKey") || ""; }
function knownVoice(v){ return VOICES.some(function(x){ return x.id === v; }) ? v : ""; }
function ttsVoice(){ return knownVoice(store.get("savers:voice")) || VOICES[0].id; }
// The voice that was picked and is still being made; the current one keeps speaking until it's complete.
function nextVoice(){ const v = knownVoice(store.get("savers:voiceNext")); return v && v !== ttsVoice() ? v : ""; }
function dailyHold(){ return Number(store.get("savers:voiceHold")) || 0; }
function clearVoiceHolds(){ try { localStorage.removeItem("savers:voiceHold"); } catch(e){} minuteHold = 0; minuteMisses = 0; }
// The daily quota comes back at midnight, Pacific time.
function nextQuotaReset(){
  const now = new Date(), la = new Date(now.toLocaleString("en-US", {timeZone: "America/Los_Angeles"}));
  const left = 86400 - (la.getHours() * 3600 + la.getMinutes() * 60 + la.getSeconds());
  return now.getTime() + left * 1000 + 60000;
}
function chooseVoice(v){
  const s = voiceStatus, complete = s.total > 0 && s.ready === s.total;
  // Until the current voice is complete there's nothing worth keeping on: switch right away.
  if(v === ttsVoice() || !complete){ store.set("savers:voice", v); try { localStorage.removeItem("savers:voiceNext"); } catch(e){} }
  else store.set("savers:voiceNext", v);
}
function clipKey(text, tone, voice){ return voice + "|" + (TONES[tone] ? tone : "aviso") + "|" + text; }

// Everything the app can say today, with the tone it's said in.
function spokenPhrases(){
  const out = [["Marchar en el sitio, un minuto.", "ejercicio"], ["Listo. Ejercicio marcado.", "aviso"], ["Visualización lista.", "aviso"]];
  STEPS.forEach(function(s, i){ if(i > 0 && !s.rest) out.push([exCue(i), "ejercicio"]); });
  visSteps().forEach(function(s){ out.push([s.text, "visualizacion"]); });
  const seen = {};
  return out.filter(function(p){ const k = p[1] + "|" + p[0]; if(!p[0] || seen[k]) return false; seen[k] = true; return true; });
}

async function clipURL(key){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(TTS_MODEL + "|" + key));
  const hex = Array.from(new Uint8Array(buf).slice(0, 16)).map(function(b){ return b.toString(16).padStart(2, "0"); }).join("");
  return new URL("voz/" + hex + ".wav", location.href).href;
}
function b64bytes(s){ const bin = atob(s), out = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out; }
// Gemini answers with a WAV; raw 16-bit PCM (24 kHz mono) gets a header so it plays anywhere.
function asWav(bytes){
  if(bytes.length > 12 && String.fromCharCode(bytes[0], bytes[1], bytes[2], bytes[3]) === "RIFF") return bytes;
  const rate = 24000, out = new Uint8Array(44 + bytes.length), v = new DataView(out.buffer);
  const tag = function(o, s){ for(let i = 0; i < 4; i++) out[o + i] = s.charCodeAt(i); };
  tag(0, "RIFF"); v.setUint32(4, 36 + bytes.length, true); tag(8, "WAVE"); tag(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
  tag(36, "data"); v.setUint32(40, bytes.length, true);
  out.set(bytes, 44);
  return out;
}
function audioIn(data){
  if(!data || typeof data !== "object") return "";
  if(data.output_audio && data.output_audio.data) return data.output_audio.data;
  let found = "";
  (Array.isArray(data.steps) ? data.steps : []).forEach(function(st){
    (st && Array.isArray(st.content) ? st.content : []).forEach(function(c){ if(c && c.type === "audio" && c.data) found = c.data; });
  });
  return found;
}
async function synth(text, tone, voice){
  const res = await fetch(TTS_URL, {
    method: "POST",
    headers: {"Content-Type": "application/json", "x-goog-api-key": ttsKey()},
    body: JSON.stringify({
      model: TTS_MODEL,
      input: [{type: "user_input", content: [{type: "text", text: text, annotations: [{type: "speech_metadata", style: TONES[tone] || TONES.aviso}]}]}],
      response_format: {type: "audio"},
      generation_config: {speech_config: [{voice: voice}]}
    })
  });
  const data = await res.json().catch(function(){ return null; });
  if(!res.ok){
    const e = (Array.isArray(data) ? data[0] : data) || {}, info = e.error || {};
    const err = new Error(info.message || "HTTP " + res.status);
    err.status = res.status;
    err.reason = (info.details || []).map(function(d){ return d.reason || ""; }).join(" ");
    const retry = (info.details || []).map(function(d){ return d.retryDelay; }).filter(Boolean)[0];
    err.retry = retry ? parseFloat(retry) * 1000 : 0;
    err.daily = /PerDay/i.test(JSON.stringify(info.details || []));
    throw err;
  }
  const b64 = audioIn(data);
  if(!b64) throw new Error("Sin audio");
  return asWav(b64bytes(b64));
}
function ttsError(err){
  if(!err || err.name === "TypeError") return "Sin conexión. Prueba cuando tengas internet.";
  if(err.status === 429 && (err.daily || Date.now() < dailyHold())) return "Ya se usó el límite gratis de hoy. Mañana puedes probar más voces.";
  if(err.status === 429) return "Google pide una pausa. Espera un minuto y vuelve a probar.";
  if(err.status === 401 || err.status === 403 || /API_KEY/.test(err.reason || "")) return "La clave no funciona. Revisa que esté completa.";
  return "Gemini no respondió" + (err.status ? " (código " + err.status + ")" : "") + ". Mientras, suena la voz del iPhone.";
}

// Is the phrase on this iPhone? If not and ask is set, Gemini makes it. load keeps it in memory, ready to play.
async function ensureClip(cache, text, tone, voice, opts){
  const key = clipKey(text, tone, voice);
  if(clips.has(key)) return clips.get(key);
  const url = await clipURL(key);
  const hit = await cache.match(url);
  let raw = null;
  if(hit){
    if(!opts.load) return true;
    raw = await hit.arrayBuffer();
  } else {
    if(!opts.ask) return null;
    if(opts.pace){ const w = lastAsk + ASK_GAP - Date.now(); if(w > 0) await new Promise(function(r){ setTimeout(r, w); }); }
    lastAsk = Date.now();
    const bytes = await synth(text, tone, voice);
    clearVoiceHolds();
    await cache.put(url, new Response(bytes, {headers: {"Content-Type": "audio/wav"}}));
    if(!opts.load) return true;
    raw = bytes.buffer;
  }
  const clip = {raw: raw, buf: null, url: url, voice: voice};
  clips.set(key, clip);
  return clip;
}
// A full day's quota waits for its reset; a busy minute tries again in a minute (three in a row count as the day).
function noteVoiceError(err){
  if(err && err.status === 429){
    minuteMisses++;
    if(err.daily || minuteMisses >= 3){
      store.set("savers:voiceHold", nextQuotaReset()); voiceStatus.daily = true;
      clearTimeout(resetT); resetT = setTimeout(prepareVoice, dailyHold() - Date.now() + 1000);
    }
    else { const wait = Math.max(err.retry || 0, 60000); minuteHold = Date.now() + wait; setTimeout(prepareVoice, wait + 1000); }
    voiceStatus.error = "";
  } else voiceStatus.error = ttsError(err);
}
function clipBuffer(clip){
  if(clip.buf) return Promise.resolve(clip.buf);
  if(!audio.ctx) audio.ctx = new (window.AudioContext || window.webkitAudioContext)();
  return audio.ctx.decodeAudioData(clip.raw.slice(0)).then(function(b){ clip.buf = b; return b; });
}
function playClip(buf, onEnd){
  const ctx = audio.ctx; if(!ctx) return;
  if(ctx.state !== "running") ctx.resume();
  const src = ctx.createBufferSource();
  src.buffer = buf;
  src.connect(ctx.destination);
  src.onended = function(){ if(voiceSrc === src) voiceSrc = null; if(onEnd) onEnd(); };
  src.start();
  voiceSrc = src;
}

// Makes whatever is missing, one phrase at a time, and forgets clips nothing says anymore.
function prepareVoice(){
  if(preparing){ prepareAgain = true; return; }
  preparing = makeClips().catch(function(){}).then(function(){
    preparing = null;
    if(prepareAgain){ prepareAgain = false; prepareVoice(); }
  });
}
async function makeClips(){
  if(!ttsKey() || !window.caches || !window.crypto || !crypto.subtle) return;
  const cache = await caches.open(TTS_CACHE), list = spokenPhrases(), voice = ttsVoice(), next = nextVoice();
  const s = voiceStatus;
  let ask = navigator.onLine && Date.now() >= Math.max(dailyHold(), minuteHold);
  s.total = list.length; s.ready = 0; s.nextReady = 0; s.daily = Date.now() < dailyHold();
  if(ask) s.error = "";
  // Opening the app after the reset picks up what's missing; this covers the app staying open through it.
  clearTimeout(resetT);
  if(s.daily) resetT = setTimeout(prepareVoice, dailyHold() - Date.now() + 1000);
  async function pass(v, load, field){
    for(const p of list){
      try { if(await ensureClip(cache, p[0], p[1], v, {ask: ask, load: load, pace: true})) s[field]++; }
      catch(err){ ask = false; noteVoiceError(err); }
      showVoiceStatus();
    }
  }
  // What the current voice is missing (a new visualization question) comes first.
  await pass(voice, true, "ready");
  if(next) await pass(next, false, "nextReady");
  showVoiceStatus();
  // Keep every voice's clips of what the app says today, so going back to a voice costs nothing.
  const urls = new Set();
  for(const v of VOICES) for(const p of list) urls.add(await clipURL(clipKey(p[0], p[1], v.id)));
  (await cache.keys()).forEach(function(req){ if(!urls.has(req.url)) cache.delete(req); });
  if(next && s.nextReady === list.length){
    store.set("savers:voice", next);
    try { localStorage.removeItem("savers:voiceNext"); } catch(e){}
    prepareAgain = true;
    refreshVozPage();
  }
  clips.forEach(function(c, k){ if(c.voice !== ttsVoice() || !urls.has(c.url)) clips.delete(k); });
}
function voiceStatusText(){
  if(!ttsKey()) return "Sin clave, suena la voz del iPhone.";
  const s = voiceStatus, n = s.total, next = nextVoice();
  if(s.error) return s.error;
  if(!n) return "Preparando las frases…";
  let t = next ? next + " se está preparando: " + s.nextReady + " de " + n + " frases. Mientras, suena " + ttsVoice() + "."
    : s.ready === n ? "Las " + n + " frases están listas en este iPhone."
    : s.ready + " de " + n + " frases listas. Las que faltan suenan con la voz del iPhone.";
  if(s.daily && (next || s.ready < n)) t += " Se acabó el límite gratis de hoy: mañana se completan.";
  return t;
}

/* ---------- motion ---------- */
// One curve and one length for every height change: close to a critically damped spring, no bounce.
const DUR = 320;
const EASE = "cubic-bezier(.22,1,.36,1)";
function reduceMotion(){ return window.matchMedia("(prefers-reduced-motion: reduce)").matches; }

// Height animations start from the live on-screen height, so a second tap reverses mid-way instead of jumping.
function liveHeight(el){ return el.getBoundingClientRect().height; }
function stopHeight(el){ if(el._h){ el._h.cancel(); el._h = null; el.style.overflow = ""; } }
function animateHeight(el, from, to, then){
  stopHeight(el);
  el.style.overflow = "hidden";
  quietScroll(DUR + 100);
  const a = el.animate([{height: from + "px"}, {height: to + "px"}], {duration: DUR, easing: EASE, fill: "forwards"});
  el._h = a;
  a.onfinish = function(){
    if(el._h !== a) return;
    if(then) then();
    el._h = null; el.style.overflow = "";
    a.cancel();
  };
}
function closedHeight(det){ return $(":scope > summary", det).getBoundingClientRect().height + det.offsetHeight - det.clientHeight; }
// Opens or closes a <details> with its height. A closing one stays open until it has shrunk.
function setOpen(det, want, opts){
  opts = opts || {};
  const from = opts.from != null ? opts.from : liveHeight(det);
  if(!det._h && opts.from == null && det.open === want){ if(opts.after) opts.after(); return; }
  stopHeight(det);
  det._want = want;
  det.classList.toggle("closing", !want);
  if(reduceMotion() || !det.isConnected){
    det.open = want; det.classList.remove("closing");
    if(opts.after) opts.after();
    return;
  }
  det.open = true;
  if(want) fitFields(det);
  const to = want ? liveHeight(det) : closedHeight(det);
  animateHeight(det, from, to, function(){
    if(!want) det.open = false;
    det.classList.remove("closing");
    if(opts.after) opts.after();
  });
}
function wantsOpen(det){ return det._h ? det._want : det.open; }

// A marked card settles into a plain row: its height shrinks and the circle and title glide to their new place.
function settleCard(card){
  // Open, opening or already closing: all of them end as a closed row.
  const open = card.tagName === "DETAILS" && card.open && !card.contains(document.activeElement);
  const from = liveHeight(card);
  const row = card.firstElementChild;
  const parts = [$(".chk", row), $(".ttl", row)].filter(Boolean);
  const tops = parts.map(function(p){ return p.getBoundingClientRect().top; });
  stopHeight(card);
  card.classList.add("done");
  if(open) openCards.delete(card.getAttribute("data-card"));
  if(reduceMotion()){ if(open){ card.open = false; card.classList.remove("closing"); } return; }
  parts.forEach(function(p, i){
    const dy = tops[i] - p.getBoundingClientRect().top;
    if(Math.abs(dy) > 0.5) p.animate([{transform: "translateY(" + dy + "px)"}, {transform: "none"}], {duration: DUR, easing: EASE});
  });
  if(open){ setOpen(card, false, {from: from}); return; }
  const to = liveHeight(card);
  if(Math.abs(to - from) > 0.5) animateHeight(card, from, to);
}
// Unmarked mid-way: whatever it was doing reverses from where it is.
function unsettleCard(card){
  const from = liveHeight(card);
  const reopen = card.tagName === "DETAILS" && card._h && card._want === false;
  stopHeight(card);
  card.classList.remove("done");
  if(reopen){ setOpen(card, true, {from: from}); return; }
  const to = liveHeight(card);
  if(!reduceMotion() && Math.abs(to - from) > 0.5) animateHeight(card, from, to);
}

/* ---------- scrolling by itself, never against the finger ---------- */
let touching = false, userScrollAt = 0, quietUntil = 0;
// A touchstart listener is also what lets :active show on iOS.
document.addEventListener("touchstart", function(){ touching = true; }, {passive: true});
document.addEventListener("touchend", function(){ touching = false; }, {passive: true});
document.addEventListener("touchcancel", function(){ touching = false; }, {passive: true});
// Scrolls caused by the app (its own scrolls, the page shortening under an animation) don't count as the user's.
window.addEventListener("scroll", function(){ if(performance.now() > quietUntil) userScrollAt = performance.now(); }, {passive: true});
function quietScroll(ms){ quietUntil = Math.max(quietUntil, performance.now() + ms); }
function userBusy(){ return touching || performance.now() - userScrollAt < 500; }
// Brings el into view only if it's out of it, and not while the user is touching or scrolling.
function reveal(el){
  if(!el || !el.isConnected || userBusy()) return;
  const r = el.getBoundingClientRect();
  const top = parseFloat(getComputedStyle($(".wrap")).paddingTop) || 12;
  const bottom = window.innerHeight - $(".tabs").offsetHeight - 12;
  let dy = 0;
  if(r.top < top) dy = r.top - top;
  else if(r.bottom > bottom) dy = Math.min(r.bottom - bottom, r.top - top);
  if(Math.abs(dy) < 1) return;
  quietScroll(900);
  window.scrollBy({top: dy, behavior: reduceMotion() ? "auto" : "smooth"});
}

/* ---------- springs and gestures ---------- */
// A critically damped spring (no bounce). Retargeting keeps its position and velocity, so a moving
// screen or sheet can be grabbed and redirected at any moment. Units are px and px/s.
const RESPONSE = 0.36;
function Spring(x, paint){ this.x = x; this.v = 0; this.target = x; this.paint = paint; this.raf = 0; this.done = null; }
Spring.prototype.stop = function(){ if(this.raf) cancelAnimationFrame(this.raf); this.raf = 0; this.done = null; };
Spring.prototype.set = function(x){ this.stop(); this.x = this.target = x; this.v = 0; this.paint(x); };
Spring.prototype.to = function(target, v, done){
  const s = this;
  s.target = target;
  if(v != null) s.v = v;
  s.done = done || null;
  if(reduceMotion()){
    if(s.raf) cancelAnimationFrame(s.raf);
    s.raf = 0; s.x = target; s.v = 0; s.paint(target);
    const d = s.done; s.done = null; if(d) d();
    return;
  }
  if(s.raf) return;
  let last = performance.now();
  function tick(now){
    const dt = Math.min(0.032, Math.max(0, (now - last) / 1000));
    last = now;
    // Exact step of x(t) = target + (A + Bt)e^(-wt): stable at any frame rate.
    const w = 2 * Math.PI / RESPONSE, d = s.x - s.target, B = s.v + w * d, e = Math.exp(-w * dt);
    s.x = s.target + (d + B * dt) * e;
    s.v = (s.v - w * B * dt) * e;
    if(Math.abs(s.x - s.target) < 0.5 && Math.abs(s.v) < 30){
      s.x = s.target; s.v = 0; s.raf = 0; s.paint(s.x);
      const dn = s.done; s.done = null; if(dn) dn();
      return;
    }
    s.paint(s.x);
    s.raf = requestAnimationFrame(tick);
  }
  s.raf = requestAnimationFrame(tick);
};

// The finger's velocity over its last ~100ms; zero if it stopped before lifting.
function Tracker(){ this.pts = []; }
Tracker.prototype.add = function(x, y){
  const t = performance.now();
  this.pts.push({x: x, y: y, t: t});
  while(this.pts.length > 2 && t - this.pts[0].t > 100) this.pts.shift();
};
Tracker.prototype.v = function(axis){
  const p = this.pts;
  if(p.length < 2 || performance.now() - p[p.length - 1].t > 80) return 0;
  const a = p[0], b = p[p.length - 1], dt = (b.t - a.t) / 1000;
  return dt > 0 ? (b[axis] - a[axis]) / dt : 0;
};
// Apple's projection: where a flick would come to rest, like scroll deceleration.
function project(v){ return v / 1000 * 0.998 / (1 - 0.998); }
// Past a boundary things follow less and less the further they go.
function rubberband(over, dim){ const c = 0.55; return over * dim * c / (dim + c * Math.abs(over)); }
// After a drag the finger lifting must not also count as a tap.
let swallowUntil = 0;
document.addEventListener("click", function(e){ if(performance.now() < swallowUntil){ e.stopPropagation(); e.preventDefault(); } }, true);
function fadeIn(el){ if(el) el.animate([{opacity: 0}, {opacity: 1}], {duration: 150, easing: "ease-out"}); }

/* ---------- streak ---------- */
function streak(){
  let n = 0;
  let d = new Date();
  if(isScheduled(fmt(d)) && !isComplete(fmt(d))) d = addDays(d, -1);
  for(let i=0; i<800; i++){
    const ds = fmt(d);
    if(isScheduled(ds)){
      if(isComplete(ds)) n++; else break;
    }
    d = addDays(d, -1);
  }
  return n;
}

function spanMinutes(range){
  const m = /(\d{1,2}):(\d{2})\s*[–-]\s*(\d{1,2}):(\d{2})/.exec(range || "");
  if(!m) return "";
  const mins = (+m[3] * 60 + +m[4]) - (+m[1] * 60 + +m[2]);
  return mins > 0 ? mins + " min" : "";
}
// How long a letter takes, in minutes: what you set for Silencio and Lectura (for this date, or for a

  if(key === "escritura") return 2;
