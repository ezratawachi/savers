  return '<div class="wf' + (v ? " has" : "") + '">' +
    '<label class="f" for="' + wId(scope, ds, f.k) + '"><span>' + f.label + ' <small>' + (f.gymHint && dayType(ds) === "gym" ? f.gymHint : f.hint) + '</small></span>' + SAVED + '</label>' +
    '<textarea class="grow wt" rows="' + (v ? 1 : 3) + '" id="' + wId(scope, ds, f.k) + '" data-w="' + f.k + '" data-ds="' + ds + '">' + esc(v) + '</textarea>' +
  '</div>';
}
function writingHTML(ds, d, scope){
  const l = LETTERS.filter(function(x){ return x.key === "escritura"; })[0];
  return '<div class="body">' + W_FIELDS.map(function(f){ return wFieldHTML(scope, ds, d, f); }).join("") +
    '<div class="wdone-row">' + letterToggleHTML("btn primary wdone", l, false, "Listo, marcar Escritura", "Listo") + '</div></div>';
}
// Empty or being edited: at least 3 lines. Saved: exactly as tall as its text.
function fitField(el){
  el.rows = (!el.value || document.activeElement === el) ? 3 : 1;
  if(el.offsetParent) autoGrow(el);
}
function fitFields(root){ $$("textarea.wt", root).forEach(fitField); }
document.addEventListener("toggle", function(e){ if(e.target.open) fitFields(e.target); }, true);
window.addEventListener("resize", function(){ fitFields(document); });

document.addEventListener("input", function(e){
  const el = e.target;
  if(!el.hasAttribute || !el.hasAttribute("data-w")) return;
  const ds = el.getAttribute("data-ds"), k = el.getAttribute("data-w");
  const d = getDay(ds, true);
  d[k] = el.value;
  el.parentElement.classList.toggle("has", !!el.value);
  fitField(el);
  saveDay(ds);
});
document.addEventListener("focusin", function(e){ if(e.target.classList && e.target.classList.contains("wt")) fitField(e.target); });
document.addEventListener("focusout", function(e){
  const el = e.target;
  if(!el.classList || !el.classList.contains("wt")) return;
  flushSave();   // "Guardado" should be true the moment it shows
  setTimeout(function(){
    fitField(el);
    const card = el.closest("details.card.done");
    if(card && !card.contains(document.activeElement)) closeCard(card);
    if(dayView.root && dayView.root.contains(el)) refreshChecks();
  }, 0);
});

const openCards = new Set();   // every card starts closed; this remembers the ones opened this session
let foldOpenFor = "";          // the day whose folded row was left open, same idea

// The day being shown: Hoy (today, as a guide) or a day open in Historial (a record to look at or correct).
let dayView = {root: null, ds: todayStr(), record: false};
function renderToday(opts){ renderDay($("#view-today"), state.today, false, opts); }
function rerenderDay(){ if(dayView.record) renderDay(dayView.root, dayView.ds, true); else renderToday(); }
function shortTitle(ds){ return cap(shortDate(ds)).replace(",", ""); }

function renderDay(root, ds, record, opts){
  dayView = {root: root, ds: ds, record: record};
  const type = dayType(ds);
  const d = state.days[ds] || blankDay(ds);
  const chip = type === "gym" ? '<button class="chip gym" id="day-type" aria-label="Día de gym. Cambiar a día normal">Día de gym <span aria-hidden="true">⇄</span></button>'
    : type === "normal" ? '<button class="chip" id="day-type" aria-label="Día normal. Cambiar a día de gym">Día normal <span aria-hidden="true">⇄</span></button>'
    : type === "domingo" ? '<span class="chip">Domingo</span>' : '<span class="chip">Shabbat</span>';
  const showRoutine = type === "normal" || type === "gym" || (type === "domingo" && (d.extra || (!record && state.showSunday) || hasContent(d)));

  let html;
  if(record){
    html = '<div class="dhead"><h1 class="date">' + esc(cap(longDate(ds).replace(",", ""))) + '</h1>' +
      '<div class="dsub">' + chip + (showRoutine ? '<span class="dcount">· ' + countDone(d) + ' de 6</span>' : '') + '</div></div>';
  } else {
    const h = new Date().getHours();
    const name = state.settings.name ? ", " + state.settings.name : "";
    const hello = (h < 12 ? "Buenos días" : h < 19 ? "Buenas tardes" : "Buenas noches") + name;
    html =
      '<div class="top"><div class="top-l">' +
        '<p class="hello">' + esc(hello) + ' <span class="status" id="status"></span></p>' +
        '<h1 class="date">' + esc(headDate(ds)) + '</h1>' +
      '</div>' + chip + '</div>';
    if(!hasPersonalData()) html += '<div class="banner"><span>Importa tu copia para cargar tus afirmaciones y horario.</span><button class="linkbtn" id="go-import">Importar</button></div>';
  }

  if(type === "shabbat"){
    html += '<div class="rest"><h2>Shabbat Shalom</h2><p>' + (record ? "Shabbat no tiene registro." : "Hoy no hay registro. Nos vemos el domingo.") + '</p></div>';
    root.innerHTML = html; bindDay(root, record); setStatus(statusMsg); return;
  }
  if(!showRoutine){
    html += record
      ? '<div class="rest"><h2>Sin registro</h2><p>El domingo está fuera del plan. Si ese día hiciste tus SAVERS, puedes registrarlos.</p>' +
        '<button class="btn primary" id="sun-go">Hacer mis SAVERS este día</button></div>'
      : '<div class="rest"><h2>Domingo</h2><p>Por ahora el domingo está fuera del plan. Si quieres, puedes hacer tus SAVERS igual y quedan registrados.</p>' +
        '<button class="btn primary" id="sun-go">Hacer mis SAVERS hoy</button></div>';
    root.innerHTML = html; bindDay(root, record); setStatus(statusMsg); return;
  }

  const n = countDone(d);
  const schedType = schedTypeOf(ds);
  const fin = record ? "" : finishState(ds, d);
  const settle = !!(opts && opts.settle);
  let morning = record ? "" :
    '<div class="hero"><div class="letters" role="img" aria-label="' + n + ' de 6">' +
      LETTERS.map(function(l){
        return '<span class="lt' + (d.checks[l.key] ? " done" : "") + '" data-letter="' + l.key + '" aria-hidden="true">' + l.L + '</span>';
      }).join("") +
    '</div>' +
    // With the day complete, the finish card already shows the streak.
    '<div class="progress">' + (fin === "day" ? '<span></span>' : '<span>Racha: <strong id="p-streak">' + streakLabel(streak()) + '</strong></span>') +
      (hasSchedule(schedType) ? '<button class="linkbtn" data-sched="' + schedType + '">Ver horario ›</button>' : '') + '</div></div>';

  const blocks = dayBlocks(ds, schedType);
  const now = record ? null : nextKey(blocks, d);
  function blocksHTML(list){
    return list.map(function(b){
      return (b.head ? '<p class="bhead">' + b.head.filter(Boolean).map(function(x, i){ return i ? esc(x) : '<b>' + esc(x) + '</b>'; }).join(" · ") + '</p>' : '') +
        b.keys.map(function(k){ return cardHTML(LETTER_BY[k], k === now); }).join("");
    }).join("");
  }
  // Once today reaches a finish, what's behind it folds into one row: the morning for "Mañana lista",
  // everything for "Día completo". A record keeps the whole list, it's what you came to see.
  const folded = fin ? blocks.filter(function(b){ return fin === "day" || !b.later; }) : [];
  const rest = blocks.filter(function(b){ return folded.indexOf(b) < 0; });
  let foldHTML = "";
  if(folded.length){
    const count = folded.reduce(function(a, b){ return a + b.keys.length; }, 0);
    const label = fin === "day" && blocks.some(function(b){ return b.later; }) ? "Todo el día" : "Mañana";
    // Settling, it's drawn open at the height the cards had, then shrinks into its row (settleFinish).
    foldHTML = '<details class="card fold"' + (foldOpenFor === ds || settle ? " open" : "") + '>' +
      '<summary><span class="chk done" aria-hidden="true"><span class="chk-t">✓</span></span>' +
        '<span class="ttl"><b>' + label + ' <small>· ' + count + ' hechas</small></b></span>' +
        '<span class="caret" aria-hidden="true"></span></summary>' +
      '<div class="list">' + blocksHTML(folded) + '</div></details>';
  }
  morning += '<div class="list">' + foldHTML + blocksHTML(rest) + '</div>';

  function cardHTML(l, isNow){
    const info = letterInfo(l.key, schedType);
    // In a record only Escritura opens: it's a day to look at, not a morning to run again.
    if(record && l.key !== "escritura") info.fixed = true;
    const on = !!d.checks[l.key];
    const cls = 'class="card' + (on ? " done" : "") + (isNow ? " now" : "") + '" data-card="' + l.key + '"';
    const row =
      letterToggleHTML("chk", l, on, "Marcar " + l.name, '<span class="chk-t">' + (on ? "✓" : l.L) + '</span>') +
      '<span class="ttl"><b>' + l.name + '<span class="now-tag">Ahora</span></b><span>' + info.sub + '</span></span>' +
      '<span class="time">' + esc(info.time) + '</span>';
    // Only a card with something to do inside opens (Silencio, and Ejercicio on gym days, don't).
    if(info.fixed) return '<div ' + cls + '><div class="cardrow">' + row + '<span class="nocaret"></span></div></div>';
    const inner = l.key === "escritura" ? writingHTML(ds, d, record ? "d" : "t") : '<div class="body">' + info.html + '</div>';
    return '<details ' + cls + ((isNow || (!record && openCards.has(l.key))) && !on ? " open" : "") + '>' +
      '<summary>' + row + '<span class="caret" aria-hidden="true"></span></summary>' + inner + '</details>';
  }

  if(fin){
    const left = fin === "morning" ? blocks.filter(function(b){ return b.later; }) : [];
    const pending = left.map(function(b){
      const names = b.keys.filter(function(k){ return !d.checks[k]; }).map(function(k){ return LETTER_BY[k].name; });
      return names.length ? names.join(" y ") + (b.head && b.head[1] ? " a las " + b.head[1] : "") : "";
    }).filter(Boolean).join(", ");
    html +=
      '<div class="finish-wrap"' + (settle ? ' style="height:0"' : '') + '><div class="finish" data-fin="' + fin + '"><div class="big" aria-hidden="true">✓</div>' +
        '<h2>' + (fin === "morning" ? "Mañana lista" : "Día completo") + '</h2>' +
        (fin === "morning" ? '<p>Falta <strong>' + esc(pending) + '</strong></p>' : '<p>Racha: <strong>' + streakLabel(streak()) + '</strong></p>') +
        (backupOverdue() ? '<p class="remind">' + (state.lastExport ? "Hace " + backupAge() + " días sin copia" : "Todavía no exportas una copia") + ' · <button class="linkbtn" data-act="export">Exportar</button></p>' : '') +
      '</div></div>';
  }
  html += morning;

  root.innerHTML = html;
  bindDay(root, record);
  if(!record){ updateAllRunUI(); syncReading(); }
  setStatus(statusMsg);
  fitFields(root);
}
let finishT = null;

// Reaching a finish folds what's behind it in place: the cards shrink into the "Mañana · N hechas" row
// right where they were, the page shortens under the view, and then the finish card grows in on top.
function settleFinish(){
  const root = $("#view-today");
  const list = $(".hero + .list", root);
  if(!list || reduceMotion()){ renderToday(); reveal($(".finish-wrap", root)); return; }
  const ds = state.today, d = state.days[ds] || blankDay(ds), fin = finishState(ds, d);
  const keys = [];
  dayBlocks(ds, schedTypeOf(ds)).forEach(function(b){ if(fin === "day" || !b.later) keys.push.apply(keys, b.keys); });
  const top = list.getBoundingClientRect().top;
  let bottom = top;
  Array.from(list.children).forEach(function(el){
    if(el.classList.contains("fold") || keys.indexOf(el.getAttribute("data-card")) >= 0) bottom = Math.max(bottom, el.getBoundingClientRect().bottom);
  });
  renderToday({settle: true});
  const fold = $("details.fold", root), wrap = $(".finish-wrap", root);
  if(!fold || !wrap) return;
  quietScroll(DUR * 3);
  const dy = $(".hero + .list", root).getBoundingClientRect().top - top;
  if(Math.abs(dy) > 0.5) window.scrollBy(0, dy);
  const sum = $(":scope > summary", fold), inner = $(":scope > .list", fold);
  // The cards start where they were (under the row that is fading in) and fade as they fold.
  const fade = inner.animate([{opacity: 1, transform: "translateY(" + (-sum.offsetHeight) + "px)"}, {opacity: 0, transform: "none"}], {duration: DUR * 0.7, easing: "ease-out", fill: "forwards"});
  sum.animate([{opacity: 0}, {opacity: 1}], {duration: DUR, easing: "ease-out"});
  setOpen(fold, false, {from: bottom - top, after: function(){
    fade.cancel();
    if(!wrap.isConnected) return;
    wrap.style.height = "";
    animateHeight(wrap, 0, liveHeight(wrap));
    wrap.firstElementChild.animate([{opacity: 0, transform: "translateY(8px)"}, {opacity: 1, transform: "none"}], {duration: DUR + 150, easing: "ease-out"});
    reveal(wrap);
  }});
}

function closeCard(card){ openCards.delete(card.getAttribute("data-card")); setOpen(card, false); }

let toggleSeq = 0;
function letterToggleHTML(cls, l, on, label, inner){
  const id = "tg-" + cls + "-" + l.key + "-" + (toggleSeq++);
  return '<label class="' + cls + (on ? " done" : "") + '" for="' + id + '" data-toggle="' + l.key + '" role="button" tabindex="0" aria-pressed="' + on + '" aria-label="' + label + '">' +
    inner + '<input type="checkbox" switch id="' + id + '" class="tg" tabindex="-1" aria-hidden="true"></label>';
}

function refreshChecks(){
  const root = dayView.root, ds = dayView.ds;
  if(!root) return;
  const d = state.days[ds] || blankDay(ds);
  LETTERS.forEach(function(l){
    const on = !!d.checks[l.key];
    $$('[data-toggle="' + l.key + '"]', root).forEach(function(b){
      b.classList.toggle("done", on);
      b.setAttribute("aria-pressed", on);
      const t = $(".chk-t", b); if(t) t.textContent = on ? "✓" : l.L;
    });
  });
  $$(".card[data-card]", root).forEach(function(card){
    const on = !!d.checks[card.getAttribute("data-card")];
    // Writing that's still being typed stays open and closes when the field is left.
    if(on && !card.classList.contains("done")) settleCard(card);
    else if(!on && card.classList.contains("done")) unsettleCard(card);
  });
  const n = countDone(d);
  const count = $(".dcount", root); if(count) count.textContent = "· " + n + " de 6";
  if(!dayView.record && state.tab === "today"){
    const shownEl = $(".finish", root);
    const shown = shownEl ? shownEl.getAttribute("data-fin") : "";
    const want = finishState(ds, d);
    clearTimeout(finishT);
    if(FINISH_RANK[want] > FINISH_RANK[shown]){
      // Let the last circle fill and the arpeggio start first.
      finishT = setTimeout(function(){
        if(state.tab !== "today" || dayView.record || finishState(ds, state.days[ds] || blankDay(ds)) !== want) return;
        const a = document.activeElement;
        if(a && a.classList && a.classList.contains("wt")) return;
        settleFinish();
      }, 400);
    } else if(want !== shown){
      renderToday();
    }
  }
  LETTERS.forEach(function(l){ $$('[data-letter="' + l.key + '"]', root).forEach(function(t){ t.classList.toggle("done", !!d.checks[l.key]); }); });
  $$(".letters", root).forEach(function(g){ g.setAttribute("aria-label", n + " de 6"); });
  const s = $("#p-streak", root); if(s) s.textContent = streakLabel(streak());
  updateNow();
  updateAllRunUI();
  renderReading(readingState());
}

function toggleLetter(key, ds){
  ds = ds || dayView.ds;
  const d = getDay(ds, true);
  if(dayType(ds) === "domingo") d.extra = true;
  d.checks[key] = !d.checks[key];
  if(ds === dayView.ds) refreshChecks();
  saveDay(ds, 150);
  if(key === "lectura" && d.checks[key] && readingState()) clearReading();
  if(!d.checks[key]) return;
  // The finish card says it; no toast on top of it.
  if(!dayView.record && finishState(ds, d)) completeSound(); else popSound();
}

function switchDayType(){
  const ds = dayView.ds, d = getDay(ds, true);
  const next = dayType(ds) === "gym" ? "normal" : "gym";
  // Back to what the week says: nothing to remember.
  if(next === weekDayType(ds)) delete d.type; else d.type = next;
  saveDay(ds, 0);
  rerenderDay();
  toast((ds === state.today ? "Hoy es " : "Queda como ") + (next === "gym" ? "día de gym" : "día normal"));
}

function bindDay(root, record){
  const ds = dayView.ds;
  $$("[data-toggle]", root).forEach(function(b){
    const key = b.getAttribute("data-toggle");
    // The switch's own change is what vibrates; the click must not reach <summary> and fold the card.
    $("input.tg", b).addEventListener("change", function(){ toggleLetter(key, ds); });
    b.addEventListener("click", function(e){ e.stopPropagation(); });
    b.addEventListener("keydown", function(e){
      if(e.key === "Enter" || e.key === " "){ e.preventDefault(); toggleLetter(key, ds); }
    });
  });
  $$("details.card", root).forEach(function(det){
    $(":scope > summary", det).addEventListener("click", function(e){ e.preventDefault(); setOpen(det, !wantsOpen(det)); });
  });
  if(!record) $$("details.card[data-card]", root).forEach(function(det){
    det.addEventListener("toggle", function(){
      const k = det.getAttribute("data-card");
      // The "Ahora" card opens by itself; only cards opened by hand are remembered.
      if(det.open){ if(!det.classList.contains("now")) openCards.add(k); } else openCards.delete(k);
    });
  });
  const fold = $("details.fold", root);
  if(fold) fold.addEventListener("toggle", function(){ foldOpenFor = fold.open ? state.today : ""; });
  const dt = $("#day-type", root);
  if(dt) dt.addEventListener("click", switchDayType);
  const gi = $("#go-import", root);
  if(gi) gi.addEventListener("click", function(){ $("#import-file").click(); });
  $$("[data-sched]", root).forEach(function(b){ b.addEventListener("click", function(){ openSchedule(b.getAttribute("data-sched")); }); });
  $$("[data-open]", root).forEach(function(b){ b.addEventListener("click", function(){ openSettingsFromToday(b.getAttribute("data-open")); }); });
  const ex = $('.finish [data-act="export"]', root);
  if(ex) ex.addEventListener("click", exportBackup);
  const sg = $("#sun-go", root);
  if(sg) sg.addEventListener("click", function(){
    if(!record) state.showSunday = true;
    const d = getDay(ds, true); d.extra = true; saveDay(ds, 150);
    if(record) renderDay(root, ds, true); else renderToday();
  });

  // guided timers, reading
  $$(".timer[data-run]", root).forEach(function(box){
    const r = runs[box.getAttribute("data-run")];
    $('[data-act="go"]', box).addEventListener("click", function(){ r.running ? pauseRun(r) : startRun(r); });
    $('[data-act="skip"]', box).addEventListener("click", function(){ skipStep(r); });
    $('[data-act="reset"]', box).addEventListener("click", function(){ resetRun(r); });
  });
  const rd = $(".timer[data-read]", root);
  if(rd){
    $('[data-rd="go"]', rd).addEventListener("click", startReading);
    $('[data-rd="done"]', rd).addEventListener("click", finishReading);
    $('[data-rd="cancel"]', rd).addEventListener("click", clearReading);
  }
}

/* ---------- guided timers: ejercicio and visualización ---------- */
// Time is derived from the clock, not counted per tick, so it stays right when iOS pauses the page.
const EX_TOTAL = STEPS.reduce(function(a, s){ return a + s.secs; }, 0);
const VIS_SECS = 60;

function exCue(i){
  const s = STEPS[i];
  if(!s) return "";
  if(i === STEPS.length - 1) return "Último: piernas en la silla, respira lento.";
  if(s.round === 2 && s.ex === CIRCUIT[0][0]) return "Ronda dos: " + s.ex.toLowerCase() + ".";
  return "Sigue: " + s.ex.toLowerCase() + ".";
}
function visSteps(){
  return filled(state.settings.visualization.items).map(function(v, i){
    return {name: v.label.trim() || "Pregunta " + (i + 1), text: v.text.trim(), secs: VIS_SECS};
  });
}

const runs = {
  ejercicio: {
    storeKey: "savers:timer",
    steps: function(){ return STEPS; },
    enter: function(i, how){
      const s = STEPS[i];
      beep(s.rest ? 520 : 880, how === "start" ? .15 : .18);
      if(how === "start" && i === 0) say("Marchar en el sitio, un minuto.");
      else if(s.rest) say(exCue(i + 1));
      else if(how === "skip") say(exCue(i));
    },
    second: function(i, remain){
      if(remain > 0 && remain <= 3) beep(660, .08);
      // Steps with no 5-second change before them get announced a few seconds early.
      const next = STEPS[i + 1];
      if(remain === 6 && next && !next.rest && !STEPS[i].rest) say(exCue(i + 1));
    },
    finish: function(){
      beep(988, .25); setTimeout(function(){ beep(1318, .35); }, 260);
      say("Listo. Ejercicio marcado.");
      return {letter: "ejercicio", toast: "Ejercicio terminado y marcado"};
    },
    view: function(r, idx){
      if(!r.started) return {now: "Listo para empezar", next: "Primero: marchar en el sitio"};
      const s = STEPS[idx], nx = STEPS[idx + 1];
      return {
        now: s.rest ? "Cambia de ejercicio" : s.name,
        next: nx ? "Sigue: " + (nx.rest ? (STEPS[idx + 2] ? STEPS[idx + 2].name : "") : nx.name) : "Último bloque"
      };
    }
  },
  visualizacion: {
    storeKey: "savers:timer:vis",
    steps: visSteps,
    enter: function(i, how){
      const s = visSteps()[i]; if(!s) return;
      if(how === "start") beep(880, .15); else bell();
      say(s.text);
    },
    second: function(i, remain){ if(remain === 10) softTone(); },
    finish: function(){
      bell();
      setTimeout(function(){ say("Visualización lista."); }, 700);
      return {letter: "visualizacion", toast: "Visualización lista y marcada"};
    },
    view: function(r, idx){
      const list = visSteps();
      if(!r.started) return {now: "Cierra los ojos y escucha", next: "La voz te lee cada pregunta y te da un minuto."};
      const s = list[idx] || {name: "", text: ""};
      return {now: "Pregunta " + (idx + 1) + " de " + list.length, next: s.text};
    }
  }
};
Object.keys(runs).forEach(function(k){
  Object.assign(runs[k], {key: k, running: false, base: 0, runStart: 0, started: false, lastIdx: 0, lastRemain: null, day: null});
});
let runIv = null, wake = null;

function anyRunning(){ return Object.keys(runs).some(function(k){ return runs[k].running; }); }
function runTotal(r){ return r.steps().reduce(function(a, s){ return a + s.secs; }, 0); }
function stepStart(r, i){ const st = r.steps(); let t = 0; for(let k = 0; k < i; k++) t += st[k].secs; return t; }
function elapsedSecs(r){ return r.base + (r.running ? (Date.now() - r.runStart) / 1000 : 0); }
function stepAt(r, el){
  const st = r.steps();
  let i = 0, t = 0;
  while(i < st.length - 1 && el >= t + st[i].secs){ t += st[i].secs; i++; }
  return i;
}
function persistRun(r){
  if(r.started) store.set(r.storeKey, {base: r.base, runStart: r.runStart, running: r.running, day: r.day});
  else { try { localStorage.removeItem(r.storeKey); } catch(e){} }
}
function restoreRuns(){
  Object.keys(runs).forEach(function(k){
    const r = runs[k], t = store.get(r.storeKey);
    if(!t || t.day !== todayStr() || !r.steps().length){ try { localStorage.removeItem(r.storeKey); } catch(e){} return; }
    r.base = Number(t.base) || 0; r.runStart = Number(t.runStart) || Date.now();
    r.started = true; r.running = !!t.running; r.day = t.day;
    const el = elapsedSecs(r), total = runTotal(r);
    if(el >= total + 600){ resetRun(r); return; }
    r.lastIdx = stepAt(r, Math.min(el, total - 0.001));
  });
  syncRunLoop();
}
function syncRunLoop(){
  if(anyRunning()){ if(!runIv) runIv = setInterval(tickRuns, 250); requestWake(); }
  else { clearInterval(runIv); runIv = null; releaseWake(); }
}

function beep(freq, dur){ tone(freq, freq, dur, 0.16); }
async function requestWake(){
  try {
    if(navigator.wakeLock && anyRunning() && document.visibilityState === "visible" && !wake){
      wake = await navigator.wakeLock.request("screen");
      wake.addEventListener("release", function(){ wake = null; });
    }
  } catch(e){ wake = null; }
}
function releaseWake(){ try { if(wake) wake.release(); } catch(e){} wake = null; }

function startRun(r){
  if(!r.steps().length) return;
  Object.keys(runs).forEach(function(k){ if(runs[k] !== r && runs[k].running) pauseRun(runs[k]); });
  setAudioMode(runAudioMode());
  ensureAudio();
  unlockSpeech();
  const fresh = !r.started;
  if(fresh){ r.base = 0; r.lastIdx = 0; r.day = todayStr(); }
  r.running = true; r.started = true; r.runStart = Date.now(); r.lastRemain = null;
  if(fresh) r.enter(0, "start"); else beep(880, .15);
  persistRun(r);
  syncRunLoop();
  updateRunUI(r);
}
function pauseRun(r, keepAudioMode){
  if(r.running) r.base = elapsedSecs(r);
  r.running = false;
  syncRunLoop();
  if(keepAudioMode !== true && !anyRunning()) setAudioMode("ambient");
  persistRun(r);
  updateRunUI(r);
}
function resetRun(r){
  pauseRun(r);
  try { if(window.speechSynthesis) speechSynthesis.cancel(); } catch(e){}
  r.base = 0; r.started = false; r.lastIdx = 0; r.lastRemain = null;
  persistRun(r); updateRunUI(r);
}
function skipStep(r){
  if(!r.steps().length) return;
  if(!r.started){ setAudioMode(runAudioMode()); ensureAudio(); unlockSpeech(); r.started = true; r.day = todayStr(); r.base = 0; }
  const idx = stepAt(r, elapsedSecs(r));
  if(idx >= r.steps().length - 1){ finishRun(r); return; }
  r.base = stepStart(r, idx + 1); r.runStart = Date.now();
  r.lastIdx = idx + 1; r.lastRemain = null;
  r.enter(idx + 1, "skip");
  persistRun(r);
  updateRunUI(r);
}
function tickRuns(){
  Object.keys(runs).forEach(function(k){
    const r = runs[k];
    if(!r.running) return;
    const el = elapsedSecs(r), st = r.steps();
    if(!st.length){ resetRun(r); return; }
    if(el >= runTotal(r)){ finishRun(r); return; }
    const idx = stepAt(r, el);
    if(idx !== r.lastIdx){
      r.lastIdx = idx; r.lastRemain = null;
      r.enter(idx, "auto");
    } else {
      const remain = Math.ceil(stepStart(r, idx) + st[idx].secs - el);
      if(remain !== r.lastRemain){ r.lastRemain = remain; r.second(idx, remain); }
    }
    updateRunUI(r);
  });
}
function finishRun(r){
  pauseRun(r, true);
  const res = r.finish();
  setTimeout(function(){ if(!anyRunning()) setAudioMode("ambient"); }, 4000);
  const ds = r.day || state.today;
  r.base = 0; r.started = false; r.lastIdx = 0; r.lastRemain = null;
  persistRun(r);
  const d = getDay(ds, true);
  if(!d.checks[res.letter]){
    d.checks[res.letter] = true;
    saveDay(ds, 0);
    if(dayView.ds === ds) refreshChecks();
  }
  toast(res.toast);
  updateRunUI(r);
}

function runBoxHTML(key){
  const r = runs[key];
  return '<div class="timer" data-run="' + key + '">' +
    '<div class="tm-now" data-r="now"></div>' +
    '<div class="tm-next" data-r="next"></div>' +
    '<div class="tm-clock" data-r="clock" aria-live="off">' + Math.floor(runTotal(r) / 60) + ':' + pad(runTotal(r) % 60) + '</div>' +
    '<div class="bar"><i data-r="bar"></i></div>' +
    '<div class="row">' +
      '<button class="btn primary" data-act="go">Empezar</button>' +
      '<button class="btn" data-act="skip">Siguiente</button>' +
      '<button class="btn" data-act="reset" hidden>Reiniciar</button>' +
    '</div>' +
  '</div>';
}
function doneToday(key){ const d = state.days[state.today]; return !!(d && d.checks && d.checks[key]); }
function updateRunUI(r){
  const box = $('.timer[data-run="' + r.key + '"]'); if(!box) return;
  const total = runTotal(r);
  const el = Math.min(elapsedSecs(r), Math.max(0, total - 0.001));
  const idx = r.started ? stepAt(r, el) : 0;
  // Already marked and not running again: the tool steps back and offers a repeat.
  const rest = !r.started && doneToday(r.key);
  box.classList.toggle("is-done", rest);
  const v = rest ? {now: "Hecho", next: "Si quieres, puedes repetirlo."} : r.view(r, idx);
  $('[data-r="now"]', box).textContent = v.now;
  $('[data-r="next"]', box).textContent = v.next;
  let clock = total;
  if(r.started){
    const st = r.steps();
    clock = st[idx] ? Math.max(0, Math.ceil(stepStart(r, idx) + st[idx].secs - el)) : 0;
  }
  $('[data-r="clock"]', box).textContent = Math.floor(clock / 60) + ":" + pad(clock % 60);
  $('[data-r="bar"]', box).style.width = (r.started && total ? el / total * 100 : 0) + "%";
  $('[data-act="go"]', box).textContent = r.running ? "Pausar" : r.started ? "Seguir" : rest ? "Repetir" : "Empezar";
  $('[data-act="reset"]', box).hidden = !r.started;
}

/* ---------- history ---------- */
/* ---------- screens inside a tab: push, pop, and back from the edge ---------- */
// A detail screen sits over its list; x is how far right the detail is pushed (0 = detail shown,
// W = list shown). While it moves, both screens live in fixed layers laid out like the page; when it
// settles, the one that stays goes back into the tab's section with its scroll.
let navT = null;
const navY = {};   // each tab's list scroll, to come back to it
function takeNodes(el){ const out = Array.from(el.childNodes); out.forEach(function(n){ el.removeChild(n); }); return out; }
function navLayer(nodes, y){
  const l = document.createElement("div");
  l.className = "navlayer";
  l.style.top = -y + "px";
  l.style.minHeight = (y + window.innerHeight) + "px";
  const w = document.createElement("div");
  w.className = "wrap";
  nodes.forEach(function(n){ w.appendChild(n); });
  l.appendChild(w);
  const dim = document.createElement("div");
  dim.className = "navdim";
  l.appendChild(dim);
  document.body.appendChild(l);
  // A sticky bar stays at the top of the screen as it was, not where it sits in the content.
  const bar = $(".gtop", w);
  if(bar){ const pad = bar.offsetTop; if(y > pad) bar.style.transform = "translateY(" + (y - pad) + "px)"; }
  return l;
}
function navPaint(t, x){
  const p = Math.max(0, Math.min(1, x / t.W));
  t.top.style.transform = "translateX(" + Math.max(0, x) + "px)";
  t.under.style.transform = "translateX(" + (-(1 - p) * 0.3 * t.W) + "px)";
  $(".navdim", t.under).style.opacity = (1 - p) * 0.12;
}
// states: {detail: fn, list: fn}, the state each end leaves behind.
function navStart(view, detailNodes, detailY, listNodes, listY, states){
  const t = {view: view, W: window.innerWidth, states: states};
  t.under = navLayer(listNodes, listY);
  t.top = navLayer(detailNodes, detailY);
  t.top.classList.add("navtop");
  t.spring = new Spring(0, function(x){ navPaint(t, x); });
  t.go = function(target, v){ t.spring.to(target, v, function(){ navSettle(t, target); }); };
  navT = t;
  return t;
}
function navSettle(t, x){
  if(navT !== t) return;
  navT = null;
  t.spring.stop();
  const detail = x < t.W / 2;
  const keep = detail ? t.top : t.under;
  const y = -parseFloat(keep.style.top) || 0;
  const bar = $(".gtop", keep); if(bar) bar.style.transform = "";
  const nodes = Array.from(keep.firstChild.childNodes);
  nodes.forEach(function(n){ t.view.appendChild(n); });
  t.top.remove(); t.under.remove();
  window.scrollTo(0, y);
  (detail ? t.states.detail : t.states.list)();
  if(reduceMotion()) fadeIn(t.view);
  updateEdge();
}
// Anything that re-renders a tab first lands a moving screen where it was going.
function navFinishNow(){
  const t = navT;
  if(!t) return;
  navDrag = null;
  document.documentElement.classList.remove("dragging");
  navSettle(t, t.spring.raf ? t.spring.target : (t.spring.x < t.W / 2 ? 0 : t.W));
}
function navPush(view, render, states){
  navFinishNow();
  const listY = window.scrollY;
  navY[view.id] = listY;
  const listNodes = takeNodes(view);
  render();
  const t = navStart(view, takeNodes(view), 0, listNodes, listY, states);
  t.spring.set(t.W);
  t.go(0, 0);
}
// Builds the pop (the list rendered underneath) without moving it: a button sends it, a finger drags it.
function navPop(view, render, states){
  navFinishNow();
  const detailY = window.scrollY;
  const detailNodes = takeNodes(view);
  render();
  const t = navStart(view, detailNodes, detailY, takeNodes(view), navY[view.id] || 0, states);
  t.spring.set(0);
  return t;
}
function popCurrent(){
  if(state.tab === "history" && state.histDay){
    const ds = state.histDay;
    return navPop($("#view-history"), function(){ state.histDay = null; renderHistory(); },
      {detail: function(){ state.histDay = ds; }, list: function(){ state.histDay = null; }});
  }
  if(state.tab === "settings" && state.page && !state.edit && state.from !== "today"){
    const p = state.page;
    return navPop($("#view-settings"), function(){ state.page = null; renderSettings(); },
      {detail: function(){ state.page = p; }, list: function(){ state.page = null; }});
  }
  return null;
}
function canPop(){
  if($(".backdrop")) return false;
  if(state.tab === "history") return !!state.histDay;
  return state.tab === "settings" && !!state.page && !state.edit && state.from !== "today";
}
function popScreen(){ const t = popCurrent(); if(t) t.go(t.W, 0); }

// Back from the left edge: the screen follows the finger, and the release velocity decides.
let navDrag = null;
document.addEventListener("pointerdown", function(e){
  if(!e.isPrimary || (e.pointerType === "mouse" && e.button !== 0)) return;
  if(navT){
    // Caught mid-flight: it follows the finger from where it is.
    navT.spring.stop();
    navDrag = {t: navT, x0: e.clientX - navT.spring.x, y0: e.clientY, live: true, tr: new Tracker()};
    navDrag.tr.add(e.clientX, e.clientY);
    document.documentElement.classList.add("dragging");
    return;
  }
  if(e.clientX > 20 || !canPop()) return;
  navDrag = {t: null, x0: e.clientX, y0: e.clientY, live: false, tr: new Tracker()};
  navDrag.tr.add(e.clientX, e.clientY);
}, true);
window.addEventListener("pointermove", function(e){
  const g = navDrag;
  if(!g || !e.isPrimary) return;
  g.tr.add(e.clientX, e.clientY);
  if(!g.live){
    const dx = e.clientX - g.x0, dy = e.clientY - g.y0;
    if(Math.abs(dy) > 10 && Math.abs(dy) > dx){ navDrag = null; return; }
    if(dx < 10) return;
    const a = document.activeElement; if(a && a.blur && a !== document.body) a.blur();
    g.t = popCurrent();
    if(!g.t){ navDrag = null; return; }
    g.x0 = e.clientX;
    g.live = true;
    document.documentElement.classList.add("dragging");
  }
  g.t.spring.x = Math.max(0, e.clientX - g.x0);
  navPaint(g.t, g.t.spring.x);
});
function navRelease(){
  const g = navDrag;
  if(!g) return;
  navDrag = null;
  document.documentElement.classList.remove("dragging");
  if(!g.live || !g.t || navT !== g.t) return;
  swallowUntil = performance.now() + 350;
  const v = g.tr.v("x"), x = g.t.spring.x;
  g.t.go(x + project(v) > g.t.W / 2 ? g.t.W : 0, v);
}
window.addEventListener("pointerup", navRelease);
window.addEventListener("pointercancel", navRelease);

// The bar of an inner screen gets its line only while content passes under it.
function updateEdge(){
  const v = state.tab === "settings" ? $("#view-settings") : state.tab === "history" ? $("#view-history") : null;
  const bar = v && $(".gtop.nav", v);
  if(bar) bar.classList.toggle("edge", window.scrollY > 2);
}
window.addEventListener("scroll", updateEdge, {passive: true});

function monthName(y, m){ return cap(new Date(y, m, 1).toLocaleDateString("es", {month: "long", year: "numeric"})); }
function isCurrentMonth(y, m){ const t = parse(state.today); return y === t.getFullYear() && m === t.getMonth(); }
function shiftMonth(y, m, n){ const d = new Date(y, m + n, 1); return {y: d.getFullYear(), m: d.getMonth()}; }
function monthPaneHTML(y, m){
  const first = new Date(y, m, 1);
  const daysIn = new Date(y, m + 1, 0).getDate();
  let complete = 0, scheduled = 0;
  for(let i = 1; i <= daysIn; i++){
    const ds = fmt(new Date(y, m, i));
    if(isScheduled(ds) && ds <= state.today){ scheduled++; if(isComplete(ds)) complete++; }
  }
  let html = '<div class="calpane"><div class="monthhead"><h3>' + esc(monthName(y, m)) + '</h3>' +
    '<p class="mcount">' + (scheduled ? complete + " de " + scheduled + (scheduled === 1 ? " mañana completa" : " mañanas completas") : "Sin mañanas todavía") + '</p></div>' +
    '<div class="cal">' + ["D","L","M","M","J","V","S"].map(function(x){ return '<div class="dow">' + x + '</div>'; }).join("");
  for(let b = 0; b < first.getDay(); b++) html += '<div class="cell blank"></div>';
  for(let i = 1; i <= daysIn; i++){
    const ds = fmt(new Date(y, m, i));
    const d = state.days[ds];
    const n = countDone(d);
    const cls = ["cell"];
    const future = ds > state.today;
    const t = dayType(ds);
    const off = t === "shabbat" || (t === "domingo" && !hasContent(d));
    if(off) cls.push("off");
    if(future && !off) cls.push("future");
    if(n === 6) cls.push("full");
    if(ds === state.today) cls.push("today");
    const label = longDate(ds) + (off ? "" : ", " + n + " de 6");
    html += '<button class="' + cls.join(" ") + '" style="--p:' + (n/6) + '" data-day="' + ds + '"' + (future || t === "shabbat" ? " disabled" : "") + ' aria-label="' + esc(label) + '"><span>' + i + '</span></button>';
  }
  return html + '</div></div>';
}
// The month's records, read in full; tapping one opens its day.
function entriesHTML(y, m){

function calStripHTML(){

// Months: three panes (previous, this, next) on a strip; the strip follows the finger and settles on one.
const pager = {spring: null, page: 0};
function pagerPaint(x){
  const strip = $("#view-history .calstrip");
  if(strip) strip.style.transform = "translateX(" + (x - pager.page) + "px)";
}
pager.spring = new Spring(0, pagerPaint);
function layoutPager(){
  const wrap = $("#view-history .calwrap");
  if(!wrap) return;
  pager.page = wrap.clientWidth;   // a pane plus the gap
  pager.spring.set(0);
  const cur = $(".calstrip", wrap).children[1];
  wrap.style.height = cur.offsetHeight + "px";
  const next = $(".navbtn.next", wrap);
  next.disabled = isCurrentMonth(state.month.y, state.month.m);
}
function hasNextMonth(){ return !isCurrentMonth(state.month.y, state.month.m); }
// Lands on the month the strip moved to: the new middle pane is the one already in view.
function commitMonth(dir){
  const wrap = $("#view-history .calwrap");
  if(!wrap) return;
  state.month = shiftMonth(state.month.y, state.month.m, dir);
  const from = wrap.offsetHeight;
  $(".calstrip", wrap).innerHTML = calStripHTML();
  layoutPager();
  const to = wrap.offsetHeight;
  if(Math.abs(to - from) > 0.5 && !reduceMotion()) animateHeight(wrap, from, to);
  const list = $("#view-history .hentries");
  list.innerHTML = entriesHTML(state.month.y, state.month.m);
  fadeIn(list);
  if(reduceMotion()) fadeIn(wrap);
}
function pageMonth(dir){
  if(dir > 0 && !hasNextMonth()) return;
  const sp = pager.spring;
  if(sp.raf && sp.target !== 0){ const d = sp.target < 0 ? 1 : -1; sp.stop(); commitMonth(d); }
  sp.to(dir > 0 ? -pager.page : pager.page, sp.v, function(){ commitMonth(dir); });
}
let pageDrag = null;
document.addEventListener("pointerdown", function(e){
  const wrap = e.target.closest && e.target.closest("#view-history .calwrap");
  if(!wrap || !e.isPrimary || (e.pointerType === "mouse" && e.button !== 0) || navT) return;
  const sp = pager.spring;
  pageDrag = {x0: e.clientX, y0: e.clientY, sx: sp.x, live: false, tr: new Tracker()};
  pageDrag.tr.add(e.clientX, e.clientY);
  if(sp.raf){ sp.stop(); pageDrag.live = true; document.documentElement.classList.add("dragging"); }
});
window.addEventListener("pointermove", function(e){
  const g = pageDrag;
  if(!g || !e.isPrimary) return;
  g.tr.add(e.clientX, e.clientY);
  if(!g.live){
    const dx = e.clientX - g.x0, dy = e.clientY - g.y0;
    if(Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)){ pageDrag = null; return; }
    if(Math.abs(dx) < 10) return;
    g.x0 = e.clientX; g.live = true;
    document.documentElement.classList.add("dragging");
  }
  let x = g.sx + e.clientX - g.x0;
  // Past this month there's nothing: it gives, and comes back.
  if(x < 0 && !hasNextMonth()) x = -rubberband(-x, pager.page);
  pager.spring.x = x;
  pagerPaint(x);
});
function pageRelease(){
  const g = pageDrag;
  if(!g) return;
  pageDrag = null;
  document.documentElement.classList.remove("dragging");
  if(!g.live) return;
  swallowUntil = performance.now() + 350;
  const v = g.tr.v("x"), x = pager.spring.x, end = x + project(v), half = pager.page / 2;
  const dir = end < -half && hasNextMonth() ? 1 : end > half ? -1 : 0;
  pager.spring.to(-dir * pager.page, v, function(){ if(dir) commitMonth(dir); });
}
window.addEventListener("pointerup", pageRelease);
window.addEventListener("pointercancel", pageRelease);
window.addEventListener("resize", function(){ if(state.tab === "history" && !state.histDay) layoutPager(); });

(function bindHistory(){
  const root = $("#view-history");
  root.addEventListener("click", function(e){
    const back = e.target.closest('[data-act="hback"]');
    if(back) return popScreen();
    const mb = e.target.closest("[data-month]");
    if(mb){ if(!mb.disabled) pageMonth(Number(mb.getAttribute("data-month"))); return; }
    const cell = e.target.closest(".cell[data-day]");
    if(cell){ if(!cell.disabled) openDay(cell.getAttribute("data-day")); return; }
    const entry = e.target.closest("[data-open-day]");
    if(entry) openDay(entry.getAttribute("data-open-day"));
  });
  root.addEventListener("keydown", function(e){
    const entry = e.target.closest && e.target.closest("[data-open-day]");
    if(entry && (e.key === "Enter" || e.key === " ")){ e.preventDefault(); openDay(entry.getAttribute("data-open-day")); }
  });
})();

/* ---------- horario ---------- */
function scheduleType(type){
  const sc = state.settings.schedule;
  return sc && sc.types && sc.types[type] && typeof sc.types[type] === "object" ? sc.types[type] : null;
}
function defaultScheduleTab(){ return dayType(state.today) === "gym" ? "gym" : "normal"; }
function stepsHTML(list, cls){
  return '<ol class="tlist' + (cls ? " " + cls : "") + '">' + list.map(function(st){
    const key = /savers/i.test(st.short || st.title || "");
    return '<li class="tstep' + (key && !cls ? " key" : "") + '"><span class="tt">' + esc(st.time) + '</span><span class="rail" aria-hidden="true"></span>' +
      '<span class="tx">' + esc(st.title) + (st.detail ? '<span>' + esc(st.detail) + '</span>' : '') + '</span></li>';
  }).join("") + '</ol>';
}
function laterRows(later){
  const rows = [];
  later.forEach(function(x){
    if(!x || !x.times){ rows.push(x); return; }
    Object.keys(x.times).forEach(function(k){
      const w = DAY_KEYS.map(plainDay).indexOf(plainDay(k));
      rows.push({time: x.times[k], title: x.title, detail: w >= 0 ? DAY_NAMES[w] : k});
    });
  });
  return rows;
}
function scheduleHTML(){
  const sc = state.settings.schedule;
  if(sc && sc.types && (sc.types.normal || sc.types.gym)){
    const tab = scheduleType(state.schedTab) ? state.schedTab : (scheduleType(defaultScheduleTab()) ? defaultScheduleTab() : (sc.types.normal ? "normal" : "gym"));
    const t = scheduleType(tab);
    const seg = ["normal", "gym"].filter(scheduleType).map(function(k){
      const x = scheduleType(k);
      return '<button data-act="sched" data-type="' + k + '" aria-pressed="' + (k === tab) + '"><b>' + esc(x.label || (k === "gym" ? "Gym" : "Normal")) + '</b>' + (x.days ? '<small>' + esc(x.days) + '</small>' : '') + '</button>';
    }).join("");
    return '<div class="seg" role="group" aria-label="Tipo de día">' + seg + '</div>' +
      (Array.isArray(t.night) && t.night.length ? '<p class="tgroup">La noche anterior</p>' + stepsHTML(t.night, "muted") : '') +
      (Array.isArray(t.steps) && t.steps.length ? stepsHTML(t.steps) : '') +
      (Array.isArray(t.later) && t.later.length ? '<p class="tgroup">Más tarde</p>' + stepsHTML(laterRows(t.later)) : '');
  }
  if(!sc || !sc.table || !Array.isArray(sc.table.rows)){
    return '<p class="note">Tu horario se carga al importar tu copia.</p>';
  }
  const head = Array.isArray(sc.table.headers) ? sc.table.headers : [];
  return '<div class="tablewrap"><table>' +
    (head.length ? '<tr>' + head.map(function(h){ return '<th>' + esc(h) + '</th>'; }).join("") + '</tr>' : '') +
    sc.table.rows.map(function(r){ return '<tr>' + (Array.isArray(r) ? r : []).map(function(c){ return '<td>' + esc(c) + '</td>'; }).join("") + '</tr>'; }).join("") +
  '</table></div>';
}

function readItemsHTML(items, emptyText){
  const list = filled(items);
  if(!list.length) return '<p class="note">' + emptyText + '</p>';
  return list.map(function(a){
    return '<div class="gitem">' + (a.label.trim() ? '<span class="glabel">' + esc(a.label) + '</span>' : '') + '<p>' + esc(a.text) + '</p></div>';
  }).join("");
}

function editItemsHTML(listKey, items, noun, textPlaceholder){
  return items.map(function(a, i){
    const n = i + 1;
    return '<div class="eitem">' +
      '<label class="sr-only" for="e-' + listKey + '-l-' + i + '">Título de ' + noun + ' ' + n + '</label>' +
      '<input type="text" id="e-' + listKey + '-l-' + i + '" data-elist="' + listKey + '" data-i="' + i + '" data-k="label" value="' + esc(a.label) + '" placeholder="Título (opcional)">' +
      '<label class="sr-only" for="e-' + listKey + '-t-' + i + '">Texto de ' + noun + ' ' + n + '</label>' +
      '<textarea class="grow" rows="1" id="e-' + listKey + '-t-' + i + '" data-elist="' + listKey + '" data-i="' + i + '" data-k="text" placeholder="' + textPlaceholder + '">' + esc(a.text) + '</textarea>' +
      '<div class="ectl">' +
        '<button class="ibtn" data-act="up" data-list="' + listKey + '" data-i="' + i + '" aria-label="Subir ' + noun + ' ' + n + '"' + (i === 0 ? " disabled" : "") + '>↑</button>' +
        '<button class="ibtn" data-act="down" data-list="' + listKey + '" data-i="' + i + '" aria-label="Bajar ' + noun + ' ' + n + '"' + (i === items.length - 1 ? " disabled" : "") + '>↓</button>' +
        '<button class="ibtn del" data-act="del" data-list="' + listKey + '" data-i="' + i + '" aria-label="Borrar ' + noun + ' ' + n + '"' + (items.length === 1 ? " disabled" : "") + '>Borrar</button>' +
      '</div>' +
    '</div>';
  }).join("");
}

// Horario: tapping the strip in Hoy opens the whole schedule for that kind of day.
function openSchedule(type){
  state.schedTab = type;
  const s = openSheet(
    '<div class="shead"><h3 id="sched-t">Horario</h3><button class="tbtn" data-close>Listo</button></div>' +
    '<div class="sbody">' + scheduleHTML() + '</div>',
    {tall: true, labelledby: "sched-t"});
  s.sheet.addEventListener("click", function(e){
    const seg = e.target.closest('[data-act="sched"]');
    if(seg){
      state.schedTab = seg.getAttribute("data-type");
      $(".sbody", s.sheet).innerHTML = scheduleHTML();
      const on = $('[data-type="' + state.schedTab + '"]', s.sheet); if(on) on.focus({preventScroll: true});
      return;
    }
    if(e.target.closest("[data-close]")) s.close();
  });
  $("[data-close]", s.sheet).focus({preventScroll: true});
}

/* ---------- ajustes ---------- */
const PAGES = {aff: "Afirmaciones", vis: "Visualización", backup: "Copia de seguridad"};
function countLabel(n, one, many){ return n + " " + (n === 1 ? one : many); }
function lastBackupLabel(){
  if(!state.lastExport) return "Nunca";
  const d = backupAge();
  return d === 0 ? "Hoy" : d === 1 ? "Ayer" : "Hace " + d + " días";
}
function rowHTML(page, detail, warn){
  return '<button class="srow" data-go="' + page + '"><b>' + PAGES[page] + '</b>' +
    '<small' + (warn ? ' class="warn"' : '') + '>' + esc(detail) + '</small><span class="chev" aria-hidden="true"></span></button>';
}
function settingsListHTML(){
  const s = state.settings;
  const affs = filled(s.affirmations).length, vis = filled(s.visualization.items).length;
  return '<div class="top"><h2 class="sec">Ajustes</h2></div>' +
    '<div class="slist">' +
      '<label class="srow" for="s-name"><b>Tu nombre</b><input type="text" id="s-name" autocomplete="given-name" value="' + esc(s.name) + '" placeholder="Para el saludo"></label>' +
    '</div>' +
    '<div class="slist">' +
      rowHTML("aff", affs ? countLabel(affs, "frase", "frases") : "Vacío") +
      rowHTML("vis", vis ? countLabel(vis, "pregunta", "preguntas") : "Vacío") +
    '</div>' +
    '<div class="slist">' +
      '<label class="srow" for="s-music"><b>Mantener mi música</b><input type="checkbox" switch id="s-music"' + (keepMusic() ? " checked" : "") + '></label>' +
    '</div>' +
    '<p class="sfoot">En los temporizadores tu música sigue sonando, pero la voz solo se oye si el iPhone no está en silencio. Apagado, la voz pausa tu música y suena siempre.</p>' +
    '<div class="slist">' + rowHTML("backup", lastBackupLabel(), backupOverdue()) + '</div>' +
    '<p class="sfoot">Tus registros viven solo en este iPhone.</p>';
}
function settingsPageHTML(){
  const s = state.settings, e = state.edit, p = state.page;
  const top = e
    ? '<div class="gtop nav"><button class="tbtn left" data-act="cancel">Cancelar</button><h2>' + PAGES[p] + '</h2><button class="tbtn right" data-act="done">Listo</button></div>'
    : '<div class="gtop nav"><button class="tbtn left back" data-act="back">' + (state.from === "today" ? "Hoy" : "Ajustes") + '</button><h2>' + PAGES[p] + '</h2>' +
      (p === "backup" ? '' : '<button class="tbtn right" data-act="edit">Editar</button>') + '</div>';
  if(p === "aff") return top + '<div class="gblock">' + (e
    ? editItemsHTML("aff", e.affirmations, "afirmación", "Escribe tu afirmación") +
      '<button class="addbtn" data-act="add" data-list="aff">＋ Agregar afirmación</button>'
    : readItemsHTML(s.affirmations, "Todavía no tienes afirmaciones. Toca Editar para agregarlas.")) + '</div>';
  if(p === "vis") return top + '<div class="gblock">' + (e
    ? editItemsHTML("vis", e.visualization.items, "pregunta", "Escribe la pregunta") +
      '<button class="addbtn" data-act="add" data-list="vis">＋ Agregar pregunta</button>' +
      '<label class="f" for="e-vnote" style="margin-top:14px">Nota <small>opcional</small></label>' +
      '<textarea class="grow" rows="1" id="e-vnote" data-evnote="1">' + esc(e.visualization.note) + '</textarea>'
    : readItemsHTML(s.visualization.items, "Toca Editar para agregar preguntas.") +
      (s.visualization.note.trim() ? '<p class="note" style="margin:10px 0 0">' + esc(s.visualization.note) + '</p>' : '')) + '</div>';
  const last = state.lastExport
    ? new Date(state.lastExport).toLocaleDateString("es", {day:"numeric", month:"long", year:"numeric"}) + " (" + lastBackupLabel().toLowerCase() + ")"
    : "nunca";
  return top + '<div class="gblock">' +
    '<p class="note">Tus registros viven solo en este iPhone. Exporta una copia de vez en cuando y guárdala en Archivos o iCloud.</p>' +
    '<p><b>Última copia:</b> <span' + (backupOverdue() ? ' class="warn"' : '') + '>' + esc(last) + '</span></p>' +
    '<div class="row"><button class="btn primary" data-act="export">Exportar copia</button><button class="btn" data-act="import">Importar copia</button></div>' +
    '<p class="note" style="margin:12px 0 0">Importar también sirve para cargar solo tu horario: se reemplaza únicamente lo que trae el archivo.</p>' +
  '</div>';
}
function renderSettings(){
  const root = $("#view-settings");
  root.innerHTML = state.page ? settingsPageHTML() : settingsListHTML();
  $$("textarea.grow", root).forEach(autoGrow);
  updateEdge();
}

function autoGrow(el){ el.style.height = "auto"; el.style.height = (el.scrollHeight + 2) + "px"; }
function rerenderSettingsKeepScroll(focusSel, block){
  navFinishNow();
  const y = window.scrollY;
  renderSettings();
  window.scrollTo(0, y);
  if(focusSel){ const f = $(focusSel); if(f){ f.focus({preventScroll: true}); f.scrollIntoView({block: block || "nearest", behavior: "smooth"}); } }
}
function editList(key){ return key === "aff" ? state.edit.affirmations : state.edit.visualization.items; }
function isEditDirty(){ return !!state.edit && JSON.stringify(state.edit) !== state.editSnapshot; }

function beginEdit(){
  const s = state.settings;
  state.edit = state.page === "aff" ? {affirmations: clone(s.affirmations)} : {visualization: clone(s.visualization)};
  state.editSnapshot = JSON.stringify(state.edit);
}
function commitEdit(){
  const e = state.edit;
  function clean(items){
    const out = items.map(function(a){ return {label: a.label.trim(), text: a.text.trim()}; }).filter(function(a){ return a.label || a.text; });
    return out.length ? out : [{label: "", text: ""}];
  }
  if(e.affirmations) state.settings.affirmations = clean(e.affirmations);
  if(e.visualization) state.settings.visualization = {items: clean(e.visualization.items), note: e.visualization.note.trim()};
  state.edit = null;
  flushSave();
}
// Listo on Afirmaciones counts as this month's review, changed or not.
function saveEdit(){
  const aff = !!state.edit.affirmations, due = aff && affReviewDue();
  if(isEditDirty()){ commitEdit(); toast("Cambios guardados"); }
  else if(due) toast("Afirmaciones revisadas");
  if(aff) markAffReviewed();
}
function endEdit(save){
  if(save) saveEdit();
  state.edit = null;
  if(state.from === "today") return backToToday();
  renderSettings();
  window.scrollTo(0, 0);
  fadeIn($("#view-settings .gblock"));
}
// Screens push in from the right and go back the same way.
function openPage(page){
  if(!page) return popScreen();
  navPush($("#view-settings"), function(){ state.page = page; state.edit = null; renderSettings(); },
    {detail: function(){ state.page = page; }, list: function(){ state.page = null; state.edit = null; }});
}
// "Revisar" and "Agregar" in Hoy open the screen already editing; Listo or Cancelar return to the same spot in Hoy.
let todayY = 0;
function openSettingsFromToday(page){
  todayY = window.scrollY;
  state.from = "today";
  state.page = page;
  beginEdit();
  switchTab("settings");
}
function backToToday(){
  state.from = null;
  state.page = null;
  switchTab("today");
  window.scrollTo(0, todayY);
}

(function bindSettings(){
  const root = $("#view-settings");
  root.addEventListener("click", function(ev){
    const go = ev.target.closest("[data-go]");
    if(go) return openPage(go.getAttribute("data-go"));
    const b = ev.target.closest("[data-act]");
    if(!b || b.disabled) return;
    const act = b.getAttribute("data-act");
    if(act === "back") return state.from === "today" ? backToToday() : openPage(null);
    if(act === "edit"){ beginEdit(); renderSettings(); window.scrollTo(0, 0); return fadeIn($("#view-settings .gblock")); }
    if(act === "cancel") return endEdit(false);
    if(act === "done") return endEdit(true);
    if(act === "export") return exportBackup();
    if(act === "import") return $("#import-file").click();
    const key = b.getAttribute("data-list");
    if(!state.edit || !key) return;
    const list = editList(key);
    const i = Number(b.getAttribute("data-i"));
    if(act === "add"){
      list.push({label: "", text: ""});
      rerenderSettingsKeepScroll("#e-" + key + "-t-" + (list.length - 1), "center");
    } else if(act === "del" && list.length > 1){
      list.splice(i, 1);
      rerenderSettingsKeepScroll();
    } else if(act === "up" && i > 0){
      const t = list[i-1]; list[i-1] = list[i]; list[i] = t;
      rerenderSettingsKeepScroll('[data-act="up"][data-list="' + key + '"][data-i="' + (i-1) + '"]');
    } else if(act === "down" && i < list.length - 1){
      const t = list[i+1]; list[i+1] = list[i]; list[i] = t;
      rerenderSettingsKeepScroll('[data-act="down"][data-list="' + key + '"][data-i="' + (i+1) + '"]');
    }
  });
  root.addEventListener("input", function(ev){
    const el = ev.target;
    if(el.id === "s-name"){ state.settings.name = el.value; debounce("save", 400, function(){ store.save(); }); return; }
    if(!state.edit) return;
    if(el.tagName === "TEXTAREA" && el.classList.contains("grow")) autoGrow(el);
    if(el.hasAttribute("data-evnote")) state.edit.visualization.note = el.value;
    else if(el.hasAttribute("data-elist")){
      const item = editList(el.getAttribute("data-elist"))[Number(el.getAttribute("data-i"))];
      if(item) item[el.getAttribute("data-k")] = el.value;
    }
  });
  root.addEventListener("change", function(ev){
    const el = ev.target;
    if(el.id === "s-music"){
      store.set("savers:keepMusic", el.checked);
      if(anyRunning()) setAudioMode(runAudioMode());
      return;
    }
    if(el.id !== "s-name") return;
    el.value = el.value.trim();
    state.settings.name = el.value;
    flushSave();
  });
  root.addEventListener("keydown", function(ev){ if(ev.key === "Enter" && ev.target.id === "s-name") ev.target.blur(); });
})();

/* ---------- tabs ---------- */
function switchTab(tab){
  navFinishNow();
  state.tab = tab;
  $$(".tab").forEach(function(b){ if(b.getAttribute("data-tab") === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  $("#view-today").hidden = tab !== "today";
  $("#view-history").hidden = tab !== "history";
  $("#view-settings").hidden = tab !== "settings";
  if(tab === "today") renderToday();
  if(tab === "history") renderHistory();
  if(tab === "settings") renderSettings();
  window.scrollTo(0, 0);
}
$$(".tab").forEach(function(b){ b.addEventListener("click", async function(){
  const t = b.getAttribute("data-tab");
  if(state.tab === "settings" && state.edit){
    if(t === "settings") return;
    if(isEditDirty()){
      const v = await ask("¿Guardar los cambios?", "Hiciste cambios en " + PAGES[state.page] + ".", [
        {label: "Descartar", value: "discard"},
        {label: "Guardar", value: "save", primary: true},
        {label: "Seguir editando", value: "stay", link: true}
      ]);
      if(v === "stay") return;
      if(v === "save") saveEdit();
    }
    state.edit = null;
  }
  state.from = null;
  // The tab always opens the Ajustes list; tapping it again from a screen goes back to the list.
  if(t === "settings") state.page = null;
  // Like Ajustes, the tab always opens its month view.
  if(t === "history"){ state.histDay = null; const d = new Date(); if(state.tab !== "history"){ state.month = {y:d.getFullYear(), m:d.getMonth()}; } }
  switchTab(t);
}); });

/* ---------- date rollover and returning to the app ---------- */
function checkRollover(){
  const t = todayStr();
  if(t === state.today) return;
  state.today = t;
  state.showSunday = false;
  const a = document.activeElement;
  if(a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT")) return;
  if(anyRunning() || state.tab === "settings") return;
  switchTab(state.tab);
}
setInterval(checkRollover, 30000);
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "hidden"){ flushSave(); return; }
  checkRollover();
  syncReading();
  if(anyRunning()){
    try { if(audio.ctx && audio.ctx.state !== "running") audio.ctx.resume(); } catch(e){}
    requestWake();
    tickRuns();
  }
});

/* ---------- boot ---------- */
store.load();
restoreRuns();
syncReading();
switchTab("today");

if("serviceWorker" in navigator && location.protocol === "https:"){
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
})();
</script>
