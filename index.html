<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAVERS</title>
<meta name="description" content="Rutina matutina SAVERS">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SAVERS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EDF0F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#10151F" media="(prefers-color-scheme: dark)">
<meta name="format-detection" content="telephone=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --surface-2:#E2E7EF; --ink:#1A2233; --muted:#586277;
  --line:#D2D9E4; --dawn:#E39B2D; --dawn-ink:#2E1C00; --dawn-soft:#FBE8C9; --sky:#3F5F96; --ok:#2F7D5B; --warn:#A8471F;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Helvetica Neue", Arial, system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10151F; --surface:#182031; --surface-2:#232D43; --ink:#E7EBF3; --muted:#9BA6BB;
    --line:#2D3952; --dawn:#F0B24E; --dawn-ink:#231400; --dawn-soft:#3B2F1B; --sky:#94B3EA; --ok:#5DC093; --warn:#F08A5D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151F; --surface:#182031; --surface-2:#232D43; --ink:#E7EBF3; --muted:#9BA6BB;
  --line:#2D3952; --dawn:#F0B24E; --dawn-ink:#231400; --dawn-soft:#3B2F1B; --sky:#94B3EA; --ok:#5DC093; --warn:#F08A5D;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
html,body{overflow-x:clip;max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
img{max-width:100%}
button,input,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;-webkit-appearance:none;appearance:none}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:6px}
.wrap{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(96px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}

/* top */
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.top-l{min-width:0}
.hello{font-family:var(--display);font-weight:700;font-size:.92rem;color:var(--muted);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.date{font-family:var(--display);font-weight:800;font-size:1.4rem;line-height:1.15;margin:0;letter-spacing:-0.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:.8rem;color:var(--warn)}
.chip{flex:0 0 auto;display:inline-block;padding:3px 10px;border-radius:999px;background:var(--surface-2);font-size:.8rem;font-weight:700;white-space:nowrap}
.chip.gym{background:var(--dawn-soft)}

.banner{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:var(--surface-2);display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:.92rem}
.linkbtn{background:none;border:0;color:var(--sky);font-weight:700;cursor:pointer;padding:6px 0;white-space:nowrap}

/* timeline */
.timeline{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin:12px 0 0}
.tl{border-top:3px solid var(--line);padding-top:5px}
.tl.on{border-color:var(--dawn)}
.tl b{display:block;font-family:var(--display);font-size:.98rem;line-height:1.2}
.tl span{display:block;font-size:.74rem;color:var(--muted);line-height:1.2}

/* hero letters */
.hero{margin:16px 0 4px}
.letters{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.lt{position:relative;display:block;width:100%;min-width:0;height:0;padding:0 0 calc(115% - 4px);align-self:start;border-radius:14px;border:2px solid var(--line);background:var(--surface);cursor:pointer;
  font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,8vw,2.8rem);
  color:var(--muted);transition:background .25s ease,color .25s ease,border-color .25s ease,transform .12s ease}
.lt span{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center}
.lt:active{transform:scale(.96)}
.lt.done{background:var(--dawn);border-color:var(--dawn);color:var(--dawn-ink)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.14)}65%{transform:scale(.97)}100%{transform:scale(1)}}
.bump{animation:bump .34s cubic-bezier(.3,.7,.4,1.4)}
.progress{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:.9rem;color:var(--muted)}
.progress strong{color:var(--ink)}
.bar{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--dawn);width:0;transition:width .3s ease}

/* cards */
.list{margin-top:14px;display:flex;flex-direction:column;gap:8px}
details.card{background:var(--surface);border-radius:16px;border:1px solid var(--line)}
details.card>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:10px 12px;cursor:pointer}
details.card>summary::-webkit-details-marker{display:none}
.chk{flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:transparent;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:1.05rem;color:var(--muted);padding:0}
.chk.done{background:var(--dawn);border-color:var(--dawn);color:var(--dawn-ink)}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font-size:1rem}
.ttl span{display:block;font-size:.84rem;color:var(--muted)}
.time{font-size:.84rem;font-weight:700;color:var(--muted);white-space:nowrap}
.caret{flex:0 0 auto;width:10px;height:10px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin:0 4px 4px 2px;transition:transform .2s}
details[open]>summary .caret,.entry.open .caret{transform:rotate(-135deg);margin-bottom:-2px}
.body{padding:0 14px 14px 64px}
details.card.done>summary .ttl,details.card.done>summary .time{opacity:.5}
details.card.done{background:transparent}

/* finished morning */
.finish{margin-top:16px;padding:22px 18px 18px;border-radius:18px;background:var(--dawn-soft);text-align:center}
.finish .big{width:64px;height:64px;margin:0 auto 10px;border-radius:50%;background:var(--dawn);color:var(--dawn-ink);display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:800}
.finish h2{font-family:var(--display);font-weight:800;font-size:1.6rem;margin:0}
.finish p{margin:4px 0 0;color:var(--muted);font-size:.92rem}
.finish p strong{color:var(--ink)}
.after{margin-top:12px;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
details.more{margin-top:12px}
details.more>summary{list-style:none;display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;color:var(--sky);font-weight:700;cursor:pointer}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary .caret{border-color:var(--sky)}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.fade-in{animation:fadeUp .45s ease both}
.body p{margin:0 0 8px}
.body ol,.body ul{margin:0 0 8px;padding-left:20px}
.body li{margin-bottom:6px}
.note{font-size:.88rem;color:var(--muted)}
.affs p{margin:0 0 16px;line-height:1.6}
.affs p:last-child{margin-bottom:10px}

/* timer */
.timer{margin:4px 0 12px;padding:14px;border-radius:14px;background:var(--surface-2)}
.tm-now{font-family:var(--display);font-weight:700;font-size:1.15rem}
.tm-next{font-size:.85rem;color:var(--muted);min-height:1.2em}
.tm-clock{font-family:var(--display);font-weight:800;font-size:2.8rem;line-height:1;margin:8px 0 6px;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer;background:var(--surface);border:1px solid var(--line)}
.btn.primary{background:var(--dawn);border-color:var(--dawn);color:var(--dawn-ink)}
.timer[data-run="visualizacion"] [data-r="next"]{font-size:1.02rem;line-height:1.45;color:var(--ink);min-height:2.9em;margin-top:2px}
.mix{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);cursor:pointer}
.mix b{display:block;font-size:.92rem}
.mix small{display:block;font-size:.8rem;color:var(--muted);line-height:1.3}
.mix input{flex:0 0 auto;accent-color:var(--ok);margin:0}
.howto{margin-top:10px;font-size:.92rem}
.howto summary{color:var(--sky);font-weight:700;cursor:pointer;min-height:44px;display:flex;align-items:center}
.howto ol{margin:4px 0 6px}
/* letter toggles: a label around a hidden native switch (the real tap on it is what vibrates) */
label.lt,label.chk{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input.tg{display:none}

/* fields */
label.f{display:block;font-weight:700;font-size:.92rem;margin:12px 0 4px}
label.f:first-child{margin-top:0}
label.f small{font-weight:400;color:var(--muted)}
textarea,input[type=text],input[type=number]{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;font-size:16px}
textarea{resize:vertical;min-height:64px}
textarea.grow{resize:none;overflow:hidden;min-height:0;line-height:1.5}
/* writing: a saved field reads as text; tap it to edit */
.wf{margin-bottom:4px}
.wf label.f{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.saved{display:none;font-size:.76rem;font-weight:700;color:var(--ok);white-space:nowrap}
.wf.has:not(:has(textarea:focus)) .saved{display:inline}
.wf.has:not(:has(textarea:focus)) label.f small{display:none}
.save-failed .saved{display:none}
textarea.wt{display:block;transition:background .2s ease,border-color .2s ease,padding .2s ease}
.has>textarea.wt:not(:focus),.prio.has textarea.wt:not(:focus){background:transparent;border-color:transparent;padding-left:0;padding-right:0}
.prio{display:flex;align-items:flex-start;gap:8px;margin-bottom:6px}
.prio input[type=checkbox]{width:22px;height:22px;accent-color:var(--dawn);flex:0 0 auto;margin:11px 0 0}
.prio textarea.wt{flex:1;min-width:0}
.prio.done textarea.wt{text-decoration:line-through;color:var(--muted)}
.body.wide{padding-left:14px}

.rest{margin-top:18px;padding:22px 18px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.rest h2{font-family:var(--display);font-weight:800;font-size:1.6rem;margin:0 0 6px}
.rest p{margin:0 0 12px;color:var(--muted)}

/* history */
h2.sec{font-family:var(--display);font-weight:800;font-size:1.5rem;margin:6px 0 12px}
h3.sub{font-family:var(--display);font-weight:700;font-size:1.15rem;margin:24px 0 8px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat b{display:block;font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1}
.stat span{font-size:.78rem;color:var(--muted);line-height:1.25;display:block;margin-top:4px}
.monthnav{display:flex;justify-content:space-between;align-items:center;margin:20px 0 8px}
.monthnav h3{margin:0;font-family:var(--display);font-weight:700;font-size:1.15rem;text-transform:capitalize}
.navbtn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:1.1rem}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:start}
.dow{font-size:.75rem;color:var(--muted);text-align:center}
.cell{position:relative;display:block;width:100%;min-width:0;height:0;padding:0 0 100%;margin:0;align-self:start;border-radius:50%;border:0;cursor:pointer;
  background:conic-gradient(var(--dawn) calc(var(--p,0) * 1turn), var(--surface-2) 0)}
.cell span{position:absolute;top:3px;left:3px;right:3px;bottom:3px;display:flex;border-radius:50%;background:var(--surface);align-items:center;justify-content:center;font-size:.85rem;font-weight:700}
.cell.full span{background:var(--dawn);color:var(--dawn-ink)}
.cell.off{background:transparent;cursor:default}
.cell.off span{background:transparent;color:var(--muted);font-weight:400}
.cell.future{opacity:.4;cursor:default}
.cell.today span{box-shadow:inset 0 0 0 2px var(--sky)}
.cell.blank{visibility:hidden}
.legend{font-size:.8rem;color:var(--muted);margin-top:8px}
.entries{display:flex;flex-direction:column;gap:8px}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.entry-h{display:block;text-align:left;background:none;border:0;padding:10px 12px;cursor:pointer;width:100%;min-height:44px}
.entry-h b{display:flex;align-items:center;gap:8px;font-size:.95rem;text-transform:capitalize}
.entry-h b span:first-child{flex:1}
.entry-h b em{font-style:normal;color:var(--muted);font-weight:400;text-transform:none}
.entry.open .entry-h p{display:none}
.entry-b{padding:0 12px 10px}
.entry-b .wf{margin-top:4px}
.entry-b .none{margin:0 0 6px;color:var(--muted);font-size:.92rem}
.entry-b .linkbtn{display:block;margin-left:auto;min-height:44px}
.entry-h p{margin:4px 0 0;font-size:.88rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.empty{padding:16px;border-radius:14px;background:var(--surface);border:1px dashed var(--line);color:var(--muted);font-size:.92rem}

/* guide */
.gtop{position:sticky;top:0;z-index:4;background:var(--bg);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:0 -16px 6px;padding:4px 16px 8px}
.gtop h2{grid-column:1;margin:0;font-family:var(--display);font-weight:800;font-size:1.5rem;white-space:nowrap}
.gtop.editing h2{grid-column:2;font-size:1.05rem;font-weight:700}
.tbtn{background:none;border:0;color:var(--sky);font-weight:700;font-size:1rem;min-height:44px;padding:0 4px;cursor:pointer}
.tbtn.left{justify-self:start;font-weight:400}
.tbtn.right{justify-self:end;grid-column:3}
.gblock{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.gblock h3{font-family:var(--display);font-weight:700;font-size:1.12rem;margin:0 0 8px}
.gblock p{margin:0 0 8px}
.gblock .lead{margin-bottom:12px}
.gitem{padding:12px 0;border-top:1px solid var(--line)}
.gitem:first-of-type{border-top:0;padding-top:4px}
.glabel{display:block;font-size:.8rem;font-weight:700;color:var(--muted);letter-spacing:.01em;margin-bottom:2px}
.gitem p{margin:0;font-size:1.02rem;line-height:1.6}
.tablewrap{overflow-x:auto}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--surface-2);border-radius:12px;padding:3px;margin:2px 0 16px}
.seg button{border:0;background:transparent;border-radius:9px;padding:7px 6px;min-height:48px;cursor:pointer;color:var(--muted);line-height:1.2;transition:background .2s ease,color .2s ease}
.seg button b{display:block;font-size:.95rem}
.seg button small{display:block;font-size:.74rem;font-weight:400}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.tgroup{font-size:.78rem;font-weight:700;color:var(--muted);margin:0 0 6px}
.tlist{list-style:none;margin:0;padding:0}
.tlist + .tgroup,.tlist + .tlist{margin-top:16px}
.tstep{display:grid;grid-template-columns:74px 14px minmax(0,1fr);column-gap:10px;align-items:start}
.tstep .tt{font-family:var(--display);font-weight:700;font-size:1rem;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;line-height:1.5}
.tstep .rail{position:relative;align-self:stretch}
.tstep .rail::before{content:"";position:absolute;left:6px;top:15px;bottom:-4px;width:2px;background:var(--line)}
.tstep:last-child .rail::before{display:none}
.tstep .rail::after{content:"";position:absolute;left:1px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:2px solid var(--muted);box-sizing:border-box}
.tstep.key .rail::after{background:var(--dawn);border-color:var(--dawn)}
.tstep .tx{padding-bottom:14px;line-height:1.5}
.tstep:last-child .tx{padding-bottom:0}
.tstep .tx span{display:block;color:var(--muted);font-size:.86rem;line-height:1.35;margin-top:1px}
.tlist.muted .tt,.tlist.muted .tx{color:var(--muted)}
.tlist.muted .tx{font-weight:400}
.snote{margin:16px 0 0;padding-top:12px;border-top:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:700;color:var(--muted)}
.eitem{padding:12px 0;border-top:1px solid var(--line)}
.eitem:first-of-type{border-top:0;padding-top:2px}
.eitem input{font-weight:700;margin-bottom:6px}
.ectl{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.ibtn{min-width:44px;height:40px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:1rem;font-weight:700;cursor:pointer;color:var(--ink)}
.ibtn.del{color:var(--warn)}
.ibtn:disabled{opacity:.35;cursor:default}
.addbtn{width:100%;margin-top:6px;padding:12px;border:1px dashed var(--line);border-radius:12px;background:transparent;color:var(--sky);font-weight:700;cursor:pointer}
.remind{font-size:.85rem;color:var(--muted);text-align:center;margin:18px 0 4px}
.remind .linkbtn{padding:6px 2px}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(10,14,22,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet{width:100%;max-width:420px;background:var(--surface);border-radius:18px;padding:18px 16px 12px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.sheet h3{font-family:var(--display);font-weight:700;font-size:1.15rem;margin:0 0 4px}
.sheet p{margin:0 0 14px;color:var(--muted);font-size:.92rem}
.sheet .row{margin-top:0}
.sheet .row .btn{flex:1}
.sheet .linkbtn{display:block;width:100%;text-align:center;margin-top:6px;min-height:44px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px calc(8px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));z-index:5}
.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tab{border:0;background:transparent;padding:11px 4px;border-radius:12px;font-weight:700;color:var(--muted);cursor:pointer}
.tab[aria-current="page"]{background:var(--dawn-soft);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;z-index:6}
.toast.show{opacity:1}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){*{transition:none!important}.bump,.fade-in{animation:none}}
</style>
</head>
<body>
<main class="wrap">
  <section id="view-today"></section>
  <section id="view-history" hidden></section>
  <section id="view-guide" hidden></section>
</main>
<nav class="tabs" aria-label="Secciones"><div>
  <button class="tab" data-tab="today" aria-current="page">Hoy</button>
  <button class="tab" data-tab="history">Historial</button>
  <button class="tab" data-tab="guide">Mi guía</button>
</div></nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="import-file" class="sr-only" tabindex="-1" aria-hidden="true">

<script>
(function(){
"use strict";

/* ---------- constants ---------- */
const LETTERS = [
  {key:"silencio", L:"S", name:"Silencio"},
  {key:"afirmaciones", L:"A", name:"Afirmaciones"},
  {key:"visualizacion", L:"V", name:"Visualización"},
  {key:"ejercicio", L:"E", name:"Ejercicio"},
  {key:"lectura", L:"R", name:"Lectura"},
  {key:"escritura", L:"S", name:"Escritura"}
];
// Personal data (name, affirmations, schedule) is never in this file: it comes from the imported backup.
const DEFAULT_VIS = {
  items: [
    {label: "Mi día", text: "¿Cómo me veo haciendo bien lo más importante de hoy?"},
    {label: "Mi obstáculo", text: "¿Qué es lo que más probablemente me saque del camino hoy?"},
    {label: "Mi plan", text: "Si pasa eso, ¿qué hago?"}
  ],
  note: "Un minuto por pregunta, con los ojos cerrados. Si la mente se queda en blanco, respóndelas en voz baja."
};
const DEFAULT_SETTINGS = {
  name: "",
  affirmations: [{label: "", text: ""}],
  visualization: DEFAULT_VIS,
  schedule: null
};
const SECS_PER_AFFIRMATION = 25;
const BACKUP_REMIND_DAYS = 30;
const CIRCUIT = [
  ["Bird dog", "En cuatro apoyos, estira un brazo y la pierna contraria. Sostén 2–3 segundos y cambia. La pierna no sube más alto que la cadera."],
  ["Dead bug", "Boca arriba, brazos al techo y rodillas dobladas. Baja despacio un brazo y la pierna contraria con la espalda baja pegada al piso."],
  ["Puente de glúteos", "Boca arriba, rodillas dobladas. Sube la cadera apretando glúteos hasta quedar en línea recta, sin arquear."],
  ["Sentadilla a silla", "Baja hasta tocar la silla y sube, pecho arriba y abdomen firme."]
];
function buildSteps(){
  const s = [{name:"Marchar en el sitio", secs:60}];
  for(let r=1;r<=2;r++){
    CIRCUIT.forEach(function(c, i){
      s.push({name:c[0] + " (ronda " + r + ")", ex:c[0], round:r, secs:40});
      if(!(r===2 && i===CIRCUIT.length-1)) s.push({name:"Cambio", secs:5, rest:true});
    });
  }
  s.push({name:"Respiraciones con piernas en la silla", secs:65});
  return s;
}
const STEPS = buildSteps();

/* ---------- helpers ---------- */
const $ = function(sel, root){ return (root||document).querySelector(sel); };
const $$ = function(sel, root){ return Array.from((root||document).querySelectorAll(sel)); };
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function pad(n){ return String(n).padStart(2,"0"); }
function fmt(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
function parse(ds){ const p = ds.split("-").map(Number); return new Date(p[0], p[1]-1, p[2]); }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function todayStr(){ return fmt(new Date()); }
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
function longDate(ds){ return cap(parse(ds).toLocaleDateString("es", {weekday:"long", day:"numeric", month:"long"})); }
function headDate(ds){ return cap(parse(ds).toLocaleDateString("es", {weekday:"long", day:"numeric", month:"short"})).replace(",", "").replace(/\.$/, ""); }
function shortDate(ds){ return parse(ds).toLocaleDateString("es", {weekday:"short", day:"numeric", month:"short"}); }
function dayType(ds){
  const w = parse(ds).getDay();
  if(w===1 || w===2 || w===4) return "normal";
  if(w===3 || w===5) return "gym";
  if(w===0) return "domingo";
  return "shabbat";
}
function isScheduled(ds){ const t = dayType(ds); return t==="normal" || t==="gym"; }
function blankDay(ds){ return {date:ds, checks:{}, gratitude:"", priorities:["","",""], prioDone:[false,false,false], bookIdea:"", notes:"", extra:false}; }
function countDone(d){ return d ? LETTERS.filter(function(l){ return d.checks && d.checks[l.key]; }).length : 0; }
function isComplete(ds){ return countDone(state.days[ds]) === 6; }
function hasContent(d){ return d && (countDone(d) > 0 || d.gratitude || d.bookIdea || d.notes || (d.priorities||[]).some(Boolean)); }
function filled(items){ return items.filter(function(a){ return a.text.trim(); }); }
function hasPersonalData(){ const s = state.settings; return !!(s.name || s.schedule || filled(s.affirmations).length); }

let toastT;
function toast(msg){ const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove("show"); }, 2600); }

/* ---------- state ---------- */
const state = {
  tab: "today",
  viewDate: todayStr(),
  today: todayStr(),
  days: {},
  settings: clone(DEFAULT_SETTINGS),
  month: (function(){ const d = new Date(); return {y:d.getFullYear(), m:d.getMonth()}; })(),
  showSunday: false,
  lastExport: null,
  since: null,
  schedTab: null,    // Normal | Gym selector in Mi guía; null = today's type
  edit: null,        // draft while Mi guía is in edit mode
  editSnapshot: ""
};

function normItems(list){
  if(!Array.isArray(list)) return null;
  return list.map(function(a){
    if(typeof a === "string") return {label: "", text: a};
    if(a && typeof a === "object") return {label: String(a.label || ""), text: String(a.text || "")};
    return null;
  }).filter(Boolean);
}
function normalizeSettings(s){
  const out = clone(DEFAULT_SETTINGS);
  if(!s || typeof s !== "object") return out;
  if(typeof s.name === "string") out.name = s.name;
  const aff = normItems(s.affirmations);
  if(aff && aff.length) out.affirmations = aff;
  if(s.visualization && typeof s.visualization === "object"){
    const items = normItems(s.visualization.items);
    out.visualization = {
      items: items && items.length ? items : clone(DEFAULT_VIS.items),
      note: typeof s.visualization.note === "string" ? s.visualization.note : DEFAULT_VIS.note
    };
  }
  if(s.schedule && typeof s.schedule === "object") out.schedule = s.schedule;
  return out;
}

/* ---------- storage (on this iPhone) ---------- */
const store = {
  get: function(k){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch(e){ return null; } },
  set: function(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } },
  load: function(){
    const d = this.get("savers:days"); if(d && typeof d === "object") state.days = d;
    const raw = this.get("savers:settings");
    state.settings = normalizeSettings(raw);
    // Migrate older formats (e.g. drop the book) right away.
    if(raw && JSON.stringify(raw) !== JSON.stringify(state.settings)) this.set("savers:settings", state.settings);
    state.lastExport = this.get("savers:lastExport");
    state.since = this.get("savers:since");
    if(!state.since){ state.since = new Date().toISOString(); this.set("savers:since", state.since); }
  },
  save: function(){
    const ok = this.set("savers:days", state.days) && this.set("savers:settings", state.settings);
    setStatus(ok ? "" : "No se pudo guardar");
    if(!ok) toast("No se pudo guardar en el iPhone. Exporta una copia.");
  }
};
// Ask iOS to not evict this app's storage.
try { if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(e){}

const debouncers = {};
function debounce(key, ms, fn){ clearTimeout(debouncers[key]); debouncers[key] = setTimeout(fn, ms); }
function saveDay(ds, delay){
  const d = state.days[ds];
  if(d) d.updatedAt = new Date().toISOString();
  debounce("save", delay == null ? 400 : delay, function(){ store.save(); });
}
// Never lose the last keystrokes when iOS suspends the app.
function flushSave(){ Object.keys(debouncers).forEach(function(k){ clearTimeout(debouncers[k]); }); store.save(); }
window.addEventListener("pagehide", flushSave);

let statusMsg = "";
function setStatus(msg){
  statusMsg = msg || "";
  document.body.classList.toggle("save-failed", !!statusMsg);
  const el = $("#status"); if(el) el.textContent = statusMsg;
}

function getDay(ds, create){
  if(!state.days[ds] && create) state.days[ds] = blankDay(ds);
  return state.days[ds];
}

/* ---------- sheet (Guardar / Descartar) ---------- */
function ask(title, text, buttons){
  return new Promise(function(resolve){
    const bd = document.createElement("div");
    bd.className = "backdrop";
    bd.innerHTML = '<div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-t">' +
      '<h3 id="sheet-t">' + esc(title) + '</h3>' + (text ? '<p>' + esc(text) + '</p>' : '') +
      '<div class="row">' + buttons.filter(function(b){ return !b.link; }).map(function(b){
        return '<button class="btn' + (b.primary ? " primary" : "") + '" data-v="' + b.value + '">' + esc(b.label) + '</button>';
      }).join("") + '</div>' +
      buttons.filter(function(b){ return b.link; }).map(function(b){
        return '<button class="linkbtn" data-v="' + b.value + '">' + esc(b.label) + '</button>';
      }).join("") +
    '</div>';
    function close(v){ bd.remove(); resolve(v); }
    bd.addEventListener("click", function(e){
      const b = e.target.closest("[data-v]");
      if(b) close(b.getAttribute("data-v"));
      else if(e.target === bd) close("stay");
    });
    document.body.appendChild(bd);
    const primary = $(".btn.primary", bd); if(primary) primary.focus();
  });
}

/* ---------- backup ---------- */
function exportBackup(){
  flushSave();
  const payload = {app: "savers", version: 2, exportedAt: new Date().toISOString(), settings: state.settings, days: state.days};
  const json = JSON.stringify(payload, null, 2);
  const name = "savers-copia-" + todayStr() + ".json";
  function markDone(){
    state.lastExport = new Date().toISOString();
    store.set("savers:lastExport", state.lastExport);
    if(state.tab === "guide") rerenderGuideKeepScroll();
  }
  let file = null;
  try { file = new File([json], name, {type: "application/json"}); } catch(e){}
  if(file && navigator.canShare && navigator.canShare({files: [file]})){
    navigator.share({files: [file], title: "Copia de SAVERS"})
      .then(function(){ markDone(); toast("Copia exportada"); })
      .catch(function(e){ if(e && e.name !== "AbortError") downloadFallback(); });
    return;
  }
  downloadFallback();
  function downloadFallback(){
    const url = URL.createObjectURL(new Blob([json], {type: "application/json"}));
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    markDone(); toast("Copia descargada");
  }
}

function importBackupText(text){
  let data;
  try { data = JSON.parse(text); } catch(e){ toast("Ese archivo no es una copia de SAVERS"); return; }
  if(!data || data.app !== "savers" || typeof data.settings !== "object"){ toast("Ese archivo no es una copia de SAVERS"); return; }
  const incomingDays = data.days && typeof data.days === "object" ? data.days : {};
  const n = Object.keys(incomingDays).length;
  // Replace only the parts the file brings, so a schedule-only file never touches affirmations.
  const PARTS = [["name", "tu nombre"], ["affirmations", "tus afirmaciones"], ["visualization", "tu visualización"], ["schedule", "tu horario"]];
  const parts = PARTS.filter(function(p){ return Object.prototype.hasOwnProperty.call(data.settings, p[0]); });
  if(!parts.length && !n){ toast("Esa copia no trae nada para importar"); return; }
  const names = parts.map(function(p){ return p[1]; });
  const list = names.length > 1 ? names.slice(0, -1).join(", ") + " y " + names[names.length - 1] : names[0];
  const msg = "¿Importar este archivo?\n\n" +
    (parts.length ? "Se reemplaza solo " + list + "." : "No cambia tu guía.") +
    (n ? "\nSe agregan " + n + " día(s) de registro; si un día ya existe, se queda el más reciente." : "");
  if(!confirm(msg)) return;
  const incoming = normalizeSettings(data.settings);
  parts.forEach(function(p){ state.settings[p[0]] = incoming[p[0]]; });
  Object.keys(incomingDays).forEach(function(ds){
    const inc = incomingDays[ds], cur = state.days[ds];
    if(!/^\d{4}-\d{2}-\d{2}$/.test(ds) || !inc || typeof inc !== "object") return;
    if(!cur || !hasContent(cur) || String(inc.updatedAt || "") >= String(cur.updatedAt || "")) state.days[ds] = Object.assign(blankDay(ds), inc);
  });
  state.edit = null;
  flushSave();
  toast(parts.length === 1 && parts[0][0] === "schedule" ? "Horario importado" : "Copia importada");
  switchTab(state.tab);
}

$("#import-file").addEventListener("change", function(e){
  const f = e.target.files && e.target.files[0];
  e.target.value = "";
  if(!f) return;
  const r = new FileReader();
  r.onload = function(){ importBackupText(String(r.result || "")); };
  r.onerror = function(){ toast("No se pudo leer el archivo"); };
  r.readAsText(f);
});

/* ---------- feel: sound, voice, bounce ---------- */
// Haptics: iOS only vibrates when a finger really toggles a native switch, so every letter wraps a hidden
// <input type="checkbox" switch> (see letterToggleHTML). Programmatic clicks don't vibrate.
const audio = {ctx: null};
// "Mantener mi música": ambient mixes with 24six but follows the silent switch; playback ignores it but pauses other apps.
function keepMusic(){ const v = store.get("savers:keepMusic"); return v == null ? true : !!v; }
function setAudioMode(mode){
  try { if(navigator.audioSession && navigator.audioSession.type !== mode) navigator.audioSession.type = mode; } catch(e){}
}
function runAudioMode(){ return keepMusic() ? "ambient" : "playback"; }
function ensureAudio(){
  try {
    if(!audio.ctx) audio.ctx = new (window.AudioContext || window.webkitAudioContext)();
    if(audio.ctx.state !== "running") audio.ctx.resume();
    const b = audio.ctx.createBuffer(1, 1, 22050), src = audio.ctx.createBufferSource();
    src.buffer = b; src.connect(audio.ctx.destination); src.start(0);
  } catch(e){}
}
function tone(freqFrom, freqTo, dur, peak, delay){
  try {
    const ctx = audio.ctx; if(!ctx) return;
    if(ctx.state !== "running") ctx.resume();
    const o = ctx.createOscillator(), g = ctx.createGain();
    const t0 = ctx.currentTime + (delay || 0);
    o.type = "sine";
    o.frequency.setValueAtTime(freqFrom, t0);
    if(freqTo !== freqFrom) o.frequency.exponentialRampToValueAtTime(freqTo, t0 + dur * 0.8);
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(peak, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.start(t0); o.stop(t0 + dur + 0.02);
  } catch(e){}
}
function feedbackAudio(){
  if(!anyRunning()) setAudioMode("ambient");
  ensureAudio();
}
// "Check doble": two quick notes up.
function popSound(){
  feedbackAudio();
  tone(988, 988, 0.1, 0.12);
  tone(1319, 1319, 0.14, 0.12, 0.07);
}
// "Arpegio en mi": walks through the same notes as the check and lands higher.
function completeSound(){
  feedbackAudio();
  [659, 831, 988, 1319].forEach(function(f, i){ tone(f, f, 0.14, 0.12, i * 0.085); });
  tone(1661, 1661, 0.2, 0.1, 0.34);
  tone(1976, 1976, 0.75, 0.12, 0.42);
  tone(3952, 3952, 0.25, 0.014, 0.42);
}
function bell(){ tone(1175, 1175, 1.1, 0.1); tone(3243, 3243, 0.3, 0.03); }
function softTone(){ tone(660, 660, 0.35, 0.05); }

// Spoken cues use the iPhone's own Spanish voice. They only play while SAVERS is on screen.
let voiceCache = null;
function spanishVoice(){
  if(voiceCache) return voiceCache;
  try {
    const vs = speechSynthesis.getVoices().filter(function(v){ return /^es([-_]|$)/i.test(v.lang); });
    if(!vs.length) return null;
    const rank = function(v){
      return (/premium|enhanced|mejorada/i.test(v.name + " " + v.voiceURI) ? 0 : 10) +
        (/^es[-_]MX/i.test(v.lang) ? 0 : /^es[-_](US|419)/i.test(v.lang) ? 1 : /^es[-_]ES/i.test(v.lang) ? 3 : 2);
    };
    voiceCache = vs.sort(function(a, b){ return rank(a) - rank(b); })[0];
  } catch(e){ return null; }
  return voiceCache;
}
try { if(window.speechSynthesis) speechSynthesis.addEventListener("voiceschanged", function(){ voiceCache = null; }); } catch(e){}
function say(text){
  try {
    if(!window.speechSynthesis || !text) return;
    const u = new SpeechSynthesisUtterance(text);
    const v = spanishVoice();
    if(v){ u.voice = v; u.lang = v.lang; } else u.lang = "es-MX";
    u.rate = 0.92;
    if(speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
    speechSynthesis.speak(u);
  } catch(e){}
}
// iOS only lets a page speak later if it spoke once during a tap.
function unlockSpeech(){
  try {
    if(!window.speechSynthesis || unlockSpeech.done) return;
    const u = new SpeechSynthesisUtterance(" ");
    u.volume = 0;
    speechSynthesis.speak(u);
    unlockSpeech.done = true;
  } catch(e){}
}
function bump(key){
  $$('[data-toggle="' + key + '"]').forEach(function(b){
    b.classList.remove("bump");
    void b.offsetWidth;
    b.classList.add("bump");
  });
}
document.addEventListener("animationend", function(e){ if(e.target.classList) e.target.classList.remove("bump"); });

/* ---------- streak ---------- */
function streak(){
  let n = 0;
  let d = new Date();
  if(isScheduled(fmt(d)) && !isComplete(fmt(d))) d = addDays(d, -1);
  for(let i=0; i<800; i++){
    const ds = fmt(d);
    if(isScheduled(ds)){
      if(isComplete(ds)) n++; else break;
    }
    d = addDays(d, -1);
  }
  return n;
}

/* ---------- today view ---------- */
function timelineHTML(type){
  const sc = state.settings.schedule;
  let items = null;
  const t = scheduleType(type);
  if(t) items = (t.steps || []).filter(function(st){ return st.short; }).map(function(st){ return [st.time, st.short]; });
  else if(sc && Array.isArray(type === "gym" ? sc.timelineGym : sc.timelineNormal)) items = type === "gym" ? sc.timelineGym : sc.timelineNormal;
  if(!items || !items.length) return "";
  return '<div class="timeline" style="grid-template-columns:repeat(' + items.length + ',minmax(0,1fr))">' + items.map(function(it){
    return '<div class="tl' + (/savers/i.test(it[1]) ? " on" : "") + '"><b>' + esc(it[0]) + '</b><span>' + esc(it[1]) + '</span></div>';
  }).join("") + '</div>';
}

function letterInfo(key, type){
  const gym = type === "gym";
  const s = state.settings;
  const sc = s.schedule || {};
  switch(key){
    case "silencio": return {
      sub: "Daily Calm", time: "10 min",
      html: '<p>Abre Calm y haz el Daily Calm.</p>' +
        (gym ? '<p class="note">Hoy va después del gym.</p>' : '')
    };
    case "afirmaciones": {
      const list = filled(s.affirmations);
      const mins = Math.max(1, Math.ceil(list.length * SECS_PER_AFFIRMATION / 60));
      return {
        sub: gym ? "Con tu café, antes del gym" : "En voz alta", time: mins + " min",
        html: list.length
          ? '<div class="affs">' + list.map(function(a){ return '<p>' + esc(a.text) + '</p>'; }).join("") + '</div>' +
            '<p class="note">Despacio, sintiendo cada frase.</p>'
          : '<p>Todavía no tienes afirmaciones. Agrégalas en Mi guía.</p>'
      };
    }
    case "visualizacion": {
      const vis = s.visualization;
      const list = filled(vis.items);
      return {
        sub: "Ojos cerrados, guiada", time: Math.max(1, list.length) + " min",
        html: (list.length ? runBoxHTML("visualizacion") : '') + '<ol>' + list.map(function(v){ return '<li>' + (v.label.trim() ? '<b>' + esc(v.label) + ':</b> ' : '') + esc(v.text) + '</li>'; }).join("") + '</ol>' +
          (vis.note.trim() ? '<p class="note">' + esc(vis.note) + '</p>' : '')
      };
    }
    case "ejercicio":
      if(gym) return {
        sub: "Gym con tu entrenador", time: sc.gymTime || "Gym",
        html: '<p>Hoy el ejercicio es tu clase. Márcala cuando termines.</p>'
      };
      return {
        sub: "Rutina en casa", time: "8 min",
        html:
          runBoxHTML("ejercicio") +
          '<ol><li><b>Minuto 0–1:</b> marchar en el sitio subiendo rodillas.</li>' +
          '<li><b>Minuto 1–7:</b> 2 rondas de 40 segundos por ejercicio:<ul>' +
          CIRCUIT.map(function(c){ return '<li><b>' + c[0] + ':</b> ' + c[1] + '</li>'; }).join("") +
          '</ul></li><li><b>Minuto 7–8:</b> boca arriba con las piernas sobre una silla, respiraciones lentas.</li></ol>' +
          '<p class="note">Para si hay hormigueo o dolor que baja por la pierna.</p>'
      };
    case "lectura":
      if(gym) return {
        sub: "Más tarde", time: READ_MIN + " min",
        html: '<p>Hoy lees más tarde' + (sc.gymReading ? ": " + esc(sc.gymReading) : "") + '. Empieza desde aquí y se marca sola.</p>' + readingHTML() + shortcutHelpHTML()
      };
      return {
        sub: "Con tu café", time: READ_MIN + " min",
        html: readingHTML() + '<p>' + READ_MIN + ' minutos con tu café. La meta es el tiempo, no las páginas.</p>' + shortcutHelpHTML()
      };
    case "escritura": return {
      sub: "Agradezco y prioridades", time: "3 min",
      html: ""
    };
  }
}

/* ---------- writing: one component for Hoy and Historial ---------- */
const W_FIELDS = [
  {k:"gratitude", label:"Agradezco", hint:"algo concreto de ayer y por qué"},
  {k:"bookIdea", label:"Del libro", hint:"una idea, si leíste"},
  {k:"notes", label:"Notas", hint:"opcional"}
];
const SAVED = '<span class="saved" aria-hidden="true">✓ Guardado</span>';
// Hoy and Historial can show the same day at once: scope keeps their ids apart.
function wId(scope, ds, k){ return "w" + scope + "-" + ds + "-" + k; }
function wFieldHTML(scope, ds, d, f){
  const v = d[f.k] || "";
  return '<div class="wf' + (v ? " has" : "") + '">' +
    '<label class="f" for="' + wId(scope, ds, f.k) + '"><span>' + f.label + ' <small>' + f.hint + '</small></span>' + SAVED + '</label>' +
    '<textarea class="grow wt" rows="' + (v ? 1 : 3) + '" id="' + wId(scope, ds, f.k) + '" data-w="' + f.k + '" data-ds="' + ds + '">' + esc(v) + '</textarea>' +
  '</div>';
}
// only: for Historial, list just the priorities that have text.
function prioHTML(ds, d, title, only){
  const pr = d.priorities || [], dn = d.prioDone || [];

/* ---------- guided timers: ejercicio and visualización ---------- */
// Time is derived from the clock, not counted per tick, so it stays right when iOS pauses the page.
const EX_TOTAL = STEPS.reduce(function(a, s){ return a + s.secs; }, 0);
const VIS_SECS = 60;

function exCue(i){
  const s = STEPS[i];
  if(!s) return "";
  if(i === STEPS.length - 1) return "Último: piernas en la silla, respira lento.";
  if(s.round === 2 && s.ex === CIRCUIT[0][0]) return "Ronda dos: " + s.ex.toLowerCase() + ".";
  return "Sigue: " + s.ex.toLowerCase() + ".";
}
function visSteps(){
  return filled(state.settings.visualization.items).map(function(v, i){
    return {name: v.label.trim() || "Pregunta " + (i + 1), text: v.text.trim(), secs: VIS_SECS};
  });
}

const runs = {
  ejercicio: {
    storeKey: "savers:timer",
    steps: function(){ return STEPS; },
    enter: function(i, how){
      const s = STEPS[i];
      beep(s.rest ? 520 : 880, how === "start" ? .15 : .18);
      if(how === "start" && i === 0) say("Marchar en el sitio, un minuto.");
      else if(s.rest) say(exCue(i + 1));
      else if(how === "skip") say(exCue(i));
    },
    second: function(i, remain){
      if(remain > 0 && remain <= 3) beep(660, .08);
      // Steps with no 5-second change before them get announced a few seconds early.
      const next = STEPS[i + 1];
      if(remain === 6 && next && !next.rest && !STEPS[i].rest) say(exCue(i + 1));
    },
    finish: function(){
      beep(988, .25); setTimeout(function(){ beep(1318, .35); }, 260);
      say("Listo. Ejercicio marcado.");
      return {letter: "ejercicio", toast: "Ejercicio terminado y marcado"};
    },
    view: function(r, idx, done){
      if(!r.started) return {now: done ? "¡Listo! Buen trabajo" : "Listo para empezar", next: "Primero: marchar en el sitio"};
      const s = STEPS[idx], nx = STEPS[idx + 1];
      return {
        now: s.rest ? "Cambia de ejercicio" : s.name,
        next: nx ? "Sigue: " + (nx.rest ? (STEPS[idx + 2] ? STEPS[idx + 2].name : "") : nx.name) : "Último bloque"
      };
    }
  },
  visualizacion: {
    storeKey: "savers:timer:vis",
    steps: visSteps,
    enter: function(i, how){
      const s = visSteps()[i]; if(!s) return;
      if(how === "start") beep(880, .15); else bell();
      say(s.text);
    },
    second: function(i, remain){ if(remain === 10) softTone(); },
    finish: function(){
      bell();
      setTimeout(function(){ say("Visualización lista."); }, 700);
      return {letter: "visualizacion", toast: "Visualización lista y marcada"};
    },
    view: function(r, idx, done){
      const list = visSteps();
      if(!r.started) return {now: done ? "Visualización lista" : "Cierra los ojos y escucha", next: done ? "" : "La voz te lee cada pregunta y te da un minuto."};
      const s = list[idx] || {name: "", text: ""};
      return {now: "Pregunta " + (idx + 1) + " de " + list.length, next: s.text};
    }
  }
};
Object.keys(runs).forEach(function(k){
  Object.assign(runs[k], {key: k, running: false, base: 0, runStart: 0, started: false, lastIdx: 0, lastRemain: null, day: null});
});
let runIv = null, wake = null;

function anyRunning(){ return Object.keys(runs).some(function(k){ return runs[k].running; }); }
function runTotal(r){ return r.steps().reduce(function(a, s){ return a + s.secs; }, 0); }
function stepStart(r, i){ const st = r.steps(); let t = 0; for(let k = 0; k < i; k++) t += st[k].secs; return t; }
function elapsedSecs(r){ return r.base + (r.running ? (Date.now() - r.runStart) / 1000 : 0); }
function stepAt(r, el){
  const st = r.steps();
  let i = 0, t = 0;
  while(i < st.length - 1 && el >= t + st[i].secs){ t += st[i].secs; i++; }
  return i;
}
function persistRun(r){
  if(r.started) store.set(r.storeKey, {base: r.base, runStart: r.runStart, running: r.running, day: r.day});
  else { try { localStorage.removeItem(r.storeKey); } catch(e){} }
}
function restoreRuns(){
  Object.keys(runs).forEach(function(k){
    const r = runs[k], t = store.get(r.storeKey);
    if(!t || t.day !== todayStr() || !r.steps().length){ try { localStorage.removeItem(r.storeKey); } catch(e){} return; }
    r.base = Number(t.base) || 0; r.runStart = Number(t.runStart) || Date.now();
    r.started = true; r.running = !!t.running; r.day = t.day;
    const el = elapsedSecs(r), total = runTotal(r);
    if(el >= total + 600){ resetRun(r); return; }
    r.lastIdx = stepAt(r, Math.min(el, total - 0.001));
  });
  syncRunLoop();
}
function syncRunLoop(){
  if(anyRunning()){ if(!runIv) runIv = setInterval(tickRuns, 250); requestWake(); }
  else { clearInterval(runIv); runIv = null; releaseWake(); }
}

function beep(freq, dur){ tone(freq, freq, dur, 0.16); }
async function requestWake(){
  try {
    if(navigator.wakeLock && anyRunning() && document.visibilityState === "visible" && !wake){
      wake = await navigator.wakeLock.request("screen");
      wake.addEventListener("release", function(){ wake = null; });
    }
  } catch(e){ wake = null; }
}
function releaseWake(){ try { if(wake) wake.release(); } catch(e){} wake = null; }

function startRun(r){
  if(!r.steps().length) return;
  Object.keys(runs).forEach(function(k){ if(runs[k] !== r && runs[k].running) pauseRun(runs[k]); });
  setAudioMode(runAudioMode());
  ensureAudio();
  unlockSpeech();
  const fresh = !r.started;
  if(fresh){ r.base = 0; r.lastIdx = 0; r.day = todayStr(); }
  r.running = true; r.started = true; r.runStart = Date.now(); r.lastRemain = null;
  if(fresh) r.enter(0, "start"); else beep(880, .15);
  persistRun(r);
  syncRunLoop();
  updateRunUI(r);
}
function pauseRun(r, keepAudioMode){
  if(r.running) r.base = elapsedSecs(r);
  r.running = false;
  syncRunLoop();
  if(keepAudioMode !== true && !anyRunning()) setAudioMode("ambient");
  persistRun(r);
  updateRunUI(r);
}
function resetRun(r){
  pauseRun(r);
  try { if(window.speechSynthesis) speechSynthesis.cancel(); } catch(e){}
  r.base = 0; r.started = false; r.lastIdx = 0; r.lastRemain = null;
  persistRun(r); updateRunUI(r);
}
function skipStep(r){
  if(!r.steps().length) return;
  if(!r.started){ setAudioMode(runAudioMode()); ensureAudio(); unlockSpeech(); r.started = true; r.day = todayStr(); r.base = 0; }
  const idx = stepAt(r, elapsedSecs(r));
  if(idx >= r.steps().length - 1){ finishRun(r); return; }
  r.base = stepStart(r, idx + 1); r.runStart = Date.now();
  r.lastIdx = idx + 1; r.lastRemain = null;
  r.enter(idx + 1, "skip");
  persistRun(r);
  updateRunUI(r);
}
function tickRuns(){
  Object.keys(runs).forEach(function(k){
    const r = runs[k];
    if(!r.running) return;
    const el = elapsedSecs(r), st = r.steps();
    if(!st.length){ resetRun(r); return; }
    if(el >= runTotal(r)){ finishRun(r); return; }
    const idx = stepAt(r, el);
    if(idx !== r.lastIdx){
      r.lastIdx = idx; r.lastRemain = null;
      r.enter(idx, "auto");
    } else {
      const remain = Math.ceil(stepStart(r, idx) + st[idx].secs - el);
      if(remain !== r.lastRemain){ r.lastRemain = remain; r.second(idx, remain); }
    }
    updateRunUI(r);
  });
}
function finishRun(r){
  pauseRun(r, true);
  const res = r.finish();
  setTimeout(function(){ if(!anyRunning()) setAudioMode("ambient"); }, 4000);
  const ds = r.day || state.today;
  r.base = 0; r.started = false; r.lastIdx = 0; r.lastRemain = null;
  persistRun(r);
  const d = getDay(ds, true);
  if(!d.checks[res.letter]){
    d.checks[res.letter] = true;
    saveDay(ds, 0);
    if(state.viewDate === ds) refreshChecks();
  }
  toast(res.toast);
  updateRunUI(r, true);
}

  return '<div class="timer" data-run="' + key + '">' +

      '<button class="btn primary" data-act="go">Empezar</button>' +
      '<button class="btn" data-act="skip">Siguiente</button>' +
      '<button class="btn" data-act="reset">Reiniciar</button>' +
    '</div>' +
    mixSwitchHTML(key) +
  '</div>';
}
function updateRunUI(r, done){
  const box = $('.timer[data-run="' + r.key + '"]'); if(!box) return;
  const total = runTotal(r);
  const el = Math.min(elapsedSecs(r), Math.max(0, total - 0.001));
  const idx = r.started ? stepAt(r, el) : 0;
  const v = r.view(r, idx, done);
  $('[data-r="now"]', box).textContent = v.now;
  $('[data-r="next"]', box).textContent = v.next;
  let clock = total;
  if(r.started){
    const st = r.steps();
    clock = st[idx] ? Math.max(0, Math.ceil(stepStart(r, idx) + st[idx].secs - el)) : 0;
  }
  $('[data-r="clock"]', box).textContent = Math.floor(clock / 60) + ":" + pad(clock % 60);
  $('[data-r="bar"]', box).style.width = (r.started && total ? el / total * 100 : 0) + "%";
  $('[data-act="go"]', box).textContent = r.running ? "Pausar" : (r.started ? "Seguir" : "Empezar");
}
function updateAllRunUI(){ Object.keys(runs).forEach(function(k){ updateRunUI(runs[k]); }); }

/* ---------- lectura: the Reloj timer comes from an iOS shortcut ---------- */
const READ_MIN = 4;
const READ_SHORTCUT = "Lectura SAVERS";
let readIv = null;
function readingState(){
  const r = store.get("savers:reading");
  return r && r.day === todayStr() && Number(r.start) ? r : null;
}
function clearReading(){ try { localStorage.removeItem("savers:reading"); } catch(e){} syncReading(); }
function readLeft(r){ return Math.max(0, Math.ceil(READ_MIN * 60 - (Date.now() - Number(r.start)) / 1000)); }
function startReading(){
  store.set("savers:reading", {day: todayStr(), start: Date.now()});
  syncReading();
  location.href = "shortcuts://run-shortcut?name=" + encodeURIComponent(READ_SHORTCUT);
}
function finishReading(){
  const r = store.get("savers:reading");
  clearReading();
  if(!r || !r.day) return;
  const d = getDay(r.day, true);
  if(d.checks.lectura) return;
  d.checks.lectura = true;
  saveDay(r.day, 0);
  if(state.viewDate === r.day) refreshChecks();
  if(countDone(d) === 6){ completeSound(); toast("¡Mañana completa!"); }
  else { popSound(); toast("Lectura marcada"); }
}
function syncReading(){
  const r = readingState();
  if(r && readLeft(r) === 0){ finishReading(); return; }
  if(r && !readIv) readIv = setInterval(syncReading, 1000);
  if(!r){ clearInterval(readIv); readIv = null; }
  const box = $(".timer[data-read]"); if(!box) return;
  const left = r ? readLeft(r) : 0;
  $('[data-rd="now"]', box).textContent = r ? "Leyendo" : READ_MIN + " minutos";
  $('[data-rd="next"]', box).textContent = r ? "Faltan " + Math.floor(left / 60) + ":" + pad(left % 60) + ". Se marca sola al volver." : "Se abre Libros y el Reloj te avisa al terminar.";
  $('[data-rd="go"]', box).hidden = !!r;
  $('[data-rd="done"]', box).hidden = !r;
  $('[data-rd="cancel"]', box).hidden = !r;
}
function readingHTML(){
  return '<div class="timer" data-read>' +
      '<div class="tm-now" data-rd="now">' + READ_MIN + ' minutos</div>' +
      '<div class="tm-next" data-rd="next">Se abre Libros y el Reloj te avisa al terminar.</div>' +
      '<div class="row">' +
        '<button class="btn primary" data-rd="go">Empezar lectura</button>' +
        '<button class="btn primary" data-rd="done" hidden>Ya terminé</button>' +
        '<button class="btn" data-rd="cancel" hidden>Cancelar</button>' +
      '</div>' +
    '</div>';
}
function shortcutHelpHTML(){

    '<li>Abre la app <b>Atajos</b> y toca <b>+</b>.</li>' +

/* ---------- history ---------- */
const openEntries = new Set();
function renderHistory(){
  const root = $("#view-history");
  const y = state.month.y, m = state.month.m;
  const first = new Date(y, m, 1);
  const daysIn = new Date(y, m + 1, 0).getDate();
  const monthName = first.toLocaleDateString("es", {month:"long", year:"numeric"});
  let completeMonth = 0, scheduledPast = 0;
  for(let i=1;i<=daysIn;i++){
    const ds = fmt(new Date(y, m, i));
    if(isScheduled(ds) && ds <= state.today){ scheduledPast++; if(isComplete(ds)) completeMonth++; }
  }
  const totalChecks = Object.values(state.days).reduce(function(a, d){ return a + countDone(d); }, 0);

  let html = '<div class="top"><h2 class="sec">Historial</h2><span class="status" id="status"></span></div>' +
    '<div class="stats">' +
      '<div class="stat"><b>' + streak() + '</b><span>Días seguidos</span></div>' +
      '<div class="stat"><b>' + completeMonth + '/' + scheduledPast + '</b><span>Mañanas completas este mes</span></div>' +
      '<div class="stat"><b>' + totalChecks + '</b><span>Letras marcadas en total</span></div>' +
    '</div>' +
    '<div class="monthnav"><button class="navbtn" id="m-prev" aria-label="Mes anterior">‹</button><h3>' + esc(monthName) + '</h3><button class="navbtn" id="m-next" aria-label="Mes siguiente">›</button></div>' +
    '<div class="cal">' + ["D","L","M","M","J","V","S"].map(function(x){ return '<div class="dow">' + x + '</div>'; }).join("");
  for(let b=0; b<first.getDay(); b++) html += '<div class="cell blank"></div>';
  for(let i=1;i<=daysIn;i++){
    const ds = fmt(new Date(y, m, i));
    const d = state.days[ds];
    const n = countDone(d);
    const cls = ["cell"];
    const future = ds > state.today;
    const t = dayType(ds);
    const off = t === "shabbat" || (t === "domingo" && !hasContent(d));
    if(off) cls.push("off");
    if(future && !off) cls.push("future");
    if(n === 6) cls.push("full");
    if(ds === state.today) cls.push("today");
    const label = longDate(ds) + (off ? "" : ", " + n + " de 6");
    html += '<button class="' + cls.join(" ") + '" style="--p:' + (n/6) + '" data-day="' + ds + '"' + (future || t === "shabbat" ? " disabled" : "") + ' aria-label="' + esc(label) + '"><span>' + i + '</span></button>';
  }
  html += '</div><p class="legend">El anillo se llena con cada letra. Toca un día para ver o completar su registro.</p>';

  const entries = [];
  for(let i=daysIn;i>=1;i--){
    const ds = fmt(new Date(y, m, i));
    const d = state.days[ds];
    if(hasContent(d)) entries.push([ds, d]);
  }
  html += '<h3 class="sub">Registros del mes</h3>';
  if(!entries.length){
    html += '<div class="empty">Todavía no hay registros este mes. Marca tu primera letra en Hoy.</div>';
  } else {
    html += '<div class="entries">' + entries.map(function(e){
      const ds = e[0], d = e[1];
      const open = openEntries.has(ds);
      const text = d.gratitude ? "Agradezco: " + d.gratitude : (d.priorities || []).filter(Boolean).join(", ") || d.bookIdea || d.notes || "";
      return '<div class="entry' + (open ? " open" : "") + '" data-entry="' + ds + '">' +
        '<button class="entry-h" aria-expanded="' + open + '" aria-controls="eb-' + ds + '"><b><span>' + esc(shortDate(ds)) + '</span><em>' + countDone(d) + ' de 6</em><span class="caret" aria-hidden="true"></span></b>' + (text ? '<p>' + esc(text) + '</p>' : '') + '</button>' +
        '<div class="entry-b" id="eb-' + ds + '"' + (open ? "" : " hidden") + '>' +
          (hasWriting(d) ? writingReadHTML(ds, d) : '<p class="none">Este día no escribiste nada.</p>') +
          '<button class="linkbtn" data-day="' + ds + '">Abrir día en Hoy</button>' +
        '</div>' +
      '</div>';
    }).join("") + '</div>';
  }
  root.innerHTML = html;
  setStatus(statusMsg);

  fitFields(root);
  $$(".entry-h", root).forEach(function(h){
    h.addEventListener("click", function(){
      const box = h.parentElement, ds = box.getAttribute("data-entry");
      const open = !openEntries.has(ds);
      if(open) openEntries.add(ds); else openEntries.delete(ds);
      box.classList.toggle("open", open);
      h.setAttribute("aria-expanded", open);
      $(".entry-b", box).hidden = !open;
      if(open) fitFields(box);
    });
  });
  $("#m-prev").addEventListener("click", function(){ state.month.m--; if(state.month.m < 0){ state.month.m = 11; state.month.y--; } renderHistory(); });
  $("#m-next").addEventListener("click", function(){ state.month.m++; if(state.month.m > 11){ state.month.m = 0; state.month.y++; } renderHistory(); });
  $$("[data-day]", root).forEach(function(b){
    b.addEventListener("click", function(){
      if(b.disabled) return;
      state.viewDate = b.getAttribute("data-day");
      if(dayType(state.viewDate) === "domingo") state.showSunday = true;
      switchTab("today");
    });
  });
}

function autoGrow(el){ el.style.height = "auto"; el.style.height = (el.scrollHeight + 2) + "px"; }
function rerenderGuideKeepScroll(focusSel, block){
  const y = window.scrollY;
  renderGuide();
  window.scrollTo(0, y);
  if(focusSel){ const f = $(focusSel); if(f){ f.focus({preventScroll: true}); f.scrollIntoView({block: block || "nearest", behavior: "smooth"}); } }
}
function editList(key){ return key === "aff" ? state.edit.affirmations : state.edit.visualization.items; }
function isEditDirty(){ return !!state.edit && JSON.stringify(state.edit) !== state.editSnapshot; }

function startEdit(){
  state.edit = {name: state.settings.name, affirmations: clone(state.settings.affirmations), visualization: clone(state.settings.visualization)};
  state.editSnapshot = JSON.stringify(state.edit);
  renderGuide();
  window.scrollTo(0, 0);
}
function commitEdit(){
  const e = state.edit;
  function clean(items){
    const out = items.map(function(a){ return {label: a.label.trim(), text: a.text.trim()}; }).filter(function(a){ return a.label || a.text; });
    return out.length ? out : [{label: "", text: ""}];
  }
  state.settings.name = e.name.trim();
  state.settings.affirmations = clean(e.affirmations);
  state.settings.visualization = {items: clean(e.visualization.items), note: e.visualization.note.trim()};
  state.edit = null;
  flushSave();
}
function endEdit(save){
  if(save && isEditDirty()){ commitEdit(); toast("Cambios guardados"); }
  state.edit = null;
  renderGuide();
  window.scrollTo(0, 0);
}

(function bindGuide(){
  const root = $("#view-guide");
  root.addEventListener("click", function(ev){
    const b = ev.target.closest("[data-act]");
    if(!b || b.disabled) return;
    const act = b.getAttribute("data-act");
    if(act === "edit") return startEdit();
    if(act === "sched"){ state.schedTab = b.getAttribute("data-type"); return rerenderGuideKeepScroll(); }
    if(act === "cancel") return endEdit(false);
    if(act === "done") return endEdit(true);
    if(act === "export") return exportBackup();
    if(act === "import") return $("#import-file").click();
    const key = b.getAttribute("data-list");
    if(!state.edit || !key) return;
    const list = editList(key);
    const i = Number(b.getAttribute("data-i"));
    if(act === "add"){
      list.push({label: "", text: ""});
      rerenderGuideKeepScroll("#e-" + key + "-t-" + (list.length - 1), "center");
    } else if(act === "del" && list.length > 1){
      list.splice(i, 1);
      rerenderGuideKeepScroll();
    } else if(act === "up" && i > 0){
      const t = list[i-1]; list[i-1] = list[i]; list[i] = t;
      rerenderGuideKeepScroll('[data-act="up"][data-list="' + key + '"][data-i="' + (i-1) + '"]');
    } else if(act === "down" && i < list.length - 1){
      const t = list[i+1]; list[i+1] = list[i]; list[i] = t;
      rerenderGuideKeepScroll('[data-act="down"][data-list="' + key + '"][data-i="' + (i+1) + '"]');
    }
  });
  root.addEventListener("input", function(ev){
    const el = ev.target;
    if(!state.edit) return;
    if(el.tagName === "TEXTAREA" && el.classList.contains("grow")) autoGrow(el);
    if(el.hasAttribute("data-ename")) state.edit.name = el.value;
    else if(el.hasAttribute("data-evnote")) state.edit.visualization.note = el.value;
    else if(el.hasAttribute("data-elist")){
      const item = editList(el.getAttribute("data-elist"))[Number(el.getAttribute("data-i"))];
      if(item) item[el.getAttribute("data-k")] = el.value;
    }
  });
})();

/* ---------- tabs ---------- */
function switchTab(tab){
  state.tab = tab;
  $$(".tab").forEach(function(b){ if(b.getAttribute("data-tab") === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  $("#view-today").hidden = tab !== "today";
  $("#view-history").hidden = tab !== "history";
  $("#view-guide").hidden = tab !== "guide";
  if(tab === "today") renderToday();
  if(tab === "history") renderHistory();
  if(tab === "guide"){ state.schedTab = null; renderGuide(); }
  window.scrollTo(0, 0);
}
$$(".tab").forEach(function(b){ b.addEventListener("click", async function(){
  const t = b.getAttribute("data-tab");
  if(state.tab === "guide" && t !== "guide" && state.edit){
    if(isEditDirty()){
      const v = await ask("¿Guardar los cambios?", "Hiciste cambios en Mi guía.", [
        {label: "Descartar", value: "discard"},
        {label: "Guardar", value: "save", primary: true},
        {label: "Seguir editando", value: "stay", link: true}
      ]);
      if(v === "stay") return;
      if(v === "save"){ commitEdit(); toast("Cambios guardados"); }
    }
    state.edit = null;
  }
  if(t === "today" && state.tab === "today" && state.viewDate !== state.today){ state.viewDate = state.today; }
  if(t === "history"){ const d = new Date(); if(state.tab !== "history"){ state.month = {y:d.getFullYear(), m:d.getMonth()}; } }
  switchTab(t);
}); });

/* ---------- date rollover and returning to the app ---------- */
function checkRollover(){
  const t = todayStr();
  if(t === state.today) return;
  const wasToday = state.viewDate === state.today;
  state.today = t;
  if(wasToday) state.viewDate = t;
  state.showSunday = false;
  const a = document.activeElement;
  if(a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT")) return;
  if(anyRunning() || state.tab === "guide") return;
  switchTab(state.tab);
}
setInterval(checkRollover, 30000);
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "hidden"){ flushSave(); return; }
  checkRollover();
  syncReading();
  if(anyRunning()){
    try { if(audio.ctx && audio.ctx.state !== "running") audio.ctx.resume(); } catch(e){}
    requestWake();
    tickRuns();
  }
});

/* ---------- boot ---------- */
store.load();
restoreRuns();
syncReading();
switchTab("today");

if("serviceWorker" in navigator && location.protocol === "https:"){
  window.addEventListener("load", function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
})();
</script>
