<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Prueba de sonido</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F2EE; --surface:#FFFFFF; --ink:#1B2538; --muted:#5E6677; --line:#E0DDD6; --sky:#3B5A8C; --press:rgba(16,21,31,.05);
  --display:"Bricolage Grotesque", system-ui, sans-serif; --body:"Atkinson Hyperlegible", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#10151F; --surface:#1B2538; --ink:#E6E9F0; --muted:#9AA3B5; --line:#3A4660; --sky:#9DB4DB; --press:rgba(255,255,255,.06); color-scheme: dark; }
}
:root[data-theme="dark"]{ --bg:#10151F; --surface:#1B2538; --ink:#E6E9F0; --muted:#9AA3B5; --line:#3A4660; --sky:#9DB4DB; --press:rgba(255,255,255,.06); color-scheme: dark; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
main{max-width:440px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 32px)}
h1{font:800 1.6rem/1.15 var(--display);margin:0 0 6px}
p{margin:0 0 10px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:16px}
.step{font:700 .9rem var(--body);color:var(--muted);margin:0}
#big{font:800 2rem/1.15 var(--display);text-align:center;padding:26px 0 18px;min-height:3.8em;display:flex;align-items:center;justify-content:center}
#big.now{color:var(--sky)}
button{display:block;width:100%;text-align:left;font:700 1.05rem/1.3 var(--body);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:14px;margin-top:10px;cursor:pointer}
button:active{background:var(--press)}
button.main{background:var(--sky);color:var(--bg);border-color:var(--sky);text-align:center}
#answers[hidden], #run[hidden]{display:none}
.info{font-size:.78rem;color:var(--muted);margin-top:14px;word-break:break-word}
</style>
</head>
<body>
<main>
  <h1>Prueba de sonido</h1>
  <p>Pon música en 24six con buen volumen y apaga el silencio (interruptor del costado). Son 3 pruebas cortas, una a la vez.</p>

  <div class="card">
    <p class="step" id="step"></p>
    <div id="big" aria-live="polite"></div>
    <button class="main" id="run">Empezar</button>
    <div id="answers" hidden></div>
  </div>

  <p class="info" id="info"></p>
</main>
<script>
var busy = false, done = [], ctx = null;
function $(id){ return document.getElementById(id); }
function show(t, now){ $("big").textContent = t; $("big").classList.toggle("now", !!now); }
function setType(mode){ try { if(navigator.audioSession) navigator.audioSession.type = mode; } catch(e){} }
function info(){
  $("info").textContent = "Modo real: " + (navigator.audioSession ? navigator.audioSession.type : "no disponible") + " · " + navigator.userAgent;
}
function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
async function countdown(){
  for(var n = 3; n >= 1; n--){ show("Escucha tu música… " + n); await wait(1000); }
}
function newCtx(){
  var C = window.AudioContext || window.webkitAudioContext, c = new C();
  var lim = c.createDynamicsCompressor();           // keeps the loud sounds from clipping
  lim.threshold.value = -3; lim.knee.value = 0; lim.ratio.value = 20; lim.attack.value = .001; lim.release.value = .05;
  lim.connect(c.destination); c.out = lim; c.resume();
  return c;
}
// A woodblock: a pitched knock that drops a little, plus a short noise click for the attack.
function knock(c, t, f, peak, dur){
  dur = dur || .09;
  var o = c.createOscillator(), g = c.createGain();
  o.type = "triangle";
  o.frequency.setValueAtTime(f * 1.25, t); o.frequency.exponentialRampToValueAtTime(f, t + .015);
  o.connect(g); g.connect(c.out);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + .002); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.start(t); o.stop(t + dur + .02);
  var len = Math.floor(c.sampleRate * .03), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
  for(var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  var n = c.createBufferSource(), bp = c.createBiquadFilter(), ng = c.createGain();
  n.buffer = buf; bp.type = "bandpass"; bp.frequency.value = f * 2; bp.Q.value = 1.5;
  n.connect(bp); bp.connect(ng); ng.connect(c.out);
  ng.gain.setValueAtTime(peak * .7, t); ng.gain.exponentialRampToValueAtTime(.0001, t + .02);
  n.start(t); n.stop(t + .03);
}
function tone(c, t, f, dur, peak){
  var o = c.createOscillator(), g = c.createGain();
  o.frequency.value = f; o.connect(g); g.connect(c.out);
  g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(peak, t + .05);
  g.gain.setValueAtTime(peak, t + dur - .1); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.start(t); o.stop(t + dur + .02);
}
function spanishVoice(){
  var vs = speechSynthesis.getVoices();
  return vs.filter(function(v){ return /^es[-_]MX/i.test(v.lang); })[0] || vs.filter(function(v){ return /^es/i.test(v.lang); })[0] || null;
}

var TESTS = [
  {
    title: "Prueba 1 de 3 · ¿La música se pausa y vuelve sola?",
    // "transient-solo" should pause other audio; closing the context lets iOS tell 24six it may resume.
    run: async function(){
      setType("transient-solo"); info();
      await countdown();
      ctx = newCtx();
      var t = ctx.currentTime + .05;
      show("AHORA", true); info();
      knock(ctx, t, 1250, .9); tone(ctx, t + .3, 523, 1.6, .25); knock(ctx, t + 2, 820, .9);
      await wait(2400);
      var c = ctx; ctx = null; await c.close().catch(function(){});
      setType("ambient");
      for(var n = 6; n >= 1; n--){ show("¿Vuelve tu música sola? " + n); await wait(1000); }
      show("¿Qué pasó con tu música?"); info();
    },
    answers: ["Se pausó y volvió sola", "Se pausó y NO volvió", "No se pausó, siguió igual", "Bajó un poco y volvió"],
    after: "Si tu música se quedó pausada, dale play en 24six antes de seguir."
  },
  {
    title: "Prueba 2 de 3 · La voz del iPhone",
    run: async function(){
      setType("ambient"); info();
      await countdown();
      show("AHORA: escucha la voz", true);
      await new Promise(function(res){
        var u = new SpeechSynthesisUtterance("Baja. Sube. Baja. Sube. Sostén.");
        var v = spanishVoice(); if(v) u.voice = v;
        u.lang = v ? v.lang : "es-MX"; u.rate = .95;
        u.onend = res; u.onerror = res;
        speechSynthesis.cancel(); speechSynthesis.speak(u);
        setTimeout(res, 9000);
      });
      await wait(1500);
      show("Mientras hablaba, ¿tu música…?"); info();
    },
    answers: ["Bajó y volvió", "Siguió igual", "Se pausó", "No escuché la voz"]
  },
  {
    title: "Prueba 3 de 3 · ¿Se escuchan los clacs sobre tu música?",
    run: async function(){
      setType("ambient"); info();
      await countdown();
      ctx = newCtx();
      var t0 = ctx.currentTime + .05;
      for(var r = 0; r < 2; r++){
        var b = t0 + r * 6;
        knock(ctx, b, 1250, .9);                                    // sube
        knock(ctx, b + 2, 1900, .38, .035); knock(ctx, b + 3, 1900, .38, .035);   // sostén: tics
        knock(ctx, b + 4, 820, .9);                                 // baja
      }
      var labels = [[0, "Clac: sube"], [2000, "Tic… tic…"], [4000, "Clac: baja"], [6000, "Clac: sube"], [8000, "Tic… tic…"], [10000, "Clac: baja"]];
      var start = Date.now();
      for(var i = 0; i < labels.length; i++){ await wait(Math.max(0, labels[i][0] - (Date.now() - start))); show(labels[i][1], true); }
      await wait(2200);
      var c = ctx; ctx = null; c.close().catch(function(){});
      show("¿Se escuchaban bien?"); info();
    },
    answers: ["Claros, se escuchan bien", "Se escuchan, pero bajito", "Se pierden en la música"]
  }
];

var at = 0;
function load(){
  if(at >= TESTS.length){
    $("step").textContent = "Listo, dile esto a Claude:";
    show(done.join(" · "));
    $("big").style.fontSize = "1.25rem";
    $("run").hidden = true; $("answers").hidden = true;
    return;
  }
  $("step").textContent = TESTS[at].title;
  show("Listo");
  $("run").hidden = false; $("answers").hidden = true;
}
$("run").addEventListener("click", async function(){
  if(busy) return;
  busy = true; $("run").hidden = true;
  try { await TESTS[at].run(); } catch(e){ show("Error: " + e.message); }
  busy = false;
  var box = $("answers"); box.innerHTML = "";
  if(TESTS[at].after){ var p = document.createElement("p"); p.textContent = TESTS[at].after; p.style.margin = "0"; box.appendChild(p); }
  TESTS[at].answers.forEach(function(a){
    var b = document.createElement("button"); b.textContent = a;
    b.addEventListener("click", function(){ done.push((at + 1) + ": " + a); at++; load(); });
    box.appendChild(b);
  });
  var again = document.createElement("button"); again.textContent = "Repetir esta prueba";
  again.addEventListener("click", function(){ load(); });
  box.appendChild(again);
  box.hidden = false;
});
if(window.speechSynthesis) speechSynthesis.getVoices();
load(); info();
</script>
</body>
</html>
